    a |= 0; a = (a + 0x6D2B79F5) | 0;

/* precompute each hole's centerline polyline (pts, cumulative d, tangents) */
for (const H of HOLES) {
  const pts = [[0, 0]];
  let ang = 0, d = 0;
  const marks = H.bend.map(b => b[0] * H.yds);
  const stops = [...marks, H.yds];
  let prev = 0;
  for (let i = 0; i < stops.length; i++) {
    const seg = stops[i] - prev;
    const last = pts[pts.length - 1];
    pts.push([last[0] + Math.sin(ang) * seg, last[1] + Math.cos(ang) * seg]);
    prev = stops[i];
    if (i < H.bend.length) ang += H.bend[i][1] * Math.PI / 180;
  }
  H.pts = pts;
  // cumulative distances + per-segment unit tangents
  H.segD = [0]; H.tan = [];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dz = pts[i][1] - pts[i - 1][1];
    const L = Math.hypot(dx, dz);
    H.segD.push(H.segD[i - 1] + L);
    H.tan.push([dx / L, dz / L]);
  }
  H.len = H.segD[H.segD.length - 1];
}
/* point on centerline at distance d -> [x, z, tx, tz] (t = unit tangent).
   d EXTRAPOLATES beyond both ends — behind-green bunkers (12, 13) and the
   backdrop pines live past H.len; clamping used to collapse them ONTO the
   green (hole 12's back bunkers buried the pin in sand). */
const _clp = [0, 0, 0, 0];
function clPoint(H, d) {
  let i = 0;
  while (i < H.segD.length - 2 && d > H.segD[i + 1]) i++;
  const t = H.tan[i], p = H.pts[i], u = d - H.segD[i];
  _clp[0] = p[0] + t[0] * u; _clp[1] = p[1] + t[1] * u;
  _clp[2] = t[0]; _clp[3] = t[1];
  return _clp;
}
/* (d, off) -> world [x, z]; +off is RIGHT of the direction of play */
function clWorld(H, d, off) {
  const p = clPoint(H, d);
  return [p[0] + p[3] * off, p[1] - p[2] * off];
}
/* nearest (d, off) of a world point — scan segments (few, exact) */
const _dof = [0, 0];
function clDoff(H, x, z) {
  let bd = 0, boff = 0, best = 1e18;
  for (let i = 0; i < H.tan.length; i++) {
    const ax = H.pts[i][0], az = H.pts[i][1];
    const tx = H.tan[i][0], tz = H.tan[i][1];
    const L = H.segD[i + 1] - H.segD[i];
    let u = (x - ax) * tx + (z - az) * tz;
    u = clamp(u, 0, L);
    const px = ax + tx * u, pz = az + tz * u;
    const dd = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (dd < best) {
      best = dd;
      bd = H.segD[i] + u;
      boff = (x - px) * tz - (z - pz) * tx;   // + = right of play
    }
  }
  _dof[0] = bd; _dof[1] = boff;
  return _dof;
}

/* ── input layer (unified pad + keyboard; edges latched per rAF) ── */
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
  if (!e.repeat) { keys[e.code] = 2; kickAudio(); }
  else if (!keys[e.code]) keys[e.code] = 1;
});
/* a keyup must not destroy an unconsumed edge — a fast tap can land entirely
   between two rAFs (slow frames, 120 Hz keyboards): 2 = fresh edge (held),
   1 = held (consumed), 3 = released with the edge still pending, 0 = up */
window.addEventListener('keyup', e => { keys[e.code] = keys[e.code] === 2 ? 3 : 0; });
const kDown = c => keys[c] === 1 || keys[c] === 2;
function kEdge(c) {
  if (keys[c] === 2) { keys[c] = 1; return true; }
  if (keys[c] === 3) { keys[c] = 0; return true; }
  return false;
}

const IN = {
  aim: 0,                     // held left/right, -1..1
  confirm: false, back: false, pause: false, peek: false,
  clubUp: false, clubDown: false,
  up: false, down: false, left: false, right: false,
  p2join: false, confirm2: false, any: false,
};
let prevLx0 = 0, prevLy0 = 0;
function gatherInput() {
  IN.aim = 0;
  let held = 0;
  if (kDown('ArrowLeft') || kDown('KeyA')) held -= 1;
  if (kDown('ArrowRight') || kDown('KeyD')) held += 1;
  if (kEdge('Space')) { IN.confirm = true; IN.any = true; }
  if (kEdge('Escape') || kEdge('Enter')) { IN.pause = true; IN.any = true; }
  if (kEdge('Tab') || kEdge('KeyG')) { IN.peek = true; IN.any = true; }
  if (kEdge('BracketLeft')) { IN.clubUp = true; IN.any = true; }     // longer club
  if (kEdge('BracketRight')) { IN.clubDown = true; IN.any = true; }  // shorter club
  if (kEdge('ArrowUp') || kEdge('KeyW')) { IN.up = true; IN.clubUp = true; IN.any = true; }
  if (kEdge('ArrowDown') || kEdge('KeyS')) { IN.down = true; IN.clubDown = true; IN.any = true; }
  if (kEdge('ArrowLeft') || kEdge('KeyA')) { IN.left = true; IN.any = true; }
  if (kEdge('ArrowRight') || kEdge('KeyD')) { IN.right = true; IN.any = true; }
  if (kEdge('Digit2')) { IN.p2join = true; IN.any = true; }
  if (window.ArcadeController) {
    const p = ArcadeController.pad(0);
    if (p && p.connected) {
      const ax = p.axis('lx') || 0, ay = p.axis('ly') || 0;
      if (Math.abs(ax) > 0.2) held += ax;
      if (p.button('left')) held -= 1;
      if (p.button('right')) held += 1;
      if (p.justPressed('south')) { IN.confirm = true; IN.any = true; }
      if (p.justPressed('east')) { IN.back = true; IN.any = true; }
      if (p.justPressed('north')) { IN.peek = true; IN.any = true; }
      if (p.justPressed('start')) { IN.pause = true; IN.any = true; }
      if (p.justPressed('l1')) { IN.clubUp = true; IN.any = true; }     // longer
      if (p.justPressed('r1')) { IN.clubDown = true; IN.any = true; }   // shorter
      if (p.justPressed('up') || (prevLy0 > -0.5 && ay <= -0.5)) { IN.up = true; IN.clubUp = true; IN.any = true; }
      if (p.justPressed('down') || (prevLy0 < 0.5 && ay >= 0.5)) { IN.down = true; IN.clubDown = true; IN.any = true; }
      if (p.justPressed('left') || (prevLx0 > -0.5 && ax <= -0.5)) { IN.left = true; IN.any = true; }
      if (p.justPressed('right') || (prevLx0 < 0.5 && ax >= 0.5)) { IN.right = true; IN.any = true; }
      prevLx0 = ax; prevLy0 = ay;
      if (IN.any) kickAudio();
    }
    const p2 = ArcadeController.pad(1);
    if (p2 && p2.connected) {
      if (p2.justPressed('south')) { IN.p2join = true; IN.confirm2 = true; IN.any = true; kickAudio(); }
      if (p2.justPressed('start')) { IN.p2join = true; IN.any = true; kickAudio(); }
      // in 2P, pad(1) drives P2's shot: mirror the core verbs
      if (PLAYERS.length > 1 && turn === 1) {
        const ax2 = p2.axis('lx') || 0;
        if (Math.abs(ax2) > 0.2) held += ax2;
        if (p2.button('left')) held -= 1;
        if (p2.button('right')) held += 1;
        if (p2.justPressed('south')) IN.confirm = true;
        if (p2.justPressed('north')) IN.peek = true;
        if (p2.justPressed('l1')) IN.clubUp = true;
        if (p2.justPressed('r1')) IN.clubDown = true;
        if (p2.justPressed('up')) IN.clubUp = true;
        if (p2.justPressed('down')) IN.clubDown = true;
      }
    }
  }
  IN.aim = clamp(held, -1, 1);
}
function clearEdges() {
  IN.confirm = IN.back = IN.pause = IN.peek = false;
  IN.clubUp = IN.clubDown = false;
  IN.up = IN.down = IN.left = IN.right = false;
  IN.p2join = IN.any = false; IN.confirm2 = false;
}

/* direct-manipulation gestures: click/tap = meter press; horizontal drag on
   the world = aim.  Touches owned by the injected #__arcade_touchpad overlay
   are skipped — the virtual pad drives pad(0) instead (touchpad-v1). */
const DRAG = { on: false, id: -1, x0: 0, moved: 0, kind: '' };
function touchpadOwns(t) {
  const n = t && t.target;
  return !!(n && n.closest && n.closest('#__arcade_touchpad'));
}
stage.addEventListener('pointerdown', e => {
  kickAudio();
  if (e.pointerType === 'touch' && touchpadOwns(e)) return;
  DRAG.on = true; DRAG.id = e.pointerId; DRAG.x0 = e.clientX; DRAG.moved = 0;
});
stage.addEventListener('pointermove', e => {
  if (!DRAG.on || e.pointerId !== DRAG.id) return;
  const dx = e.clientX - DRAG.x0;
  DRAG.moved = Math.max(DRAG.moved, Math.abs(dx));
  if (DRAG.moved > 8) { dragAim(dx); DRAG.x0 = e.clientX; }
});
function endDrag(e) {
  if (!DRAG.on || e.pointerId !== DRAG.id) return;
  DRAG.on = false;
  if (DRAG.moved <= 8) { IN.confirm = true; IN.any = true; }
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', e => { DRAG.on = false; });
let dragAimAcc = 0;                     // consumed by the address state
function dragAim(dxPx) { dragAimAcc += dxPx; }

/* ── audio (all synth, lazy ctx) ── */
let AC = null, master = null;
function kickAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
}
function tone(freq, t0, dur, vol, type, glideTo) {
  const o = AC.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(t0, dur, vol, f0, f1, q, type) {
  const len = Math.max(1, (AC.sampleRate * dur) | 0), buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
  f.frequency.setValueAtTime(f0, t0);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
/* filtered-noise sweep: bandpassed noise whose center frequency rises then
   falls (air being cut) with an amplitude envelope riding the sweep */
function noiseSweep(t0, dur, vol, f0, fPeak, f1, q) {
  const len = Math.max(1, (AC.sampleRate * dur) | 0), buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1.1;
  f.frequency.setValueAtTime(f0, t0);
  f.frequency.exponentialRampToValueAtTime(fPeak, t0 + dur * 0.42);
  f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.38);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
/* the golf sounds are LAYERED PHYSICAL SYNTHESIS, not chiptune bleeps
   (John's law): noise buffers + biquads + exponential envelopes.  Slight
   random detune per shot so repeats never sound identical. */
const SFX = {
  // air being cut: intensity and brightness ride the shot power
  whoosh(pow) { if (!AC) return; const t = AC.currentTime;
    const dt2 = 1 + (Math.random() - 0.5) * 0.1;
    noiseSweep(t, 0.26 + 0.14 * pow, 0.1 + 0.3 * pow, 240 * dt2, (900 + 2900 * pow) * dt2, 340, 1.0);
    if (pow > 0.5) noiseSweep(t + 0.03, 0.2, 0.08 * pow, 700, 4200 * pow * dt2, 800, 1.6); },
  // contact = click transient + damped body thump + per-club resonant color
  strike(pow, kind) { if (!AC) return; const t = AC.currentTime;
    const dt2 = 1 + (Math.random() - 0.5) * 0.08;
    const v = 0.55 + 0.45 * pow;
    noiseBurst(t, 0.008, 0.26 * v, 5200 * dt2, 3200, 0.7, 'highpass');      // the click
    if (kind === 'dr') {                                                    // hollow "pock"
      tone(96 * dt2, t, 0.1, 0.2 * v, 'sine', 52);
      noiseBurst(t, 0.05, 0.2 * v, 1450 * dt2, 1050, 6.5);
    } else if (kind === 'wood') {
      tone(120 * dt2, t, 0.08, 0.17 * v, 'sine', 60);
      noiseBurst(t, 0.038, 0.16 * v, 1900 * dt2, 1350, 5.5);
    } else {                                                                // irons: crisp
      tone(150 * dt2, t, 0.06, 0.14 * v, 'sine', 80);
      noiseBurst(t, 0.02, 0.2 * v, 3300 * dt2, 2400, 4.5);
    } },
  // putter: soft muted tock
  putt() { if (!AC) return; const t = AC.currentTime;
    const dt2 = 1 + (Math.random() - 0.5) * 0.08;
    noiseBurst(t, 0.012, 0.11, 1250 * dt2, 900, 2.2);
    tone(235 * dt2, t, 0.055, 0.08, 'sine', 140); },
  // turf landing: soft thud (+ a breath of roll noise)
  thud(roll) { if (!AC) return; const t = AC.currentTime;
    tone(105, t, 0.07, 0.09, 'sine', 65);
    noiseBurst(t, 0.05, 0.06, 480, 240, 0.9, 'lowpass');
    if (roll) noiseBurst(t + 0.06, 0.28, 0.028, 850, 480, 0.7, 'lowpass'); },
  // the cup: quick descending damped rattle ticks, then rest
  cup() { if (!AC) return; const t = AC.currentTime;
    const dt2 = 1 + (Math.random() - 0.5) * 0.05;
    const tick = (at, f) => {
      noiseBurst(at, 0.01, 0.16, 3400, 2400, 1.2, 'highpass');
      tone(f * dt2, at, 0.055, 0.11, 'sine', f * 0.55);
    };
    tick(t, 820); tick(t + 0.075, 640); tick(t + 0.165, 470);
    tone(170 * dt2, t + 0.26, 0.16, 0.07, 'sine', 105);
    noiseBurst(t + 0.26, 0.07, 0.05, 500, 280, 1, 'lowpass'); },
  splash() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.35, 0.24, 900, 300, 0.8, 'lowpass');
    noiseBurst(t + 0.22, 0.3, 0.1, 1400, 500, 0.8, 'lowpass');
    tone(220, t, 0.2, 0.08, 'sine', 90); },
  // sand: dull thud + sand-scatter puff
  sand() { if (!AC) return; const t = AC.currentTime;
    tone(78, t, 0.12, 0.13, 'sine', 52);
    noiseBurst(t, 0.14, 0.18, 420, 230, 0.9, 'lowpass');
    noiseBurst(t + 0.015, 0.16, 0.1, 1900, 950, 1.4); },
  bounce() { if (!AC) return; const t = AC.currentTime;
    tone(130, t, 0.04, 0.05, 'sine', 85);
    noiseBurst(t, 0.025, 0.05, 800, 480, 1.2); },
  rustle() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 0.3, 0.16, 2200, 4200, 0.8);
    noiseBurst(t + 0.12, 0.24, 0.1, 1600, 3000, 0.8); },
  // celebrations stay melodic but WARM: sine partials with envelopes
  chime() { if (!AC) return; const t = AC.currentTime;
    [880, 1109, 1319, 1760].forEach((f, i) => {
      tone(f, t + i * 0.11, 0.55, 0.07, 'sine');
      tone(f * 2, t + i * 0.11, 0.3, 0.018, 'sine');
    }); },
  fanfare() { if (!AC) return; const t = AC.currentTime;
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      tone(f, t + i * 0.12, 0.6, 0.08, 'sine');
      tone(f * 2.01, t + i * 0.12, 0.35, 0.02, 'sine');
    });
    tone(2093, t + 0.62, 0.8, 0.025, 'sine'); },
  crowd() { if (!AC) return; const t = AC.currentTime;
    noiseBurst(t, 1.6, 0.1, 500, 1500, 0.5);
    noiseBurst(t + 0.3, 1.4, 0.07, 700, 1800, 0.5); },
  menu() { if (!AC) return; tone(880, AC.currentTime, 0.07, 0.04, 'sine'); },
  confirm() { if (!AC) return; const t = AC.currentTime;
    tone(659, t, 0.12, 0.06, 'sine'); tone(988, t + 0.06, 0.16, 0.05, 'sine'); },
  plunk() { if (!AC) return; const t = AC.currentTime;
    tone(300, t, 0.25, 0.09, 'sine', 120); },
};

/* ── best round (per difficulty, strokes vs par over 18) ── */
function loadBest() {
  try {
    const v = JSON.parse(localStorage.getItem('fairwayclassic_best'));
    if (v && typeof v === 'object') return v;
  } catch (e) {}
  return {};
}
function saveBest(diff, vsPar) {
  try {
    const b = loadBest();
    if (b[diff] === undefined || vsPar < b[diff]) { b[diff] = vsPar; localStorage.setItem('fairwayclassic_best', JSON.stringify(b)); }
  } catch (e) {}
}
function vsParStr(v) { return v === 0 ? 'EVEN' : (v > 0 ? '+' + v : String(v)); }
