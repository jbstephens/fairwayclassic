<script>
/* ═══════════ p4 — sim: ball flight, surfaces, shot mechanics ═══════════ */

let DIFF = 'amateur';        // 'amateur' | 'pro'
const WIND = { mph: 0, dir: 0, ax: 0, az: 0 };
function rollWind(shot) {
  const rng = Math.random;
  const max = DIFF === 'pro' ? 15 : 8;
  if (!shot || WIND.unset !== false || (CUR && CUR.swirl)) {
    WIND.mph = Math.round(rng() * max);
    WIND.dir = rng() * TAU;
  }
  WIND.ax = Math.sin(WIND.dir) * WIND.mph * WIND_K;
  WIND.az = Math.cos(WIND.dir) * WIND.mph * WIND_K;
  WIND.unset = false;
}

/* lie multipliers (design): rough 70% power + wider spread, bunker 55% must
   loft out, fairway/tee/fringe normal */
function lieMul(lie) { return lie === 0 ? 0.7 : lie === 4 ? 0.55 : 1.0; }

const SHOT = {
  aimAng: 0, club: 0, putter: false,
  power: 0, meterV: 0, meterDir: 1,
  arcDirty: true, landX: 0, landZ: 0, puttMax: 20,
  bias: 0, cross: 0,          // FC-7: the live sidehill-lie read
  restX: 0, restZ: 0, rollLen: 0,   // FC-8: the predicted rollout
};
/* FC-8: a preview / witness sim borrows the REAL tickBall.  QUIET mutes the
   side effects that only belong to a shot the player actually hit (sound,
   sand puffs, splashes) so arc = truth costs nothing in the theatre. */
let QUIET = 0;
function meterSpeed() { return DIFF === 'pro' ? 130 : 92; }   // pct per second

function distToPin(x, z) { return Math.hypot(PIN.x - x, PIN.z - z); }
/* FC-7 elevation-aware carry: shots to lower ground fly farther, uphill
   shorter.  The PHYSICS already does this (the ball lands on the real
   terrain) — this is the number the HUD surfaces and the club suggestion
   respects, so the player is told the fact instead of discovering it. */
function pinRise(p) { return clamp(PIN.y - p.ball.y, -40, 40); }

/* ═══ FC-7 SIDEHILL LIES (lite, instructive) ═══
   cross = the ground's rise per yard to the RIGHT of the aim line.  The
   golfer stands to the LEFT of the aim line (see updateVisuals), so ground
   rising to the right puts the BALL ABOVE HIS FEET — which flattens the
   swing and works the shot LEFT.  Below the feet pushes it right.
   Severity is kid-capped, a touch stronger on Pro.  LAW: the AIM ARC
   INCLUDES THE BIAS — the preview and the live shot both take their launch
   angle from lieBias(), so what the arc shows is what the ball does. */
const LIE_CAP = 0.2;
const _lg = [0, 0];
function lieCross(p) {
  if (!CUR || SHOT.putter || p.lie === 2 || p.lie === 5) return 0;
  ballGrad(p.ball.x, p.ball.z, _lg);
  const rx = Math.cos(SHOT.aimAng), rz = -Math.sin(SHOT.aimAng);   // right of aim
  return clamp(_lg[0] * rx + _lg[1] * rz, -LIE_CAP, LIE_CAP);
}
function lieBias(p) {
  if (SHOT.putter) return 0;
  const c = lieCross(p);
  SHOT.cross = c;
  // above the feet (c > 0) pulls LEFT = a SMALLER aim angle
  SHOT.bias = -c * (DIFF === 'pro' ? 0.34 : 0.26);
  return SHOT.bias;
}
/* the instructive HUD line (never descriptive — it says what will happen) */
function lieText(p) {
  if (!p || SHOT.putter || p.lie === 2) return '';
  const c = lieCross(p);
  if (Math.abs(c) < 0.03) return '';
  return c > 0 ? 'BALL ABOVE FEET — drifts left' : 'BALL BELOW FEET — drifts right';
}

/* club auto-suggest by distance remaining (rough/sand penalty considered,
   FC-7: and the elevation change to the pin) */
function suggestClub(p) {
  if (p.lie === 2) { SHOT.putter = true; SHOT.club = 0; return; }
  SHOT.putter = false;
  const d = (distToPin(p.ball.x, p.ball.z) + pinRise(p)) / lieMul(p.lie);
  // shortest club that still carries the distance; too far for anything = DR
  let best = 0;
  for (let i = CLUBS.length - 1; i >= 0; i--) {
    if (CLUBS[i].carry >= d - 4) { best = i; break; }
  }
  // bunker: must loft out — never less loft than 9i
  if (p.lie === 4) best = Math.max(best, 8);
  SHOT.club = best;
  SHOT.arcDirty = true;
}
function aimAtPin(p) {
  // default aim: at the pin when it's reachable, else down the fairway
  // (the centerline point one carry away) so doglegs suggest the smart line
  const d = distToPin(p.ball.x, p.ball.z);
  let tx = PIN.x, tz = PIN.z;
  if (!SHOT.putter) {
    const reach = CLUBS[SHOT.club].carry * lieMul(p.lie);
    if (d > reach + 18) {
      const dof = clDoff(CUR, p.ball.x, p.ball.z);
      const w = clWorld(CUR, Math.min(dof[0] + reach, CUR.len - 14), 0);
      tx = w[0]; tz = w[1];
    }
  }
  SHOT.aimAng = Math.atan2(tx - p.ball.x, tz - p.ball.z);
  SHOT.arcDirty = true;
}

/* ── ball flight state ── */
const FLIGHT = {
  on: false, mode: 'fly', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
  t: 0, treeCool: 0, peakY: 0, power: 0,
  path: new Float32Array(3 * 1200), pathN: 0,
};
function pathPush(x, y, z) {
  if (FLIGHT.pathN >= 1200) return;
  const i = FLIGHT.pathN * 3;
  FLIGHT.path[i] = x; FLIGHT.path[i + 1] = y; FLIGHT.path[i + 2] = z;
  FLIGHT.pathN++;
}

/* ═══ FC-8: DRIVES RIDE THE LAND ═══
   How much a shot RUNS after it lands is the club's business, not the
   turf's alone.  A driver arrives shallow and hot off a low-spin face and
   releases with the contour; a wedge drops steep with spin and checks up.
   runK scales the horizontal speed kept through the touch AND how hard the
   touch reads the slope under it, so a drive onto 10's falling shoulder
   gains another 25 yards while the 8-iron into a green still stops.
   Greens are EXEMPT (FC-7's green behaviour is law) — see tickBall. */
function runKFor(ci) {
  return ci === 0 ? 1.34        // DR
       : ci <= 2 ? 1.22         // 3W / 5W
       : ci <= 4 ? 1.10         // 4i / 5i
       : ci <= 6 ? 1.02         // 6i / 7i
       : ci <= 8 ? 0.94         // 8i / 9i
       : 0.86;                  // PW / SW — the scoring clubs sit down
}
function launchShot(p, power) {
  const c = CLUBS[SHOT.club];
  const mul = lieMul(p.lie);
  const carry = Math.max(3, c.carry * mul * power);
  const loft = c.loft * Math.PI / 180;
  const v = clubV(c, carry);        // FC-5: numeric solve — carry table exact under drag
  let ang = SHOT.aimAng + lieBias(p);   // FC-7: the sidehill works the shot
  if (DIFF === 'pro') ang += (Math.random() - 0.5) * 2 * (power * power) * 0.05;   // ~±2.9 deg at full power
  if (p.lie === 0) ang += (Math.random() - 0.5) * 0.05;
  if (p.lie === 4) ang += (Math.random() - 0.5) * 0.07;
  FLIGHT.on = true; FLIGHT.mode = 'fly'; FLIGHT.t = 0; FLIGHT.treeCool = 0; FLIGHT.touches = 0;
  FLIGHT.rollT = 0;
  FLIGHT.runK = runKFor(SHOT.club);
  FLIGHT.touchX = 0; FLIGHT.touchZ = 0; FLIGHT.touchG = 0; FLIGHT.touchSurf = -1;
  FLIGHT.x = p.ball.x; FLIGHT.y = p.ball.y + 0.2; FLIGHT.z = p.ball.z;
  const ch = Math.cos(loft) * v;
  FLIGHT.vx = Math.sin(ang) * ch;
  FLIGHT.vz = Math.cos(ang) * ch;
  FLIGHT.vy = Math.sin(loft) * v;
  FLIGHT.peakY = FLIGHT.y;
  FLIGHT.pathN = 0; FLIGHT.power = power;
  pathPush(FLIGHT.x, FLIGHT.y, FLIGHT.z);
  if (p.lie === 4 && !QUIET) { SFX.sand(); burst(psSand, FLIGHT.x, FLIGHT.y, FLIGHT.z, 14, 1.2, 1.1); }
}
function launchPutt(p, power) {
  const rollDist = Math.max(0.8, SHOT.puttMax * power);
  const mu = greenMu();
  const v0 = Math.sqrt(2 * mu * rollDist);
  FLIGHT.on = true; FLIGHT.mode = 'roll'; FLIGHT.t = 0; FLIGHT.rollT = 0;
  FLIGHT.x = p.ball.x; FLIGHT.y = p.ball.y; FLIGHT.z = p.ball.z;
  FLIGHT.vx = Math.sin(SHOT.aimAng) * v0;
  FLIGHT.vz = Math.cos(SHOT.aimAng) * v0;
  FLIGHT.vy = 0;
  FLIGHT.runK = 1;
  FLIGHT.pathN = 0; FLIGHT.power = power;
}
function greenMu() { return DIFF === 'pro' ? 0.92 : 1.12; }
function surfMu(s) {
  switch (s) {
    case 2: return greenMu();
    case 3: return 2.0;
    case 1: case 6: return 2.6;
    case 4: return 9.0;
    default: return 6.5;
  }
}
/* FC-7 — how hard the local GRADIENT pulls a rolling ball, per surface.
   Short grass hands the ball to the contour (the green most of all);
   rough and sand grab it.  This is what makes a drive up 10's right half
   feed left off the cant, and a ball short of 9 shed back down. */
function slopeK(s) {
  switch (s) {
    case 2: return 10.5;
    case 3: return 7.6;
    case 1: case 6: return 7.2;
    case 4: return 2.4;
    /* FC-8: the ROUGH reads its own contour harder than FC-7 let it (4.2).
       The environs are SHAPED now — collection hollows and mounding — and a
       shoulder that kills the ball the instant it lands turns every one of
       them back into the uniform strip of rough John was looking past.  It
       still grabs (mu 6.5 untouched); it just lets the land steer on the
       way down. */
    default: return 5.2;
  }
}
/* …and the steepest gradient each surface can HOLD a ball on.  Gentler than
   this and the ball rests where it lies; steeper and it keeps going, which
   is precisely what a false front, a terrace riser and a green-feeder are.
   Explicit numbers (not a friction ratio) so the greens read the same in
   Amateur and Pro, and so gentle lobe contour never makes a settled ball
   creep for five seconds. */
function restGrad(s) {
  switch (s) {
    case 2: return 0.15;
    case 3: return 0.30;
    case 1: case 6: return 0.34;
    case 4: return 0.8;
    default: return 0.55;
  }
}

/* one sim tick of the live ball.  Returns null or an event object. */
const _gr = [0, 0];
function ballGrad(x, z, out) {
  out[0] = (groundH(x + 0.6, z) - groundH(x - 0.6, z)) / 1.2;
  out[1] = (groundH(x, z + 0.6) - groundH(x, z - 0.6)) / 1.2;
  return out;
}
function tickBall() {
  if (!FLIGHT.on) return null;
  FLIGHT.t += DT;
  if (FLIGHT.mode === 'fly') {
    // FC-5 tracer arc: gravity + quadratic air drag (see flatCarry — the
    // per-club launch-speed solver integrates THESE exact lines)
    const spD = Math.hypot(FLIGHT.vx, FLIGHT.vy, FLIGHT.vz);
    FLIGHT.vy -= (GRAV + DRAG_K * spD * FLIGHT.vy) * DT;
    FLIGHT.vx += (WIND.ax - DRAG_K * spD * FLIGHT.vx) * DT;
    FLIGHT.vz += (WIND.az - DRAG_K * spD * FLIGHT.vz) * DT;
    FLIGHT.x += FLIGHT.vx * DT;
    FLIGHT.y += FLIGHT.vy * DT;
    FLIGHT.z += FLIGHT.vz * DT;
    FLIGHT.peakY = Math.max(FLIGHT.peakY, FLIGHT.y);
    if ((FLIGHT.pathN === 0) || FLIGHT.t % (DT * 3) < DT) pathPush(FLIGHT.x, FLIGHT.y, FLIGHT.z);
    // tree canopies knock the ball down
    if (FLIGHT.treeCool > 0) FLIGHT.treeCool -= DT;
    else {
      for (let i = 0; i < TREES.length; i++) {
        const t = TREES[i];
        const dx = FLIGHT.x - t.x, dz = FLIGHT.z - t.z;
        if (dx * dx + dz * dz > t.cr * t.cr) continue;
        if (FLIGHT.y < t.cy0 || FLIGHT.y > t.cy1) continue;
        if (!QUIET) SFX.rustle();
        FLIGHT.vx *= 0.22; FLIGHT.vz *= 0.22;
        FLIGHT.vy = Math.min(FLIGHT.vy, -3);
        FLIGHT.treeCool = 0.5;
        return { ev: 'tree' };
      }
    }
    const g = groundH(FLIGHT.x, FLIGHT.z);
    if (FLIGHT.y <= g && FLIGHT.vy < 0) {
      FLIGHT.y = g;
      const s = surfAt(FLIGHT.x, FLIGHT.z);
      if (s === 5) return waterIn();
      const speed = Math.hypot(FLIGHT.vx, FLIGHT.vz);
      if (s === 4) {   // plugs in sand
        if (!QUIET) { SFX.sand(); burst(psSand, FLIGHT.x, g + 0.2, FLIGHT.z, 16, 1.4, 1.2); }
        FLIGHT.vx *= 0.12; FLIGHT.vz *= 0.12; FLIGHT.vy = 0;
        FLIGHT.mode = 'roll';
        return { ev: 'landed', surf: s };
      }
      // no-drag ballistics land hot: the touch factors do the drag's job.
      // keep = horizontal speed surviving a touch (backspin-ish on greens).
      FLIGHT.touches = (FLIGHT.touches || 0) + 1;
      const keep = s === 2 ? (DIFF === 'pro' ? 0.17 : 0.11)
                 : s === 3 ? 0.18 : s === 0 ? 0.12 : 0.28;
      /* FC-7: the BOUNCE reads the ground too — land on a downslope and the
         ball kicks on and runs; land into a rise and it stands up and dies.
         FC-8: how hard it reads the ground, and how much speed survives at
         all, now belong to the CLUB (runK).  A driver releases down the
         hill; an approach iron checks up.  The GREEN is exempt: FC-7 tuned
         it and the greens are not to move. */
      ballGrad(FLIGHT.x, FLIGHT.z, _gr);
      const hsp0 = Math.hypot(FLIGHT.vx, FLIGHT.vz) || 1;
      const gAlong = (_gr[0] * FLIGHT.vx + _gr[1] * FLIGHT.vz) / hsp0;
      const runK = s === 2 ? 1 : (FLIGHT.runK === undefined ? 1 : FLIGHT.runK);
      const kSlope = clamp(1 - gAlong * (2.4 + (runK - 1) * 7.5), 0.5, 1.85 * runK);
      if (FLIGHT.touches === 1) {
        FLIGHT.touchX = FLIGHT.x; FLIGHT.touchZ = FLIGHT.z;
        FLIGHT.touchG = gAlong; FLIGHT.touchSurf = s;
        // the travel direction AT the pitch mark: the only honest frame for
        // "did it kick low-side?" (a dogleg makes centreline-off lie)
        FLIGHT.touchVX = FLIGHT.vx / hsp0; FLIGHT.touchVZ = FLIGHT.vz / hsp0;
      }
      FLIGHT.vx *= keep * kSlope * runK; FLIGHT.vz *= keep * kSlope * runK;
      /* …and the SIDEWAYS KICK.  FC-7's touch only read the slope along the
         ball's line, so a drive pitching on 13's cant rolled off it politely
         instead of kicking off it.  A ball landing on a side-slope deflects
         AT the pitch mark, toward the low side, and the shallower the club
         arrives the more it kicks.  Greens are exempt (FC-7 law). */
      if (s !== 2 && s !== 4) {
        const gCross = (_gr[0] * FLIGHT.vz - _gr[1] * FLIGHT.vx) / hsp0;  // + = rises right of travel
        const th = clamp(gCross * 1.4 * runK, -0.3, 0.3);                 // + = deflect LEFT
        if (th > 1e-4 || th < -1e-4) {
          const cs2 = Math.cos(th), sn2 = Math.sin(th);
          const nvx = FLIGHT.vx * cs2 - FLIGHT.vz * sn2;
          const nvz = FLIGHT.vz * cs2 + FLIGHT.vx * sn2;
          FLIGHT.vx = nvx; FLIGHT.vz = nvz;
        }
      }
      FLIGHT.vy = Math.min(3.5, -FLIGHT.vy * 0.25 * clamp(1 + gAlong * 1.6, 0.55, 1.4));
      if (FLIGHT.vy < 1.2 || FLIGHT.touches >= 2) {
        FLIGHT.vy = 0; FLIGHT.mode = 'roll';
        return { ev: 'landed', surf: s };
      }
      if (!QUIET) SFX.bounce();
      return { ev: 'bounce', surf: s };
    }
    if (FLIGHT.t > 30) { FLIGHT.on = false; return { ev: 'stopped' }; }   // failsafe
    return null;
  }
  /* ── rolling: THE BALL FOLLOWS THE GROUND (FC-7) ──
     downhill runs out, sidehill kicks to the low side, uphill kills it. */
  const g = groundH(FLIGHT.x, FLIGHT.z);
  FLIGHT.y = g;
  const s = surfAt(FLIGHT.x, FLIGHT.z);
  if (s === 5) return waterIn();
  ballGrad(FLIGHT.x, FLIGHT.z, _gr);
  const sk = slopeK(s);
  FLIGHT.vx -= _gr[0] * sk * DT;
  FLIGHT.vz -= _gr[1] * sk * DT;
  const sp = Math.hypot(FLIGHT.vx, FLIGHT.vz);
  /* TERMINATION LAW: a ball on a real cant must ALWAYS come to rest.  Past
     5 s of rolling the turf grabs progressively; 11 s is a hard stop.  No
     infinite creep down a tilted fairway, ever. */
  FLIGHT.rollT = (FLIGHT.rollT || 0) + DT;
  const grab = FLIGHT.rollT > 5 ? 1 + (FLIGHT.rollT - 5) * 1.2 : 1;
  let mu = surfMu(s);
  mu *= grab;
  if (sp > 0.0001) {
    const dec = Math.min(sp, mu * DT * (1 + sp * 0.06));
    FLIGHT.vx -= FLIGHT.vx / sp * dec;
    FLIGHT.vz -= FLIGHT.vz / sp * dec;
  }
  FLIGHT.x += FLIGHT.vx * DT;
  FLIGHT.z += FLIGHT.vz * DT;
  if (FLIGHT.pathN === 0 || (FLIGHT.t * 60 | 0) % 3 === 0) pathPush(FLIGHT.x, FLIGHT.y, FLIGHT.z);
  // the cup
  const dPin = distToPin(FLIGHT.x, FLIGHT.z);
  const sp2 = Math.hypot(FLIGHT.vx, FLIGHT.vz);
  if (dPin < 0.42) {
    if (sp2 < 5.4) { FLIGHT.on = false; return { ev: 'holed' }; }
    // lip out: deflect
    const nx = (FLIGHT.x - PIN.x) / (dPin || 1), nz = (FLIGHT.z - PIN.z) / (dPin || 1);
    const dot = FLIGHT.vx * nx + FLIGHT.vz * nz;
    FLIGHT.vx -= 1.6 * dot * nx; FLIGHT.vz -= 1.6 * dot * nz;
    FLIGHT.vx *= 0.55; FLIGHT.vz *= 0.55;
    if (!QUIET) SFX.bounce();
  }
  /* A ball only RESTS where the ground lets it: if the local gradient can
     still beat the turf, it keeps going (this is what makes 9's false
     front shed, 14's terrace risers reject a ball, and 16's feeder feed).
     The rollT friction ramp above guarantees that always terminates, and
     11 s is the hard floor. */
  if (FLIGHT.rollT > 11) { FLIGHT.on = false; return { ev: 'stopped', surf: s }; }
  // the same `grab` relaxes what counts as restable ground — otherwise a
  // ball on a feeder slope can be damped to a crawl it is never allowed to
  // stop from, and only the 11 s hard floor ends it
  if (sp2 < 0.32 && Math.hypot(_gr[0], _gr[1]) < restGrad(s) * grab) {
    FLIGHT.on = false;
    return { ev: 'stopped', surf: s };
  }
  return null;
}

/* water: splash + rewind along the recorded path for the drop */
function waterIn() {
  if (!QUIET) { SFX.splash(); SFX.plunk();
    burst(psSplash, FLIGHT.x, FLIGHT.y + 0.3, FLIGHT.z, 22, 1.6, 1.5); }
  const ex = FLIGHT.x, ez = FLIGHT.z;
  const dPinEntry = distToPin(ex, ez);
  let dropX = null, dropZ = null;
  for (let i = FLIGHT.pathN - 1; i >= 0; i--) {
    const x = FLIGHT.path[i * 3], z = FLIGHT.path[i * 3 + 2];
    const s = surfAt(x, z);
    if (s === 5 || s === 4) continue;
    if (DIFF === 'pro' && distToPin(x, z) < dPinEntry - 0.5) continue;   // proper drop: no closer to the hole
    dropX = x; dropZ = z;
    break;
  }
  FLIGHT.on = false;
  return { ev: 'water', ex, ez, dropX, dropZ };
}

/* ═══ FC-8 — THE PREDICTED ROLLOUT ═══
   ARC = TRUTH now has to include the release, so the preview does not
   simulate the roll — it RUNS it.  The live FLIGHT record is saved, the
   ball is handed to the real tickBall at its impact state (quietly), and
   the path it takes to rest is exactly the path the struck ball will take.
   Returns the rest point; fills `out` with the sampled path. */
const _rollPath = [];
function simulateRollout(x, y, z, vx, vy, vz, runK, out) {
  const sv = { on: FLIGHT.on, mode: FLIGHT.mode, x: FLIGHT.x, y: FLIGHT.y, z: FLIGHT.z,
    vx: FLIGHT.vx, vy: FLIGHT.vy, vz: FLIGHT.vz, t: FLIGHT.t, rollT: FLIGHT.rollT,
    pathN: FLIGHT.pathN, touches: FLIGHT.touches, runK: FLIGHT.runK, treeCool: FLIGHT.treeCool };
  QUIET++;
  FLIGHT.on = true; FLIGHT.mode = 'fly'; FLIGHT.t = 0; FLIGHT.rollT = 0;
  FLIGHT.touches = 0; FLIGHT.treeCool = 1e6;      // the arc already flew the canopies
  FLIGHT.runK = runK;
  FLIGHT.x = x; FLIGHT.y = y; FLIGHT.z = z;
  FLIGHT.vx = vx; FLIGHT.vy = vy; FLIGHT.vz = vz;
  if (out) out.length = 0;
  let n = 0;
  for (; n < 1600 && FLIGHT.on; n++) {
    const r = tickBall();
    if (out && (n % 3 === 0)) out.push(FLIGHT.x, FLIGHT.y, FLIGHT.z);
    if (r && (r.ev === 'stopped' || r.ev === 'holed' || r.ev === 'water')) break;
  }
  const rest = [FLIGHT.x, FLIGHT.y, FLIGHT.z];
  if (out) out.push(rest[0], rest[1], rest[2]);
  QUIET--;
  for (const k in sv) FLIGHT[k] = sv[k];
  return rest;
}

/* ── the aim preview (arc for clubs, line/curve for putts) ── */
function simulateArc(p) {
  const n = ARC_N;
  let land = null;
  if (!SHOT.putter) {
    const c = CLUBS[SHOT.club];
    const mul = lieMul(p.lie);
    const carry = Math.max(3, c.carry * mul);
    const loft = c.loft * Math.PI / 180;
    const v = clubV(c, carry);      // SHARED with launchShot — preview == flight
    /* FC-7 arc = truth: the SAME sidehill bias the shot will get, the SAME
       integrator step as tickBall (DT, not a coarse preview dt), and the
       SAME terrain query — so the arc lands where the ball lands, on a
       cant and into a 30-yard elevation change alike. */
    const ang = SHOT.aimAng + lieBias(p);
    let x = p.ball.x, y = p.ball.y + 0.2, z = p.ball.z;
    let vx = Math.sin(ang) * Math.cos(loft) * v;
    let vz = Math.cos(ang) * Math.cos(loft) * v;
    let vy = Math.sin(loft) * v;
    const dt = DT;
    const samples = [];
    let hit = null;
    for (let i = 0; i < 900; i++) {
      const spD = Math.hypot(vx, vy, vz);
      vy -= (GRAV + DRAG_K * spD * vy) * dt;
      vx += (WIND.ax - DRAG_K * spD * vx) * dt;
      vz += (WIND.az - DRAG_K * spD * vz) * dt;
      x += vx * dt; y += vy * dt; z += vz * dt;
      samples.push(x, y, z);
      if (vy < 0 && y <= groundH(x, z)) {
        land = [x, groundH(x, z), z];
        hit = [x, y, z, vx, vy, vz];
        break;
      }
    }
    const m = samples.length / 3;
    for (let i = 0; i < n; i++) {
      const si = Math.min(m - 1, Math.floor(i * m / n));
      arcPos[i * 3] = samples[si * 3];
      arcPos[i * 3 + 1] = samples[si * 3 + 1] + 0.1;
      arcPos[i * 3 + 2] = samples[si * 3 + 2];
    }
    /* …and the TAIL: from that exact impact state, the real touch-down and
       roll model, to rest.  What the player sees is the release he gets. */
    if (hit) {
      const rest = simulateRollout(hit[0], hit[1], hit[2], hit[3], hit[4], hit[5],
        runKFor(SHOT.club), _rollPath);
      SHOT.restX = rest[0]; SHOT.restZ = rest[2];
      SHOT.rollLen = Math.hypot(rest[0] - land[0], rest[2] - land[2]);
      const rm = Math.max(1, _rollPath.length / 3);
      for (let i = 0; i < ROLL_N; i++) {
        const si = Math.min(rm - 1, Math.floor((i + 1) * rm / ROLL_N));
        rollPos[i * 3] = _rollPath[si * 3];
        rollPos[i * 3 + 1] = _rollPath[si * 3 + 1] + 0.12;
        rollPos[i * 3 + 2] = _rollPath[si * 3 + 2];
      }
      rollGeo.attributes.position.needsUpdate = true;
      restRing.position.set(rest[0], groundH(rest[0], rest[2]) + 0.1, rest[2]);
    } else {
      SHOT.restX = land ? land[0] : p.ball.x;
      SHOT.restZ = land ? land[2] : p.ball.z;
      SHOT.rollLen = 0;
    }
  } else {
    SHOT.rollLen = 0;
    // putt: Amateur = curved roll preview; Pro = straight line
    const dPin = distToPin(p.ball.x, p.ball.z);
    SHOT.puttMax = clamp(dPin * 2.5, 6, 90);
    const lineLen = Math.min(dPin * 1.15, SHOT.puttMax);
    if (DIFF === 'amateur') {
      const mu = greenMu();
      let v0 = Math.sqrt(2 * mu * lineLen);
      let x = p.ball.x, z = p.ball.z;
      let vx = Math.sin(SHOT.aimAng) * v0, vz = Math.cos(SHOT.aimAng) * v0;
      const dt = DT;              // FC-7: same step as the live putt roll
      const samples = [];
      for (let i = 0; i < 700; i++) {
        ballGrad(x, z, _gr);
        vx -= _gr[0] * slopeK(2) * dt; vz -= _gr[1] * slopeK(2) * dt;
        const sp = Math.hypot(vx, vz);
        if (sp < 0.3) break;
        const dec = Math.min(sp, surfMu(surfAt(x, z)) * dt * (1 + sp * 0.06));
        vx -= vx / sp * dec; vz -= vz / sp * dec;
        x += vx * dt; z += vz * dt;
        samples.push(x, groundH(x, z), z);
      }
      const m = Math.max(1, samples.length / 3);
      for (let i = 0; i < n; i++) {
        const si = Math.min(m - 1, Math.floor(i * m / n));
        arcPos[i * 3] = samples[si * 3] !== undefined ? samples[si * 3] : p.ball.x;
        arcPos[i * 3 + 1] = (samples[si * 3 + 1] || p.ball.y) + 0.12;
        arcPos[i * 3 + 2] = samples[si * 3 + 2] !== undefined ? samples[si * 3 + 2] : p.ball.z;
      }
      const li = (m - 1) * 3;
      land = samples.length ? [samples[li], samples[li + 1], samples[li + 2]] : null;
    } else {
      for (let i = 0; i < n; i++) {
        const d = lineLen * (i + 1) / n;
        const x = p.ball.x + Math.sin(SHOT.aimAng) * d;
        const z = p.ball.z + Math.cos(SHOT.aimAng) * d;
        arcPos[i * 3] = x; arcPos[i * 3 + 1] = groundH(x, z) + 0.12; arcPos[i * 3 + 2] = z;
      }
      const x = p.ball.x + Math.sin(SHOT.aimAng) * lineLen;
      const z = p.ball.z + Math.cos(SHOT.aimAng) * lineLen;
      land = [x, groundH(x, z), z];
    }
  }
  arcGeo.attributes.position.needsUpdate = true;
  if (land) {
    SHOT.landX = land[0]; SHOT.landZ = land[2];
    ringMesh.position.set(land[0], land[1] + 0.12, land[2]);
    ringMesh.visible = true;
  } else ringMesh.visible = false;
  SHOT.arcDirty = false;
  MAPS.dirty = true;   // hole HUD: aim/club changed → the minimap overlay redraws once
}
</script>
