<script>
/* ═══════════ p3 — world: renderer, sky, hole builder, actors ═══════════
   FC-LOOK-1: lit/graded pipeline (ACES + Lambert + baked AO + one 1024
   shadow map + one post pass), default ON; ?look=0 reverts to the v1 flat
   pipeline.  All laws Pi-measured (gameconsole/lab 2026-09-12, PP-LOOK). */

/* ── renderer / scene / lights (house recipe + look pipeline) ── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: LOOK, powerPreference: 'high-performance', stencil: false,
});
renderer.setPixelRatio(1);
renderer.setSize(VW, VH, false);
renderer.info.autoReset = false;   // manual reset in frame(): shadow + scene + post all counted
/* live-toggleable pipeline flags (kiosk A/B via __fcLook) */
const FX = { shadow: LOOK && !LOWFX, post: LOOK, msaa: false };  // MSAA-RT resolve costs ~21fps on the Pi (measured 2026-09-17: 39.7 vs 60.6); context MSAA can't apply to an RT, so it stays off — __fcLook.toggle('msaa',true) for A/B only
if (LOOK) {
  /* Color pipeline (PP-LOOK law, Pi-measured): the baked vertex colors are
     DISPLAY-REFERRED. outputEncoding stays at the default LinearEncoding
     (pass-through) — adding sRGBEncoding would double-encode and wash the
     whole course out (PP's first-cut failure). ACES lifts midtones and
     desaturates; the grade's gamma/sat knobs below undo exactly that. */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.04;
  renderer.shadowMap.enabled = FX.shadow;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const vigEl = document.getElementById('vignette');
  if (vigEl) vigEl.style.display = 'none';   // the post pass owns the vignette
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, VW / VH, 0.2, 2000);
camera.position.set(0, 4, -12);

const FOGC = LOOK ? 0xdde8d2 : 0xdfe9d8;
scene.fog = new THREE.Fog(FOGC, 260, 850);

/* LOOK_TUNE — the per-scene grade + light knobs (PP pattern; kiosk-tunable
   live via __fcLook.set).  Order in the post shader: black-point subtract →
   per-channel gain → gamma (undoes the ACES midtone lift) → saturation
   (ACES desaturates) → vignette. */
const LOOK_TUNE = {
  sun: 0.88, hemi: 0.44, exp: 1.0,
  lift: [0.022, 0.022, 0.025],
  gain: [1.34, 1.3, 1.22],
  gamma: [1.42, 1.4, 1.44],
  sat: 1.28, vig: 0.28,
};
const sunLight = new THREE.DirectionalLight(0xffedd2, LOOK ? LOOK_TUNE.sun : 1.0);
sunLight.position.set(83, 100, -75);
scene.add(sunLight);
const hemiLight = new THREE.HemisphereLight(0xbfd8ff, 0x6da868, LOOK ? LOOK_TUNE.hemi : 0.55);
scene.add(hemiLight);

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

/* ── merged-geometry kit with cel-ramp baked lighting ── */
const SUNDIR = (() => { const v = [0.5, 0.6, -0.45]; const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();

/* ONE 1024 directional shadow map (LAW: never 2048).  Casters are CURATED:
   golfer, flag, caddie bag, near-corridor tree cones — terrain NEVER casts,
   everything (lambert) receives.  The box follows the camera's subject. */
if (LOOK) {
  sunLight.castShadow = FX.shadow;
  sunLight.shadow.mapSize.set(1024, 1024);
  const shc = sunLight.shadow.camera;
  shc.left = -62; shc.right = 62; shc.top = 62; shc.bottom = -62;
  shc.near = 10; shc.far = 340;
  shc.updateProjectionMatrix();
  sunLight.shadow.bias = -0.0008;
  scene.add(sunLight.target);
}
function aimSun(x, y, z) {
  sunLight.position.set(x + SUNDIR[0] * 150, y + SUNDIR[1] * 150, z + SUNDIR[2] * 150);
  sunLight.target.position.set(x, y, z);
  sunLight.target.updateMatrixWorld();
}

function MD() { return { p: [], c: [] }; }
function bakeCol(nx, ny, nz, c, out) {
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  if (d > 0.55) { out[0] = Math.min(1, c[0] * 1.09 + 0.02); out[1] = Math.min(1, c[1] * 1.05 + 0.015); out[2] = c[2] * 0.98; }
  else if (d > 0.1) { out[0] = Math.min(1, c[0] * 1.0 + 0.01); out[1] = c[1] * 0.97; out[2] = c[2] * 0.95; }
  else if (d > -0.15) { out[0] = c[0] * 0.78; out[1] = c[1] * 0.8; out[2] = c[2] * 0.86; }
  else { out[0] = c[0] * 0.55; out[1] = c[1] * 0.6; out[2] = Math.min(1, c[2] * 0.75 + 0.05); }
}
function bakeColWarm(nx, ny, nz, c, out) {
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  if (d > 0.55) { out[0] = Math.min(1, c[0] * 1.09 + 0.02); out[1] = Math.min(1, c[1] * 1.05 + 0.015); out[2] = c[2] * 0.98; }
  else if (d > 0.1) { out[0] = Math.min(1, c[0] * 1.0 + 0.01); out[1] = c[1] * 0.97; out[2] = c[2] * 0.94; }
  else if (d > -0.15) { out[0] = c[0] * 0.82; out[1] = c[1] * 0.79; out[2] = c[2] * 0.74; }
  else { out[0] = c[0] * 0.6; out[1] = c[1] * 0.55; out[2] = c[2] * 0.48; }
}
const _bc = [0, 0, 0];
function pushTriW(md, ax, ay, az, bx, by, bz, cx, cy, cz, c, warm) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const vx = cx - ax, vy = cy - ay, vz = cz - az;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  (warm ? bakeColWarm : bakeCol)(nx / l, ny / l, nz / l, c, _bc);
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  md.c.push(_bc[0], _bc[1], _bc[2], _bc[0], _bc[1], _bc[2], _bc[0], _bc[1], _bc[2]);
}
/* terrain tri: per-corner colors, one face-normal bake factor for all three */
function pushTriT(md, ax, ay, az, bx, by, bz, cx, cy, cz, ca, cb, cc) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const vx = cx - ax, vy = cy - ay, vz = cz - az;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  bakeCol(nx / l, ny / l, nz / l, ca, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
  bakeCol(nx / l, ny / l, nz / l, cb, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
  bakeCol(nx / l, ny / l, nz / l, cc, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
}
function mdMesh(md, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(md.p), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(md.c), 3));
  // the lit pipeline needs real normals (non-indexed tris → flat facets);
  // lambert surfaces all RECEIVE the one shadow map (terrain never casts)
  if (LOOK && mat && mat.isMeshLambertMaterial) g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  if (LOOK && mat && mat.isMeshLambertMaterial) m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  m.updateMatrix();
  return m;
}
/* outward-wound triangle for lathe-like shapes: face normal must point AWAY
   from the vertical axis at (cx,cz) — inward-wound sides get backface-culled
   and domes read as crescents (found on the azalea banks, v1). */
function triOut(md, cx, cz, A, B, C, c, warm) {
  const nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
  const ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
  const nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
  const mx = (A[0] + B[0] + C[0]) / 3 - cx, mz = (A[2] + B[2] + C[2]) / 3 - cz;
  let hint = nx * mx + nz * mz;
  if (Math.abs(hint) < 1e-9) hint = ny;
  if (hint < 0) pushTriW(md, A[0], A[1], A[2], C[0], C[1], C[2], B[0], B[1], B[2], c, warm);
  else pushTriW(md, A[0], A[1], A[2], B[0], B[1], B[2], C[0], C[1], C[2], c, warm);
}
/* low-poly cone (pine canopy tier) into an MD */
function coneW(md, x, y, z, r, h, seg, c, warm) {
  for (let s = 0; s < seg; s++) {
    const a0 = TAU * s / seg, a1 = TAU * (s + 1) / seg;
    triOut(md, x, z,
      [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r],
      [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r],
      [x, y + h, z], c, warm);
  }
}
function trunkW(md, x, y, z, r, h, c) {
  const seg = 4;
  for (let s = 0; s < seg; s++) {
    const a0 = TAU * s / seg + 0.4, a1 = TAU * (s + 1) / seg + 0.4;
    const b0 = [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r];
    const b1 = [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r];
    const t0 = [x + Math.cos(a0) * r * 0.7, y + h, z + Math.sin(a0) * r * 0.7];
    const t1 = [x + Math.cos(a1) * r * 0.7, y + h, z + Math.sin(a1) * r * 0.7];
    triOut(md, x, z, b0, b1, t1, c, true);
    triOut(md, x, z, b0, t1, t0, c, true);
  }
}
/* bumpy mound (azalea / dogwood bank / boxwood / flower bed) */
function moundW(md, x, y, z, r, hMul, c, rng, warm) {
  const seg = 6, tiers = [[1.0, 0], [0.82, 0.5], [0.5, 0.85], [0, 1.05]];
  for (let i = 0; i < tiers.length - 1; i++) {
    const [r0, h0] = tiers[i], [r1, h1] = tiers[i + 1];
    for (let s = 0; s < seg; s++) {
      const a0 = TAU * s / seg, a1 = TAU * (s + 1) / seg;
      const j = 1 + (rng() - 0.5) * 0.35;
      const cc = [clamp(c[0] * j, 0, 1), clamp(c[1] * j, 0, 1), clamp(c[2] * j, 0, 1)];
      const p00 = [x + Math.cos(a0) * r * r0, y + h0 * r * hMul, z + Math.sin(a0) * r * r0];
      const p01 = [x + Math.cos(a1) * r * r0, y + h0 * r * hMul, z + Math.sin(a1) * r * r0];
      const p10 = [x + Math.cos(a0) * r * r1, y + h1 * r * hMul, z + Math.sin(a0) * r * r1];
      const p11 = [x + Math.cos(a1) * r * r1, y + h1 * r * hMul, z + Math.sin(a1) * r * r1];
      if (r1 < 0.001) {
        triOut(md, x, z, p00, p01, [x, y + h1 * r * hMul, z], cc, warm);
      } else {
        triOut(md, x, z, p00, p01, p11, cc, warm);
        triOut(md, x, z, p00, p11, p10, cc, warm);
      }
    }
  }
}
/* jittered icosahedron blob — deciduous canopies (magnolia/oak/dogwood…) */
const ICO_T = (() => {
  const g = new THREE.IcosahedronGeometry(1, 0);
  const a = g.getAttribute('position').array.slice();
  g.dispose();
  return a;
})();
function ballW(md, x, y, z, r, ry, c, rng) {
  for (let f = 0; f < ICO_T.length; f += 9) {
    const j = 1 + (rng() - 0.5) * 0.22;
    const cc = [clamp(c[0] * j, 0, 1), clamp(c[1] * j, 0, 1), clamp(c[2] * j, 0, 1)];
    pushTriW(md,
      x + ICO_T[f] * r, y + ICO_T[f + 1] * r * ry, z + ICO_T[f + 2] * r,
      x + ICO_T[f + 3] * r, y + ICO_T[f + 4] * r * ry, z + ICO_T[f + 5] * r,
      x + ICO_T[f + 6] * r, y + ICO_T[f + 7] * r * ry, z + ICO_T[f + 8] * r, cc, true);
  }
}

/* ── gradient sky dome + low sun glow + soft clouds (built once) ── */
(function buildSky() {
  const geo = new THREE.SphereGeometry(950, 20, 12);
  const cnt = geo.attributes.position.count;
  const colors = new Float32Array(cnt * 3);
  // richer spring sky: deep zenith blue → luminous mid → warm cream horizon
  const zen = col(0x2f66b5), mid = col(0x82b5e4), hor = col(0xf0ead0);
  const pos = geo.attributes.position;
  for (let i = 0; i < cnt; i++) {
    const y = pos.getY(i) / 950;
    const t = clamp(y, 0, 1);
    const c = t < 0.26 ? mix3(hor, mid, smoothstep(t / 0.26)) : mix3(mid, zen, smoothstep((t - 0.26) / 0.74));
    colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false });
  const dome = new THREE.Mesh(geo, mat);
  dome.renderOrder = -10;
  dome.frustumCulled = false;
  dome.matrixAutoUpdate = false;
  scene.add(dome);
  // sun disc + halo — geometry glow, never post
  const mk = (r, cc, op, blend) => {
    const md = MD();
    for (let s = 0; s < 14; s++) {
      const a0 = TAU * s / 14, a1 = TAU * (s + 1) / 14;
      md.p.push(0, 0, 0, Math.cos(a0) * r, Math.sin(a0) * r, 0, Math.cos(a1) * r, Math.sin(a1) * r, 0);
      md.c.push(cc[0], cc[1], cc[2], cc[0], cc[1], cc[2], cc[0], cc[1], cc[2]);
    }
    return mdMesh(md, new THREE.MeshBasicMaterial({
      vertexColors: true, fog: false, transparent: true, opacity: op,
      blending: blend ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false,
    }));
  };
  const sg = new THREE.Group();
  const halo2 = mk(190, [1, 0.9, 0.66], 0.16, true);   // wide warm wash
  const halo = mk(95, [1, 0.95, 0.78], 0.34, true);
  const disc = mk(34, [1, 0.99, 0.92], 0.95, false);
  sg.add(halo2); sg.add(halo); sg.add(disc);
  sg.position.set(SUNDIR[0] * 880, SUNDIR[1] * 880, SUNDIR[2] * 880);
  sg.lookAt(0, 0, 0);
  scene.add(sg);
  // soft cloud sprites (cap: sun glows + clouds ≤ 15 sprites; LOWFX halves)
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 128;
  const g2 = cnv.getContext('2d');
  const puff = (px, py, pr, a) => {
    const gr = g2.createRadialGradient(px, py, pr * 0.1, px, py, pr);
    gr.addColorStop(0, 'rgba(255,253,248,' + a + ')');
    gr.addColorStop(0.6, 'rgba(252,250,246,' + (a * 0.55) + ')');
    gr.addColorStop(1, 'rgba(250,248,246,0)');
    g2.fillStyle = gr;
    g2.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  };
  puff(90, 74, 62, 0.85); puff(140, 62, 52, 0.8); puff(180, 76, 46, 0.75);
  puff(60, 82, 40, 0.7); puff(118, 84, 58, 0.6);
  const ctex = new THREE.CanvasTexture(cnv);
  const cmat = new THREE.SpriteMaterial({ map: ctex, transparent: true, depthWrite: false, fog: false, opacity: 0.9 });
  const CLOUDS = LOWFX ? 3 : 6;
  const cseed = mulberry32(777);
  for (let i = 0; i < CLOUDS; i++) {
    const s = new THREE.Sprite(cmat);
    const a = (i / CLOUDS) * TAU + cseed() * 0.9;
    const r = 540 + cseed() * 200;
    s.position.set(Math.cos(a) * r, 130 + cseed() * 130, Math.sin(a) * r);
    s.scale.set(280 + cseed() * 160, 95 + cseed() * 45, 1);
    scene.add(s);
  }
})();

/* ── shared materials (never disposed) ── */
const MAT_TERRAIN = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                         : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_SCENERY = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                         : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_WATER = new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_SHINE = new THREE.MeshBasicMaterial({
  color: 0xbfe8ff, transparent: true, opacity: 0.1,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const MAT_PROPS = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                       : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_ARROWS = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide });
const MAT_SHADOW = new THREE.MeshBasicMaterial({ color: 0x123317, transparent: true, opacity: 0.32, depthWrite: false });
// caster-only material: writes no color — the shadow pass draws its depth
const MAT_CASTER = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });

/* ── per-hole state (rebuilt at each hole transition) ── */
let CUR = null;            // current hole record
let groundH = (x, z) => 0; // physics-authoritative terrain height (== rendered tris)
let anaColorAt = null;
const HOLE_OBJS = [];      // meshes to remove+dispose on transition
const TREES = [];          // {x, z, cr, cy0, cy1} canopy collision volumes
const WATERS = [];         // resolved water shapes (world-space test fns)
/* THE POCO OPEN — the two new sim volumes.  Both are WORLD-space (hole-local
   == world for the live hole), both empty on Magnolia, so tickBall pays
   nothing for them there. */
const HOUSES = [];         // {x, z, c, s, a, b, top} oriented boxes: giant bumpers
const TRAMPS = [];         // {x, z, r} back-yard trampolines (bounce pads)
/* FC-10 — the two volumes that make a neighborhood play like one.
   FENCES: back-yard runs, 0.9 yd.  A ball that hits one drops on the side it
   hit from, which is what turns a lawn hop into a CARRY.
   CURBS: the kerb line of every street.  A slow ball trying to leave the
   roadway stalls at the lip and runs the gutter downhill instead. */
const FENCES = [];         // {ax, az, bx, bz, ux, uz, len, top}
const CURBS = [];          // {ax, az, bx, bz, nx, nz, len} (n points INTO the street)
let FENCE_GRID = null, CURB_GRID = null;
let BUCKET = null;         // the orange pail that replaces the cup on POCO
let PIN = { x: 0, y: 0, z: 0 };
let PINFO = null;          // FC-8 pin-sanity record for the current hole
let GREEN = null;          // {x, z, grx, grz, tx, tz, nx, nz, h}
let flagGrp = null, flagCloth = null;
let waterShine = null;
let greenArrows = null;
let treeCaster = null;     // curated near-corridor shadow casters (LOOK)

function disposeHole() {
  for (const m of HOLE_OBJS) {
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material && m.material.dispose && ![MAT_TERRAIN, MAT_SCENERY, MAT_WATER, MAT_SHINE, MAT_PROPS, MAT_ARROWS, MAT_SHADOW, MAT_CASTER].includes(m.material)) m.material.dispose();
  }
  HOLE_OBJS.length = 0;
  TREES.length = 0;
  WATERS.length = 0;
  HOUSES.length = 0;
  TRAMPS.length = 0;
  FENCES.length = 0;
  CURBS.length = 0;
  FENCE_GRID = null; CURB_GRID = null;
  BUCKET = null;
  flagGrp = null; flagCloth = null; waterShine = null; greenArrows = null;
  treeCaster = null;
}

/* profile interpolator: [[frac, value]] control points, smoothstep between.
   Shared by the elevation, cant and fairway-width profiles (FC-7). */
function profAt(e, f) {
  if (!e || !e.length) return 0;
  f = clamp(f, 0, 1);
  for (let i = 0; i < e.length - 1; i++) {
    if (f <= e[i + 1][0] || i === e.length - 2) {
      const t = smoothstep((f - e[i][0]) / (e[i + 1][0] - e[i][0] || 1));
      return lerp(e[i][1], e[i + 1][1], t);
    }
  }
  return e[e.length - 1][1];
}
/* elevation profile: [[frac, yds]] control points, smoothstep between */
function elevAt(H, d) { return profAt(H.elv, d / H.len); }
/* FC-7 lateral cant: yd of rise per yd to the RIGHT of play.  Positive tips
   the fairway toward the player's LEFT, so the right half FEEDS LEFT. */
function cantAt(H, d) { return H.cant ? profAt(H.cant, d / H.len) : 0; }
/* FC-7 landing-area width profile (fairway halfwidth, yds): tight where the
   reward is, generous bailouts.  Falls back to the flat H.fw. */
function fwAt(H, d) { return H.fwv ? profAt(H.fwv, d / H.len) : H.fw; }

/* ═══════════════ FC-8 — THE MESO LAYER (swales, rolls, ridgelets) ═══════════
   FC-7 gave the corridor macro elevation and cant; a round rarely surfaced
   either, because between the elevation stations the land was still a smooth
   ramp.  This is the mid-scale ground — 18-45 yd wavelengths, ~1-2 yds of
   relief — summed from three seeded sinusoids in the corridor frame (d along
   play, off lateral) and folded into the SAME analytic field the mesh and
   groundH both read.  Deterministic per hole; no new triangles.

   THE GRADIENT LAW: a fairway that out-tilts its own cant stops reading as a
   hole and starts reading as noise (and a ball stops resting — restGrad on
   short grass is 0.34).  So the builder scales each hole's amplitude down
   until the field's TYPICAL gradient is under UND_GRAD_TYP and its absolute
   worst — every wave cresting at once — is under UND_GRAD_MAX. */
const UND_GRAD_TYP = 0.155;  // yd of rise per yd, RMS-ish, worst surface
const UND_GRAD_MAX = 0.28;   // the absolute worst, where every wave aligns
const UND_ROUGH = 1.35;      // the environs are allowed to be livelier
let UND_ON = true;           // A/B handle for the harness witness only
let HOL_ON = true;           // …and the same for the collection hollows
function undField(H, idx) {
  const U = H.und || { kind: 'roll', amp: 1.2, wl: 30 };
  const rng = mulberry32(7717 + idx * 419);
  const wl = U.wl || 30;
  const C = [];
  const mk = (wd, wo, w) => C.push({ kd: TAU / wd, ko: TAU / wo, ph: rng() * TAU, w });
  switch (U.kind) {
    case 'ripple':      // 7: tight chattery ground, never a flat lie
      mk(wl, wl * 1.6, 0.5); mk(wl * 0.63, wl * 0.85, 0.32); mk(wl * 2.3, wl * 0.5, 0.28); break;
    case 'swoop':       // 10/11/13: long waves layered under the big cants
      mk(wl * 1.5, wl * 3.4, 0.74); mk(wl * 0.82, wl * 1.5, 0.3); mk(wl * 2.6, wl * 0.85, 0.2); break;
    case 'bench':       // 2/8: stepped shelves with short risers between
      mk(wl * 1.3, wl * 4.2, 0.86); mk(wl * 0.72, wl * 1.7, 0.24); mk(wl * 2.2, wl * 0.95, 0.18); break;
    default:            // 'roll' — 1/5/9/14/17…: swales and rolls
      mk(wl, wl * 2.1, 0.58); mk(wl * 0.59, wl * 1.25, 0.34); mk(wl * 1.9, wl * 0.74, 0.3);
  }
  let wsum = 0, sd = 0, so = 0, qd = 0, qo = 0;
  for (const c of C) {
    wsum += c.w;
    sd += c.w * c.kd; so += c.w * c.ko;
    qd += (c.w * c.kd) * (c.w * c.kd); qo += (c.w * c.ko) * (c.w * c.ko);
  }
  let amp = (U.amp === undefined ? 1.2 : U.amp) / 2;     // record = peak-to-trough relief
  const gTyp = amp * Math.sqrt(Math.max(qd, qo) / 2) / wsum * UND_ROUGH;
  const gMax = amp * Math.max(sd, so) / wsum * UND_ROUGH;
  const k = Math.min(1, UND_GRAD_TYP / (gTyp || 1), UND_GRAD_MAX / (gMax || 1));
  amp *= k;
  /* ══ AND THE HOLE'S OWN CROSS-FALL ALWAYS WINS ══
     A hole's LATERAL tilt is its signature — 10 feeds left off its cant, 13
     tips into the creek, 17 sheds both ways off its ridge — and a meso
     ridgelet that out-tilts it sideways turns that signature into noise.
     Measured twice while building this: a drive on 13 curled the WRONG way
     over a wave crest, and 17's ridge lie went flat where a wave cancelled
     it.  So the lateral gradient is capped against the hole's OWN worst
     cross-fall — the cant AND the crown's fall at the fairway edge, which
     on 17 is the whole hole — with real margin under it.  The cap is spent
     by STRETCHING the cross-corridor wavelengths, never by flattening the
     relief: the swales get broader and run more with the hole, which is
     what fairway swales do anyway, and the along-play rolls that carry the
     look and the rollout keep full strength. */
  const maxCant = H.cant ? Math.max.apply(null, H.cant.map(c => Math.abs(c[1]))) : 0;
  const fwMid = H.fw > 0 ? fwAt(H, H.len * 0.55) : 10;
  const bwMid = fwMid + 16;
  const crownGrad = (H.crown || 0) * 2 * (fwMid / bwMid) / bwMid;
  const latCap = Math.max(0.03, Math.max(maxCant, crownGrad) * 0.4);
  let gLat = amp * so / wsum * UND_ROUGH;
  if (gLat > latCap) {
    const kl = latCap / gLat;
    for (const c of C) c.ko *= kl;
    so *= kl; gLat = latCap;
  }
  const bench = U.kind === 'bench';
  const f = function (d, off) {
    let v = 0;
    for (let i = 0; i < C.length; i++) {
      const c = C[i];
      v += Math.sin(d * c.kd + off * c.ko + c.ph) * c.w;
    }
    v /= wsum;
    if (bench) {
      /* the shelves: the summed wave is quantised into three benches joined
         by short smooth risers — the stepped ground 2 and 8 climb through */
      const t = clamp(v * 0.5 + 0.5, 0, 0.99999) * 3;
      const s = Math.floor(t);
      v = ((s + smoothstep(clamp((t - s - 0.32) / 0.36, 0, 1))) / 3) * 2 - 1;
    }
    return v * amp;
  };
  f.kind = U.kind || 'roll';
  f.wl = wl;
  f.relief = +(amp * 2).toFixed(3);
  f.gTyp = +(gTyp * k).toFixed(4);
  f.gMax = +(amp * Math.max(sd, so) / wsum * UND_ROUGH).toFixed(4);
  f.gLat = +gLat.toFixed(4);
  f.cant = +maxCant.toFixed(3);
  return f;
}

/* ═══════════ THE POCO OPEN — the ground the neighborhood claims ═══════════
   FC-10: THE MAP IS THE PLAYFIELD.  Streets, sidewalks, cart paths,
   cul-de-sacs, school blacktop, painted courts, diamond hardpan, park lawn
   and — the new one — every LOT'S OWN LAWN are not extra geometry: they are
   part of the ONE ground field, so the mesh, its colour and the physics lie
   can never disagree, and they cost zero triangles and zero draw calls.

   at(x, z) -> 0 nothing claims it (SCRUFF) · 1 asphalt · 2 sidewalk
               · 3 court paint · 4 hardpan · 5 park / field grass
               · 6 a watered lawn · 7 a summer-dry lawn
   Highest claim wins, in POCO.md's order: water > diamond sand > pavement >
   LAWN > park grass > scruff.  (Water and sand are applied by the field
   itself, above this index.)

   Two out-params ride along with a query, because the colour pass and the
   curb physics both need more than the code: _giLot is the index of the lot
   whose lawn was hit (-1 if none) and _giEdge is the signed distance to the
   nearest street EDGE (negative = out in the roadway), which is what makes
   a curb a curb.
   Segments are bucketed on a 16-yd grid; regions, discs and lots are few
   enough to scan.  Hole-local (x, z) IS world space for the live hole.   */
const PAVE_CELL = 16;
/* the kerb lip: how far the roadway sits below the lawn beside it.  Small
   on purpose — it is a lip to trip a dying ball, not a wall. */
const CURB_LIP = 0.15;
let _giLot = -1, _giEdge = 1e9;
function makeGroundIndex(H) {
  const S = H.scenery;
  if (!S) return null;
  const segs = [];
  const addLine = (arr, court) => {
    for (const s of arr) {
      const hw = s[0] / 2, sw = s[1], pts = s[2];
      for (let i = 1; i < pts.length; i++) {
        segs.push({ ax: pts[i - 1][0], az: pts[i - 1][1], bx: pts[i][0], bz: pts[i][1],
          hw, sw, r: hw + sw, court: court ? 1 : 0 });
      }
    }
  };
  addLine(S.streets, false);
  addLine(S.paths, false);
  addLine(S.drives || [], false);
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const s of segs) {
    minX = Math.min(minX, s.ax - s.r, s.bx - s.r); maxX = Math.max(maxX, s.ax + s.r, s.bx + s.r);
    minZ = Math.min(minZ, s.az - s.r, s.bz - s.r); maxZ = Math.max(maxZ, s.az + s.r, s.bz + s.r);
  }
  if (!segs.length) { minX = minZ = 0; maxX = maxZ = 1; }
  const nx = Math.max(1, Math.ceil((maxX - minX) / PAVE_CELL));
  const nz = Math.max(1, Math.ceil((maxZ - minZ) / PAVE_CELL));
  const cells = new Array(nx * nz);
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    const i0 = clamp(Math.floor((Math.min(s.ax, s.bx) - s.r - minX) / PAVE_CELL), 0, nx - 1);
    const i1 = clamp(Math.floor((Math.max(s.ax, s.bx) + s.r - minX) / PAVE_CELL), 0, nx - 1);
    const j0 = clamp(Math.floor((Math.min(s.az, s.bz) - s.r - minZ) / PAVE_CELL), 0, nz - 1);
    const j1 = clamp(Math.floor((Math.max(s.az, s.bz) + s.r - minZ) / PAVE_CELL), 0, nz - 1);
    for (let j = j0; j <= j1; j++) for (let i2 = i0; i2 <= i1; i2++) {
      const k = j * nx + i2;
      (cells[k] || (cells[k] = [])).push(s);
    }
  }
  const regions = (S.regions || []).map(g => ({ k: g[0], s: g[1], x: g[2], z: g[3],
    a: g[4], b: g[5], c: Math.cos(g[6]), sn: Math.sin(g[6]), tag: g[7] }));
  const discs = S.discs || [];
  /* THE LAWNS.  A lot is a rotated rectangle in the BOX frame (the same one
     boxOut and houseHit use), carrying its watered/dry flag — which is now
     a lie quality, not just a colour. */
  const lots = (S.lots || []).map((l, i) => ({ x: l[0], z: l[1], c: Math.cos(l[2]), s: Math.sin(l[2]),
    a: l[3], b: l[4], dry: l[5], i, rr: (l[3] + 0.5) * (l[3] + 0.5) + (l[4] + 0.5) * (l[4] + 0.5) }));
  // what wins where two claims overlap (POCO.md's surface priority)
  const RANK = [0, 6, 5, 7, 4, 1, 3, 2];
  function at(x, z) {
    let best = 0;
    _giLot = -1; _giEdge = 1e9;
    for (let i = 0; i < lots.length; i++) {
      const g = lots[i];
      const dx = x - g.x, dz = z - g.z;
      if (dx * dx + dz * dz > g.rr) continue;
      const u = dx * g.c - dz * g.s, v = dx * g.s + dz * g.c;
      if (u > -g.a && u < g.a && v > -g.b && v < g.b) { best = g.dry ? 7 : 6; _giLot = i; break; }
    }
    for (let i = 0; i < regions.length; i++) {
      const g = regions[i];
      const dx = x - g.x, dz = z - g.z;
      const u = dx * g.c + dz * g.sn, v = -dx * g.sn + dz * g.c;
      const inside = g.s === 0 ? (u * u) / (g.a * g.a) + (v * v) / (g.b * g.b) < 1
                               : (u < g.a && u > -g.a && v < g.b && v > -g.b);
      if (!inside) continue;
      const code = g.k === 0 ? (g.tag === 'tennis' || g.tag === 'court' ? 3 : 1) : g.k === 1 ? 5 : 4;
      if (RANK[code] > RANK[best]) { best = code; if (code !== 5) _giLot = -1; }
    }
    for (let i = 0; i < discs.length; i++) {
      const dx = x - discs[i][0], dz = z - discs[i][1];
      if (dx * dx + dz * dz < discs[i][2] * discs[i][2]) { _giLot = -1; _giEdge = -(discs[i][2] - Math.hypot(dx, dz)); return 1; }
    }
    const ix = Math.floor((x - minX) / PAVE_CELL), iz = Math.floor((z - minZ) / PAVE_CELL);
    if (ix >= 0 && ix < nx && iz >= 0 && iz < nz) {
      const bucket = cells[iz * nx + ix];
      if (bucket) {
        let street = 0, walk = 0;
        for (let i = 0; i < bucket.length; i++) {
          const s = bucket[i];
          const dx = s.bx - s.ax, dz = s.bz - s.az;
          const L2 = dx * dx + dz * dz || 1;
          let t = ((x - s.ax) * dx + (z - s.az) * dz) / L2;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const qx = s.ax + dx * t, qz = s.az + dz * t;
          const dd = Math.sqrt((x - qx) * (x - qx) + (z - qz) * (z - qz));
          const e = dd - s.hw;                       // + = outside this roadway
          if (e < _giEdge) _giEdge = e;
          if (e < 0) street = 1;
          else if (s.sw && dd < s.r) walk = 1;
        }
        if (street) { _giLot = -1; return best === 3 ? 3 : 1; }
        if (walk) { _giLot = -1; return best === 3 ? 3 : 2; }
      }
    }
    return best;
  }
  return { at, regions, discs, segs, lots,
    get lot() { return _giLot; }, get edge() { return _giEdge; } };
}

/* ═══════════ FC-10 — WHERE AM I? ═══════════
   The one question the whole course is built to answer.  Given a world point
   on a poco hole, what does the neighborhood call this ground: the water it
   is in, the public place it stands on, or the street it is crossing.
   Returns '' when nothing on the map has a name for it (scruff between two
   blocks is nobody's, and saying so would be noise). */
function placeNameAt(x, z) {
  const H = CUR;
  if (!H || !H.scenery || !FIELD) return '';
  const S = H.scenery, names = S.names || [];
  const dof = clDoff(H, x, z);
  // 1. the water, first — you are IN Murderers Creek, not on Soule Ave
  for (let i = 0; i < FIELD.wat.length; i++) {
    const w = FIELD.wat[i];
    if (!w.name) continue;
    let e;
    if (w.t === 'strip') {
      const dd = dof[0] < w.d0 ? w.d0 - dof[0] : (dof[0] > w.d1 ? dof[0] - w.d1 : 0);
      e = Math.max(dd, Math.abs(dof[1] - w.off) - w.w / 2);
    } else if (w.t === 'pond') {
      const dx = x - w.x, dz = z - w.z;
      const lx = dx * w.tz - dz * w.tx, lz = dx * w.tx + dz * w.tz;
      e = (Math.hypot(lx / w.rx, lz / w.rz) - 1) * Math.min(w.rx, w.rz);
    } else {
      e = Math.abs(dof[0] - w.d) - w.w / 2;
    }
    if (e < 5) return w.name;
  }
  // 2. a named public place you are standing on
  let bestP = '', bestPD = 1e9;
  for (const p of (S.places || [])) {
    const d2 = Math.hypot(x - p[0], z - p[1]);
    if (d2 < p[2] && d2 < bestPD) { bestPD = d2; bestP = names[p[3]] || ''; }
  }
  // 3. …or the street you are crossing
  let bestS = '', bestSD = 1e9;
  for (const set of [S.streets, S.paths]) {
    for (const st of set) {
      if (st[3] === undefined || st[3] < 0) continue;
      const lim = st[0] / 2 + st[1] + 7;
      const pts = st[2];
      for (let i = 1; i < pts.length; i++) {
        const ax = pts[i - 1][0], az = pts[i - 1][1], bx = pts[i][0], bz = pts[i][1];
        const ddx = bx - ax, ddz = bz - az;
        const L2 = ddx * ddx + ddz * ddz || 1;
        const t = clamp(((x - ax) * ddx + (z - az) * ddz) / L2, 0, 1);
        const qx = ax + ddx * t, qz = az + ddz * t;
        const d2 = Math.hypot(x - qx, z - qz);
        if (d2 < lim && d2 < bestSD) { bestSD = d2; bestS = names[st[3]] || ''; }
      }
    }
  }
  // standing in the road beats standing in the corner of a big park
  if (bestS && (bestSD < 6 || !bestP)) return bestS;
  return bestP || bestS;
}

/* the whole-hole analytic field: height + surface + color in one pass */
function makeHoleField(H, idx) {
  const gp = clPoint(H, H.len);
  /* FC-10: the pail stands on a LAWN, and the converter slides that lawn off
     the end of the centerline when the centerline ends in a pond, on the
     asphalt or inside somebody's front room.  green.off is that slide. */
  const gOff = H.green.off || null;
  const gx = gp[0] + (gOff ? gOff[0] : 0), gz = gp[1] + (gOff ? gOff[1] : 0);
  const g = H.green;
  /* FC-7: the green complex is ANGLED to the approach line (+ang turns its
     long axis to the right of the approach — 12 is the shallow diagonal).
     Rotating the green frame rotates everything downstream of it for free:
     the surface field, the putt sim, the read arrows, the minimap ellipse
     and the green-read camera all live in this one frame. */
  const ga = (g.ang || 0) * Math.PI / 180;
  const gca = Math.cos(ga), gsa = Math.sin(ga);
  const gtx = gp[2] * gca + gp[3] * gsa;
  const gtz = gp[3] * gca - gp[2] * gsa;
  const grx = g.r * (g.gex || 1), grz = g.r * (g.gex ? 0.55 : 1);
  const gh = elevAt(H, H.len);
  GREEN = { x: gx, z: gz, grx, grz, tx: gtx, tz: gtz, h: gh, sx: g.sx, sz: g.sz, r: g.r };
  // resolved hazards in world space
  const bunk = H.bunkers.map(b => {
    const w = clWorld(H, b[0], b[1]);
    const p = clPoint(H, b[0]);
    return { x: w[0], z: w[1], rx: b[2], rz: b[3], tx: p[2], tz: p[3] };
  });
  const isPocoW = !!H.scenery;
  const wat = H.water.map(w => {
    /* THE POCO OPEN — 'strip': water running PARALLEL to play (the Contra
       Costa Canal down the left of 6).
       FC-10: A CANAL FALLS WITH THE LAND.  v1 levelled the whole strip at
       the minimum elevation of its run, which stood the surface up to two
       yards above the ground at the low end — that is what drowned the
       houses on 6.  The level is taken over a LOCAL window instead (the
       converter mirrors this exactly when it rejects a lot as underwater).
       Magnolia has no strips, so this is poco-only by construction. */
    if (w.t === 'strip') {
      const lvl = d => {
        const at = clamp(d, w.d0, w.d1);
        let m = 1e9;
        for (let k = -2; k <= 2; k++) m = Math.min(m, elevAt(H, clamp(at + k * 14, w.d0, w.d1)));
        return m - 0.6;
      };
      let wl = 1e9;
      for (let k = 0; k <= 6; k++) wl = Math.min(wl, elevAt(H, w.d0 + (w.d1 - w.d0) * k / 6));
      const a = clWorld(H, w.d0, w.off), b = clWorld(H, w.d1, w.off);
      return { t: 'strip', d0: w.d0, d1: w.d1, off: w.off, w: w.w, wl: wl - 0.6, lvl,
        name: w.name || '', ax: a[0], az: a[1], bx: b[0], bz: b[1] };
    }
    /* FC-7: on land that now really falls, a pool sits at the LOW end of
       its own footprint — levelling it at the middle station floods the
       upstream bank (the 16th pond climbed its own shore). */
    if (w.t === 'pond') {
      const c = clWorld(H, w.d, w.off);
      const p = clPoint(H, w.d);
      /* FC-10 (poco only): a back-yard pool 40 yd off the line sits on
         CANTED ground, and a level taken from the centerline alone either
         floods its garden or floats above it. */
      const cn = isPocoW ? cantAt(H, w.d) * clamp(w.off / 26, -1.7, 1.7) * 26 : 0;
      const wl = Math.min(elevAt(H, w.d), elevAt(H, w.d - w.rz), elevAt(H, w.d + w.rz)) + cn - 0.6;
      return { t: 'pond', x: c[0], z: c[1], rx: w.rx, rz: w.rz, tx: p[2], tz: p[3], wl,
        name: w.name || '' };
    }
    const wl = Math.min(elevAt(H, w.d), elevAt(H, w.d + w.w), elevAt(H, w.d - w.w)) - 0.6;
    return { t: 'creek', d: w.d, w: w.w, wl, name: w.name || '' };
  });
  for (const w of wat) WATERS.push(w);
  // local green-frame coords of (x,z)
  function greenLoc(x, z, out) {
    const dx = x - gx, dz = z - gz;
    out[0] = dx * gtz - dz * gtx;      // lateral (right of approach +)
    out[1] = dx * gtx + dz * gtz;      // along approach
  }
  const _gl = [0, 0];
  function waterMask(w, x, z, d, off) {
    if (w.t === 'strip') {
      const dd = d < w.d0 ? w.d0 - d : (d > w.d1 ? d - w.d1 : 0);
      const oo = Math.abs(off - w.off) - w.w / 2;
      return clamp(1 - Math.max(dd, oo) * 0.7, 0, 1);
    }
    if (w.t === 'pond') {
      const dx = x - w.x, dz = z - w.z;
      const lx = dx * w.tz - dz * w.tx, lz = dx * w.tx + dz * w.tz;
      const rr = Math.hypot(lx / w.rx, lz / w.rz);
      return clamp((1 - rr) * 4 + 1, 0, 1);          // 1 inside, 0 outside band
    }
    const dd = Math.abs(d - w.d) - w.w / 2;
    if (Math.abs(off) > 72) return 0;
    return clamp(1 - dd * 0.7, 0, 1);
  }
  function bunkRR(b, x, z) {
    const dx = x - b.x, dz = z - b.z;
    const lx = dx * b.tz - dz * b.tx, lz = dx * b.tx + dz * b.tz;
    return Math.hypot(lx / b.rx, lz / b.rz);
  }
  function bunkMask(b, x, z) { return clamp((1 - bunkRR(b, x, z)) * 3 + 1, 0, 1); }
  /* FC-8 ENVIRONS: collection hollows and sheds, resolved to world space.
     a < 0 GATHERS (a pulled drive funnels in instead of sitting in a
     uniform strip of rough); a > 0 sheds a miss further away. */
  const hol = (H.hol || []).map(k => {
    const w = clWorld(H, k[0], k[1]);
    /* FC-8 LAW: the hollows shape the ENVIRONS — they gather the miss, they
       never swallow the landing area (a bowl reaching across the short grass
       fights the hole's own funnel; measured on 10, where one pulled a drive
       back off the cant).  The authored radius is an upper bound: the inner
       rim is allowed to bite the last few yards of fairway — that is where a
       ball is still MOVING and can actually be gathered — and no further. */
    const fwHere = H.fw > 0 ? fwAt(H, k[0]) : 0;
    const r = Math.max(6, Math.min(k[2], Math.abs(k[1]) - fwHere + 4));
    return { x: w[0], z: w[1], r, r2: r * r, a: k[3], d: k[0], off: k[1] };
  });
  const und = undField(H, idx || 0);
  const isPoco = !!H.scenery;
  const PV = isPoco ? makeGroundIndex(H) : null;   // POCO: the ground as mapped
  /* ═══ FC-7 THE GREEN COMPLEX SURFACE ═══
     plane + multi-lobe contour field + terraces + a false front, in green
     local yards (lat = right of the approach, along = toward the back).
     This is the ONLY place a green's shape is written down: the terrain
     mesh, groundH (physics), the putt sim, the green-read arrows and the
     zoomed minimap all resolve through it. */
  const gLobes = g.lobes || null, gTiers = g.tiers || null, gFF = g.ffront || null;
  function greenPlane(lat, along) {
    let h = gh + g.sx * lat + g.sz * along;
    if (gLobes) for (let i = 0; i < gLobes.length; i++) {
      const L = gLobes[i];
      const dx = lat - L[0], dz = along - L[1];
      const t2 = (dx * dx + dz * dz) / (L[2] * L[2]);
      if (t2 < 1) { const k = 1 - t2; h += L[3] * k * k; }   // C1 at the rim
    }
    if (gTiers) for (let i = 0; i < gTiers.length; i++) {
      const T = gTiers[i];
      h += T[3] * smoothstep((lat * T[0] + along * T[1] - T[2]) / T[4] + 0.5);
    }
    // the false front: everything in front of `at` falls away down the hill
    if (gFF && along < gFF.at) h -= gFF.drop * clamp((gFF.at - along) / gFF.w, 0, gFF.ext);
    return h;

const C_CROSS = col(0xd9cfae);
/* a flat vertical panel (door / window) on a face of a yaw-rotated box */
function panelW(md, cx, cy, cz, w, h, ry, dz, c) {
  const cosR = Math.cos(ry), sinR = Math.sin(ry);
  const W = (lx, ly) => [cx + lx * cosR + dz * sinR, cy + ly, cz - lx * sinR + dz * cosR];
  const a = W(-w / 2, -h / 2), b = W(w / 2, -h / 2), c2 = W(w / 2, h / 2), d = W(-w / 2, h / 2);
  bakeColWarm(Math.sin(ry), 0, Math.cos(ry), c, _bc);
  md.p.push(a[0], a[1], a[2], b[0], b[1], b[2], c2[0], c2[1], c2[2],
            a[0], a[1], a[2], c2[0], c2[1], c2[2], d[0], d[1], d[2]);
  for (let k = 0; k < 6; k++) md.c.push(_bc[0], _bc[1], _bc[2]);
}
/* ═══════════ FC-10 — THE STREET KIT ═══════════
   Curbs, fences and the small hard things that stand along a street.  All of
   it lands in the SAME merged scenery MD as the houses, so the whole kit is
   still zero extra draw calls; the only new call on the whole course is the
   street-sign atlas, which has to carry a texture. */

/* the kerb line of every street: a concrete lip, and the sim volume that
   makes a dying ball stall in the gutter instead of climbing back out */
function buildCurbs(H, sc) {
  const S = H.scenery;
  for (const st of S.streets) {
    const hw = st[0] / 2, pts = st[2];
    /* the kerb AND the walk behind it are ONE concrete ribbon, and both are
       geometry: a 1.6-yd sidewalk sampled on a 2.4-yd terrain grid aliases
       into pale blobs scattered down the street (measured, on 7). */
    const CW = 0.45 + (st[1] || 0);
    for (let i = 1; i < pts.length; i++) {
      const ax = pts[i - 1][0], az = pts[i - 1][1], bx = pts[i][0], bz = pts[i][1];
      const L = Math.hypot(bx - ax, bz - az);
      if (L < 0.6) continue;
      const ux = (bx - ax) / L, uz = (bz - az) / L;
      const nx = uz, nz = -ux;
      for (const side of [-1, 1]) {
        const ex = ax + nx * side * hw, ez = az + nz * side * hw;
        const fx = bx + nx * side * hw, fz = bz + nz * side * hw;
        CURBS.push({ ax: ex, az: ez, bx: fx, bz: fz, ux, uz,
          nx: -nx * side, nz: -nz * side, len: L });
        // …and the concrete it is made of, conformed to the ground
        const n2 = Math.max(1, Math.ceil(L / 7));
        for (let k = 0; k < n2; k++) {
          const t0 = k / n2, t1 = (k + 1) / n2;
          const p0x = ex + (fx - ex) * t0, p0z = ez + (fz - ez) * t0;
          const p1x = ex + (fx - ex) * t1, p1z = ez + (fz - ez) * t1;
          const o0x = p0x + nx * side * CW, o0z = p0z + nz * side * CW;
          const o1x = p1x + nx * side * CW, o1z = p1z + nz * side * CW;
          const y0 = groundH(o0x, o0z) + 0.02, y1 = groundH(o1x, o1z) + 0.02;
          if (y0 < -900 || y1 < -900) continue;
          // the top of the kerb
          pushTriW(sc, o0x, y0, o0z, p0x, y0, p0z, p1x, y1, p1z, C_CURB, false);
          pushTriW(sc, o0x, y0, o0z, p1x, y1, p1z, o1x, y1, o1z, C_CURB, false);
          // …and the face that drops into the roadway
          const f0 = y0 - CURB_LIP - 0.06, f1 = y1 - CURB_LIP - 0.06;
          pushTriW(sc, p0x, y0, p0z, p0x, f0, p0z, p1x, f1, p1z, C_CURB2, true);
          pushTriW(sc, p0x, y0, p0z, p1x, f1, p1z, p1x, y1, p1z, C_CURB2, true);
        }
      }
    }
  }
}

/* back-yard fences: white pickets and grape-stake, 0.9 yd.  Cheap on
   purpose — two faces and a top rail per run — because there are hundreds. */
function buildFences(H, sc, rng) {
  const S = H.scenery;
  const FH = 0.9;
  for (const f of S.fences || []) {
    const ax = f[0], az = f[1], bx = f[2], bz = f[3];
    const L = Math.hypot(bx - ax, bz - az);
    if (L < 1) continue;
    const ux = (bx - ax) / L, uz = (bz - az) / L;
    const picket = rng() < 0.55;
    const cBase = picket ? C_PICKET : C_STAKE;
    const n = Math.max(1, Math.ceil(L / 4.5));
    let any = false;
    for (let k = 0; k < n; k++) {
      /* every panel weathers differently, and a post stands between them:
         an unbroken run of ONE flat colour reads as a slab dropped on the
         lawn instead of as a fence (measured, on the canal bank of 6). */
      const j = 0.86 + ((k * 2654435761) >>> 0) % 101 / 101 * 0.26;
      const cMain = [cBase[0] * j, cBase[1] * j, cBase[2] * j * 0.98];
      const t0 = k / n, t1 = (k + 1) / n;
      const p0x = ax + (bx - ax) * t0, p0z = az + (bz - az) * t0;
      const p1x = ax + (bx - ax) * t1, p1z = az + (bz - az) * t1;
      const y0 = groundH(p0x, p0z), y1 = groundH(p1x, p1z);
      if (y0 < -900 || y1 < -900) continue;
      any = true;
      // a post every other panel: enough to break the run, half the tris
      if (!(k & 1)) {
        boxOut(sc, p0x, y0 + FH * 0.55, p0z, 0.16, FH * 1.15, 0.16,
          Math.atan2(ux, uz), C_RAIL, true);
      }
      // the panel, both faces (MAT_SCENERY is single-sided)
      pushTriW(sc, p0x, y0, p0z, p1x, y1, p1z, p1x, y1 + FH, p1z, cMain, true);
      pushTriW(sc, p0x, y0, p0z, p1x, y1 + FH, p1z, p0x, y0 + FH, p0z, cMain, true);
      pushTriW(sc, p1x, y1, p1z, p0x, y0, p0z, p0x, y0 + FH, p0z, cMain, true);
      pushTriW(sc, p1x, y1, p1z, p0x, y0 + FH, p0z, p1x, y1 + FH, p1z, cMain, true);
      // the top rail catches the light and gives the run a line
      const rx = uz * 0.07, rz = -ux * 0.07;
      pushTriW(sc, p0x - rx, y0 + FH, p0z - rz, p1x - rx, y1 + FH, p1z - rz,
        p1x + rx, y1 + FH + 0.02, p1z + rz, C_RAIL, false);
      pushTriW(sc, p0x - rx, y0 + FH, p0z - rz, p1x + rx, y1 + FH + 0.02, p1z + rz,
        p0x + rx, y0 + FH + 0.02, p0z + rz, C_RAIL, false);
    }
    if (any) {
      FENCES.push({ ax, az, bx, bz, ux, uz, len: L,
        top: Math.max(groundH(ax, az), groundH(bx, bz)) + FH });
    }
  }
}

/* the small hard things: mailboxes, driveway hoops, parked cars — and the
   landmark identity kit (a school's flagpole and backstops, a church's
   steeple, City Hall's portico) that tells you WHERE you are at a glance */
const C_CAR = [col(0x9aa3ab), col(0x8c6f5a), col(0x6d7f8c), col(0xb0aca2), col(0x7a8470)];
const C_HOOP = col(0xdedad0), C_METAL = col(0x8e949a), C_POLE = col(0xd8d6cc);
const C_FLAGR = col(0xc8443a), C_FLAGW = col(0xf2efe4);
function buildProps(H, sc, rng) {
  const S = H.scenery;
  for (const p of S.props || []) {
    const k = p[0], x = p[1], z = p[2], ry = p[3], s = p[4] || 1;
    const y = groundH(x, z);
    if (y < -900) continue;
    if (k === 0) {                       // mailbox
      boxOut(sc, x, y + 0.55, z, 0.14, 1.1, 0.14, ry, C_STAKE, true);
      boxOut(sc, x, y + 1.25, z, 0.42, 0.34, 0.66, ry, C_METAL, true);
    } else if (k === 1) {                // driveway hoop
      boxOut(sc, x, y + 1.5, z, 0.16, 3.0, 0.16, ry, C_METAL, true);
      boxOut(sc, x + Math.sin(ry) * 0.4, y + 3.1, z + Math.cos(ry) * 0.4, 1.3, 0.95, 0.1, ry, C_HOOP, true);
      boxOut(sc, x + Math.sin(ry) * 0.75, y + 2.85, z + Math.cos(ry) * 0.75, 0.5, 0.06, 0.5, ry, C_FLAGR, true);
    } else if (k === 2) {                // a two-box car on the driveway
      const c = C_CAR[(rng() * C_CAR.length) | 0];
      boxOut(sc, x, y + 0.62, z, 1.9, 0.86, 4.5, ry, c, true);
      boxOut(sc, x - Math.sin(ry) * 0.25, y + 1.36, z - Math.cos(ry) * 0.25, 1.7, 0.7, 2.3, ry,
        [c[0] * 0.8, c[1] * 0.82, c[2] * 0.86], true);
      for (const [wu, wv] of [[-0.95, 1.5], [0.95, 1.5], [-0.95, -1.5], [0.95, -1.5]]) {
        boxOut(sc, x + wu * Math.cos(ry) + wv * Math.sin(ry), y + 0.28,
          z - wu * Math.sin(ry) + wv * Math.cos(ry), 0.26, 0.5, 0.5, ry, C_TRAMPR, true);
      }
    } else if (k === 3) {                // the school flagpole
      trunkW(sc, x, y, z, 0.13 * s, 7.6 * s, C_POLE);
      const fx = x + Math.sin(ry) * 0.9, fz = z + Math.cos(ry) * 0.9;
      pushTriW(sc, x, y + 7.2, z, fx, y + 7.0, fz, x, y + 6.3, z, C_FLAGR, false);
      pushTriW(sc, x, y + 7.2, z, x, y + 6.3, z, fx, y + 7.0, fz, C_FLAGW, false);
    } else if (k === 4) {                // a ball-field backstop
      for (let q = -2; q <= 2; q++) {
        const a = ry + q * 0.34;
        const px = x + Math.sin(a) * 7, pz = z + Math.cos(a) * 7;
        const gy = groundH(px, pz);
        if (gy < -900) continue;
        boxOut(sc, px, gy + 1.9, pz, 0.2, 3.8, 0.2, a, C_METAL, true);
        if (q < 2) {
          const a2 = ry + (q + 1) * 0.34;
          const qx = x + Math.sin(a2) * 7, qz = z + Math.cos(a2) * 7;
          const gy2 = groundH(qx, qz);
          pushTriW(sc, px, gy, pz, qx, gy2, qz, qx, gy2 + 3.8, qz, C_METAL, false);
          pushTriW(sc, px, gy, pz, qx, gy2 + 3.8, qz, px, gy + 3.8, pz, C_METAL, false);
        }
      }
    } else if (k === 5) {                // City Hall's civic portico
      for (let q = -2; q <= 2; q++) {
        const cx2 = x + Math.cos(ry) * q * 2.4 + Math.sin(ry) * 8.2;
        const cz2 = z - Math.sin(ry) * q * 2.4 + Math.cos(ry) * 8.2;
        const gy = groundH(cx2, cz2);
        if (gy < -900) continue;
        trunkW(sc, cx2, gy, cz2, 0.45, 5.6, C_WALL);
      }
      const bx2 = x + Math.sin(ry) * 8.2, bz2 = z + Math.cos(ry) * 8.2;
      boxOut(sc, bx2, y + 6.1, bz2, 12.6, 1.0, 2.2, ry, C_WALLD, true);
      gableRoof(sc, bx2, y + 6.6, bz2, 12.6, 2.4, 1.5, ry, C_WALLD, C_WALL);
    } else if (k === 6) {                // a church steeple, with its cross
      boxOut(sc, x, y + 7.5, z, 3.0, 15, 3.0, ry, C_WALL, true);
      coneW(sc, x, y + 15, z, 2.2, 5.2, 4, C_ROOFD, true);
      boxOut(sc, x, y + 21.6, z, 0.24, 2.4, 0.24, ry, C_CROSS, true);
      boxOut(sc, x, y + 22.1, z, 1.3, 0.24, 0.24, ry, C_CROSS, true);
    }
  }
}

/* ═══════════ FC-10 — THE STREET BLADE SIGNS ═══════════
   ONE baked canvas text atlas for the whole course, ONE merged mesh per
   hole, ONE extra draw call — and the player can read where he is standing
   from the tee.  The atlas is built once, lazily, from every name any poco
   hole carries. */
let SIGN_TEX = null, SIGN_ROWS = null, MAT_SIGN = null;
const SIGN_ROW_H = 34, SIGN_FONT = 25, SIGN_W = 512;
function signAtlas() {
  if (SIGN_TEX || typeof POCO_HOLES === 'undefined') return SIGN_TEX;
  const names = [];
  for (const P of POCO_HOLES) for (const s of (P.scenery.names || [])) if (names.indexOf(s) < 0) names.push(s);
  const rows = Math.max(1, names.length);
  const cv = document.createElement('canvas');
  cv.width = SIGN_W;
  cv.height = Math.pow(2, Math.ceil(Math.log2(Math.max(64, rows * SIGN_ROW_H))));
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.font = `700 ${SIGN_FONT}px "Avenir Next", "Trebuchet MS", Verdana, sans-serif`;
  c.textBaseline = 'middle';
  SIGN_ROWS = {};
  for (let i = 0; i < names.length; i++) {
    const y = i * SIGN_ROW_H;
    const w = Math.min(SIGN_W - 12, c.measureText(names[i]).width + 12);
    c.fillStyle = '#1f6b45';                       // the blade
    c.fillRect(0, y + 2, w, SIGN_ROW_H - 4);
    c.fillStyle = '#f4f2e6';
    c.fillRect(1.5, y + 3.5, w - 3, SIGN_ROW_H - 7);
    c.fillStyle = '#1f6b45';
    c.fillRect(3, y + 5, w - 6, SIGN_ROW_H - 10);
    c.fillStyle = '#f7f5ea';
    c.fillText(names[i], 7, y + SIGN_ROW_H / 2);
    SIGN_ROWS[names[i]] = { u0: 0, u1: w / cv.width, v0: 1 - (y + SIGN_ROW_H) / cv.height,
      v1: 1 - y / cv.height, w, h: SIGN_ROW_H };
  }
  SIGN_TEX = new THREE.CanvasTexture(cv);
  SIGN_TEX.minFilter = THREE.LinearFilter;
  SIGN_TEX.magFilter = THREE.LinearFilter;
  SIGN_TEX.generateMipmaps = false;
  SIGN_TEX.wrapS = SIGN_TEX.wrapT = THREE.ClampToEdgeWrapping;
  MAT_SIGN = new THREE.MeshBasicMaterial({ map: SIGN_TEX, transparent: true,
    alphaTest: 0.4, side: THREE.DoubleSide, depthWrite: true });
  return SIGN_TEX;
}
function buildSigns(H, sc) {
  const S = H.scenery;
  if (!S.signs || !S.signs.length) return null;
  signAtlas();
  if (!SIGN_ROWS) return null;
  const g = new THREE.BufferGeometry();
  const pos = [], uvs = [];
  const BH = 0.95;                       // blade height, yards
  for (const sg of S.signs) {
    const x = sg[0], z = sg[1], ry = sg[2];
    const y = groundH(x, z);
    if (y < -900) continue;
    trunkW(sc, x, y, z, 0.11, 4.1, C_METAL);     // the post rides the free mesh
    const blades = [[sg[3], ry, 3.5], [sg[4], ry + Math.PI / 2, 3.05]];
    for (const [ni, ang, hgt] of blades) {
      if (ni === undefined || ni < 0) continue;
      const nm = S.names[ni];
      const row = SIGN_ROWS[nm];
      if (!row) continue;
      const w = Math.min(7.5, BH * (row.w / row.h));
      const ux = Math.cos(ang), uz = -Math.sin(ang);
      const y0 = y + hgt, y1 = y0 + BH;
      const ax = x - ux * w * 0.5, az = z - uz * w * 0.5;
      const bx = x + ux * w * 0.5, bz = z + uz * w * 0.5;
      pos.push(ax, y0, az, bx, y0, bz, bx, y1, bz, ax, y0, az, bx, y1, bz, ax, y1, az);
      uvs.push(row.u0, row.v0, row.u1, row.v0, row.u1, row.v1,
               row.u0, row.v0, row.u1, row.v1, row.u0, row.v1);
    }
  }
  if (!pos.length) return null;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvs), 2));
  const m = new THREE.Mesh(g, MAT_SIGN);
  m.matrixAutoUpdate = false;
  m.updateMatrix();
  return m;
}

function buildPocoScenery(H, sc, castMd, rng, pine, blobTree, castCount0) {
  const S = H.scenery;
  if (!S) return 0;
  let cast = 0;

  /* ── the houses ── */
  for (let i = 0; i < S.houses.length; i++) {
    const h = S.houses[i];
    const x = h[0], z = h[1], ry = h[2], a = h[3], b = h[4];
    const wallH = h[5], roofH = h[6], hip = h[7];
    const wc = lift(col(h[8]), 1.06), rc = lift(col(h[9]), 1.22);
    const y = groundH(x, z) - 0.35;
    if (y < -900) continue;
    boxOut(sc, x, y + wallH / 2, z, a * 2, wallH, b * 2, ry, wc, true);
    // a darker skirt so the house sits ON the lot instead of floating in it
    boxOut(sc, x, y + 0.16, z, a * 2 + 0.5, 0.32, b * 2 + 0.5, ry,
      [wc[0] * 0.72, wc[1] * 0.71, wc[2] * 0.7], true);
    // the eave band — the shadow line the AO bake is asked for
    boxOut(sc, x, y + wallH + 0.12, z, a * 2 + 1.1, 0.24, b * 2 + 1.1, ry,
      [rc[0] * 0.78, rc[1] * 0.78, rc[2] * 0.8], true);
    const rh = hip ? roofH * 0.72 : roofH;
    gableRoof(sc, x, y + wallH + 0.24, z, a * 2 + 1.1, b * 2 + 1.1, rh, ry,
      rc, [rc[0] * 0.86, rc[1] * 0.86, rc[2] * 0.88]);
    // a front door and two windows — the difference between a house and a box
    panelW(sc, x, y + 1.05, z, 1.05, 2.1, ry, b + 0.06, C_DOOR);
    panelW(sc, x - a * 0.52, y + wallH * 0.62, z, 1.25, 1.05, ry, b + 0.06, C_GLASS);
    panelW(sc, x + a * 0.52, y + wallH * 0.62, z, 1.25, 1.05, ry, b + 0.06, C_GLASS);
    panelW(sc, x, y + wallH * 0.62, z, 1.4, 1.1, ry + Math.PI, b + 0.06, C_GLASS);
    if (rng() < 0.3) {
      const cx2 = x + Math.cos(ry) * a * 0.5, cz2 = z - Math.sin(ry) * a * 0.5;
      boxOut(sc, cx2, y + wallH + rh + 0.3, cz2, 0.8, 1.6, 0.8, ry,
        [rc[0] * 0.9, rc[1] * 0.88, rc[2] * 0.86], true);
    }
    /* the sim volume: an oriented box, top at the roof's MEAN height so a
       ball neither sails through a roof nor floats over the eaves */
    HOUSES.push({ x, z, c: Math.cos(ry), s: Math.sin(ry), a, b,
      top: y + wallH + rh * 0.62,
      rr: (a + 1.4) * (a + 1.4) + (b + 1.4) * (b + 1.4) });
  }

  /* ── the real public buildings ── */
  for (let i = 0; i < S.bigs.length; i++) {
    const g = S.bigs[i];
    const x = g[0], z = g[1], ry = g[2], a = g[3], b = g[4], hh = g[5];
    const c = lift(col(g[6]), 1.04), gable = g[7];
    const y = groundH(x, z) - 0.4;
    if (y < -900) continue;
    boxOut(sc, x, y + hh / 2, z, a * 2, hh, b * 2, ry, c, true);
    const rcol = [c[0] * 0.55, c[1] * 0.56, c[2] * 0.58];
    let top = y + hh + 0.4;
    if (gable) {
      gableRoof(sc, x, y + hh, z, a * 2 + 1.4, b * 2 + 1.4, 4.2, ry, rcol, [c[0] * 0.8, c[1] * 0.8, c[2] * 0.82]);
      gableRoof(sc, x, y + hh, z, b * 1.5, a * 1.1, 3.4, ry + Math.PI / 2, rcol, [c[0] * 0.8, c[1] * 0.8, c[2] * 0.82]);
      boxOut(sc, x, y + hh + 5.9, z, 0.3, 3.2, 0.3, ry, C_CROSS, true);
      boxOut(sc, x, y + hh + 6.6, z, 1.6, 0.3, 0.3, ry, C_CROSS, true);
      top = y + hh + 2.6;
    } else {
      boxOut(sc, x, y + hh + 0.2, z, a * 2 + 0.9, 0.4, b * 2 + 0.9, ry, rcol, true);
    }
    const n = Math.max(3, Math.min(8, Math.round(a / 2.4)));
    for (let k = 0; k < n; k++) {
      const lx = (k / (n - 1) - 0.5) * a * 1.7;
      panelW(sc, x + Math.cos(ry) * lx, y + hh * 0.58, z - Math.sin(ry) * lx, 1.7, 1.5, ry, b + 0.07, C_GLASS);
      panelW(sc, x + Math.cos(ry) * lx, y + hh * 0.58, z - Math.sin(ry) * lx, 1.7, 1.5, ry + Math.PI, b + 0.07, C_GLASS);
    }
    HOUSES.push({ x, z, c: Math.cos(ry), s: Math.sin(ry), a, b, top,
      rr: (a + 1.4) * (a + 1.4) + (b + 1.4) * (b + 1.4) });
  }

  /* ── the trampolines: a navy mat on a dark frame ── */
  for (let i = 0; i < S.tramps.length; i++) {
    const t = S.tramps[i];
    const x = t[0], z = t[1], r = t[2];
    const y = groundH(x, z);
    if (y < -900) continue;
    for (let k = 0; k < 10; k++) {
      const a0 = TAU * k / 10, a1 = TAU * (k + 1) / 10;
      const px = x + Math.cos(a0) * r, pz = z + Math.sin(a0) * r;
      const qx = x + Math.cos(a1) * r, qz = z + Math.sin(a1) * r;
      pushTriW(sc, x, y + 0.64, z, qx, y + 0.64, qz, px, y + 0.64, pz, C_TRAMP, false);
      pushTriW(sc, px, y, pz, qx, y, qz, qx, y + 0.68, qz, C_TRAMPR, true);
      pushTriW(sc, px, y, pz, qx, y + 0.68, qz, px, y + 0.68, pz, C_TRAMPR, true);
    }
    TRAMPS.push({ x, z, r, y: y + 0.64 });
  }

  /* ── the canopy ── */
  for (let i = 0; i < S.trees.length; i++) {
    const t = S.trees[i];
    if (t[2] === 1) pine(t[0], t[1], t[3]);
    else blobTree(t[0], t[1], t[3] * 1.15, C_OAK, C_OAK2);
  }

  /* ── the kerbs, the back-yard fences and the street furniture ── */
  buildCurbs(H, sc);
  buildFences(H, sc, rng);
  buildProps(H, sc, rng);

  /* ── a clipped hedge ring behind the bucket's lawn: suburb, not Augusta ── */
  for (let k = 0; k < 14; k++) {
    const a = (k / 14 - 0.5) * 2.2 + Math.PI;
    const rr = Math.max(GREEN.grx, GREEN.grz) + 5 + rng() * 2.5;
    const px = GREEN.x + (GREEN.tx * Math.cos(a) - GREEN.tz * Math.sin(a)) * rr;
    const pz = GREEN.z + (GREEN.tz * Math.cos(a) + GREEN.tx * Math.sin(a)) * rr;
    const sf = FIELD(px, pz)[1];
    if (sf === 5 || sf === 4 || sf === 2 || sf === 7) continue;
    moundW(sc, px, groundH(px, pz) - 0.3, pz, 1.1 + rng() * 0.7, 0.7, C_BOXWOOD, rng, true);
  }

  /* ── the backdrop: low rooftops and a tree line, never a pine wall ── */
  for (let d = -14; d < H.len + 44; d += 13) {
    for (const side of [-1, 1]) {
      const o = side * (63 + rng() * 6);
      const w = clWorld(H, d + (rng() - 0.5) * 8, o);
      const y = groundH(w[0], w[1]) - 0.4;
      if (y < -900) continue;
      const ry = Math.atan2(GREEN.x - w[0], GREEN.z - w[1]);
      if (rng() < 0.55) {
        const wc = col([0xefe8da, 0xd9c7a6, 0xb9c3a8, 0xcfcac0][(rng() * 4) | 0]);
        const rc = col([0x6b4a33, 0x4a4a4c, 0x53412f][(rng() * 3) | 0]);
        boxOut(sc, w[0], y + 1.8, w[1], 10, 3.6, 8, ry, wc, true);
        gableRoof(sc, w[0], y + 3.6, w[1], 11, 9, 1.5, ry, rc, [rc[0] * 0.86, rc[1] * 0.86, rc[2] * 0.88]);
      } else {
        blobTree(w[0], w[1], 1.15 + rng() * 0.5, C_OAK, C_OAK2);
      }
    }
  }

  /* ── hero casters: a handful of near-corridor oaks, and no more ── */
  for (let i = 0; i < S.trees.length && cast < 24; i++) {
    if (i % 3) continue;
    const t = S.trees[i];
    const dof = clDoff(H, t[0], t[1]);
    if (Math.abs(dof[1]) > 32 || dof[0] < 0 || dof[0] > H.len) continue;
    const y = groundH(t[0], t[1]);
    if (y < -900) continue;
    coneW(castMd, t[0], y + 2.2, t[1], 2.7 * t[3], 5.2 * t[3], 4, C_PINE, true);
    cast++;
  }
  void castCount0;
  return cast;
}

/* a uniform-grid broadphase over line segments (fences, kerbs).  Built once
   per hole; queried by tickBall, which may not scan hundreds of segments. */
const SEG_CELL = 14;
function segGrid(list) {
  if (!list.length) return null;
  let minX = 1e9, minZ = 1e9, maxX = -1e9, maxZ = -1e9;
  for (const s of list) {
    minX = Math.min(minX, s.ax, s.bx); maxX = Math.max(maxX, s.ax, s.bx);
    minZ = Math.min(minZ, s.az, s.bz); maxZ = Math.max(maxZ, s.az, s.bz);
  }
  const nx = Math.max(1, Math.ceil((maxX - minX) / SEG_CELL));
  const nz = Math.max(1, Math.ceil((maxZ - minZ) / SEG_CELL));
  const cells = new Array(nx * nz);
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const i0 = clamp(Math.floor((Math.min(s.ax, s.bx) - 1 - minX) / SEG_CELL), 0, nx - 1);
    const i1 = clamp(Math.floor((Math.max(s.ax, s.bx) + 1 - minX) / SEG_CELL), 0, nx - 1);
    const j0 = clamp(Math.floor((Math.min(s.az, s.bz) - 1 - minZ) / SEG_CELL), 0, nz - 1);
    const j1 = clamp(Math.floor((Math.max(s.az, s.bz) + 1 - minZ) / SEG_CELL), 0, nz - 1);
    for (let j = j0; j <= j1; j++) for (let k = i0; k <= i1; k++) {
      const c = j * nx + k;
      (cells[c] || (cells[c] = [])).push(s);
    }
  }
  return {
    near(x, z) {
      const ix = Math.floor((x - minX) / SEG_CELL), iz = Math.floor((z - minZ) / SEG_CELL);
      if (ix < 0 || ix >= nx || iz < 0 || iz >= nz) return null;
      return cells[iz * nx + ix] || null;
    },
  };
}

/* ── the hole builder — fires only at hole transitions ── */
const GRID_STEP = 2.0;
function buildHole(idx) {

  const rng = mulberry32(1234 + idx * 977);

  /* ── FC-5 structures: placements first (planting keeps clear of them) ──

    const w = clWorld(H, H.club[0], H.club[1]);
    // beside the hole → broad side faces the fairway abeam; beyond the green
    // → broad side (veranda) faces back DOWN the hole at the approach
    const f = H.club[0] > H.len ? clWorld(H, H.len - 60, 0) : clWorld(H, H.club[0], 0);
    STRUCTS.push({ t: 'club', x: w[0], z: w[1], r: 27, fx: f[0], fz: f[1] });
  }
  if (H.cabins) {
    for (const [d, off] of [[16, 29], [31, 39]]) {
      const w = clWorld(H, d, off);
      const f = clWorld(H, d, 0);

    }

          CC[id * 3 + 1] = clamp(CC[id * 3 + 1] * k + aoCool[1] * cav * 0.24, 0, 1);
          CC[id * 3 + 2] = clamp(CC[id * 3 + 2] * k + aoCool[2] * cav * 0.24, 0, 1);

           value (sun face warm and yellow-green, away face cool and deep),
           because hue is what the eye reads as SHAPE at couch distance. */

  groundH = function (x, z) {
    if (x < x0 || z < z0 || x >= x1 - STEP || z >= z1 - STEP) return FIELD(x, z)[0];
    const fx = (x - x0) / STEP, fz = (z - z0) / STEP;
    const ix = Math.floor(fx), iz = Math.floor(fz);
    const u = fx - ix, v = fz - iz;

  const md = MD();
  const _ca = [0, 0, 0], _cb = [0, 0, 0], _cc2 = [0, 0, 0];
  const gc = (id, out) => { out[0] = CC[id * 3]; out[1] = CC[id * 3 + 1]; out[2] = CC[id * 3 + 2]; return out; };
  for (let iz = 0; iz < nz; iz++) {
    for (let ix = 0; ix < nx; ix++) {
      const cx = x0 + (ix + 0.5) * STEP, cz = z0 + (iz + 0.5) * STEP;
      const dof = clDoff(H, cx, cz);
      if (Math.abs(dof[1]) > CLIP_IN && dof[0] > 4 && dof[0] < H.len - 4) continue;
      if (Math.abs(dof[1]) > CLIP_OUT) continue;
      const i00 = gi(ix, iz), i10 = gi(ix + 1, iz), i01 = gi(ix, iz + 1), i11 = gi(ix + 1, iz + 1);
      const ax = x0 + ix * STEP, az = z0 + iz * STEP;
      const bx = ax + STEP, bz = az + STEP;
      // tri (p00, p01, p11) and (p00, p11, p10) — up-facing winding
      pushTriT(md, ax, HF[i00], az, ax, HF[i01], bz, bx, HF[i11], bz, gc(i00, _ca), gc(i01, _cb), gc(i11, _cc2));
      pushTriT(md, ax, HF[i00], az, bx, HF[i11], bz, bx, HF[i10], az, gc(i00, _ca), gc(i11, _cb), gc(i10, _cc2));
    }
