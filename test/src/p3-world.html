  scene.add(terrain); HOLE_OBJS.push(terrain);

  // water surfaces — reflected-sky gradient (deep center → sky-lit edge)
  if (FIELD.wat.length) {
    const wm = MD(), sm = MD();
    const skyRef = col(0x66a8c8);
    for (let iz = 0; iz < nz; iz++) {
      for (let ix = 0; ix < nx; ix++) {
        const cx = x0 + (ix + 0.5) * STEP, cz = z0 + (iz + 0.5) * STEP;
        const s = FIELD(cx, cz);
        if (s[1] !== 5) continue;
        // which shape's level?  (FC-10: a strip's level FALLS with its run,
        // so the canal is asked for its level HERE, not once for the hole)
        const dof2 = clDoff(H, cx, cz);
        let wl = -1e9;
        for (const w of FIELD.wat) wl = Math.max(wl, w.lvl ? w.lvl(dof2[0]) : w.wl);
        const ax = x0 + ix * STEP, az = z0 + iz * STEP;
        const bx = ax + STEP, bz = az + STEP;
        const n = vnoise(cx * 0.4, cz * 0.4) * 0.5 + 0.5;
        const c = mix3(C_WATER, C_WATER2, n, [0, 0, 0]);
        // sky reflection creeps in toward the far (green-side) edge
        const skyT = clamp((vnoise(cx * 0.13 + 40, cz * 0.13) * 0.5 + 0.5) * 0.55, 0, 1);
        mix3(c, skyRef, skyT * 0.45, c);
        wm.p.push(ax, wl, az, ax, wl, bz, bx, wl, bz, ax, wl, az, bx, wl, bz, bx, wl, az);
        for (let k = 0; k < 6; k++) wm.c.push(c[0], c[1], c[2]);
        if (((ix + iz * 3) % 5) === 0) {
          sm.p.push(ax, wl + 0.07, az, ax + 1.2, wl + 0.07, bz, bx, wl + 0.07, bz - 1.1);
        }
      }
    }
    const wmesh = mdMesh(wm, MAT_WATER);
    scene.add(wmesh); HOLE_OBJS.push(wmesh);
    if (sm.p.length) {
      const sg2 = new THREE.BufferGeometry();
      sg2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sm.p), 3));
      waterShine = new THREE.Mesh(sg2, MAT_SHINE);
      scene.add(waterShine); HOLE_OBJS.push(waterShine);
    }
  }

  // ── scenery: layered pines + deciduous variety + lush planting, ONE mesh ──
  const sc = MD();
  const castMd = MD();      // curated near-corridor shadow-caster cones
  let castCount = 0;
  function pine(x, z, s) {
    const y = groundH(x, z) - 0.3;
    if (y < -900) return;
    const hTrunk = (5.2 + rng() * 2.6) * s, rTrunk = 0.42 * s;
    const j = 0.82 + rng() * 0.4;
    // two-tone fronds: shaded inner tiers, sunlit outer tips
    const cLo = mix3(C_PINE, C_PINE2, rng(), [0, 0, 0]);
    const cHi = mix3(C_PINE2, C_PINE3, rng(), [0, 0, 0]);
    for (let k = 0; k < 3; k++) { cLo[k] *= j; cHi[k] *= j; }
    trunkW(sc, x, y, z, rTrunk, hTrunk + 1.5 * s, C_TRUNK);
    const base = y + hTrunk * 0.6;
    const rC = (2.7 + rng() * 1.3) * s;
    // four stacked fronds with jittered offsets — a layered, real pine
    const ox1 = (rng() - 0.5) * 0.7 * s, oz1 = (rng() - 0.5) * 0.7 * s;
    const ox2 = (rng() - 0.5) * 0.5 * s, oz2 = (rng() - 0.5) * 0.5 * s;
    coneW(sc, x, base, z, rC, 3.9 * s, 6, cLo, true);
    coneW(sc, x + ox1, base + 2.0 * s, z + oz1, rC * 0.78, 3.6 * s, 6, mix3(cLo, cHi, 0.4, [0, 0, 0]), true);
    coneW(sc, x + ox2, base + 3.9 * s, z + oz2, rC * 0.55, 3.2 * s, 5, mix3(cLo, cHi, 0.75, [0, 0, 0]), true);
    coneW(sc, x, base + 5.6 * s, z, rC * 0.32, 2.6 * s, 5, cHi, true);
    TREES.push({ x, z, cr: rC * 0.85, cy0: base + 0.6, cy1: base + 8.2 * s });
    // near the play corridor → this tree joins the curated caster set
    if (LOOK && castCount < 140) {
      const dof = clDoff(H, x, z);
      if (Math.abs(dof[1]) < H.fw + 46 && dof[0] > -20 && dof[0] < H.len + 40) {
        coneW(castMd, x, base + 0.4, z, rC * 0.8, 6.4 * s, 4, C_PINE, true);
        castCount++;
      }
    }
  }
  // deciduous: blob-canopy magnolia/oak (and blossom variants per hole)
  function blobTree(x, z, s, cA, cB) {
    const y = groundH(x, z) - 0.3;
    if (y < -900) return;
    const hTrunk = (2.6 + rng() * 1.4) * s;
    trunkW(sc, x, y, z, 0.5 * s, hTrunk + 0.8 * s, C_TRUNK);
    const cy = y + hTrunk;
    const R = (2.6 + rng() * 1.2) * s;
    ballW(sc, x, cy + R * 0.55, z, R, 0.78, cA, rng);
    ballW(sc, x + R * 0.62, cy + R * 0.4, z + (rng() - 0.5) * R, R * 0.62, 0.8, mix3(cA, cB, 0.6, [0, 0, 0]), rng);
    ballW(sc, x - R * 0.58, cy + R * 0.45, z + (rng() - 0.5) * R, R * 0.58, 0.8, cB, rng);
    TREES.push({ x, z, cr: R * 1.1, cy0: cy, cy1: cy + R * 1.3 });
    if (LOOK && castCount < 140) {
      const dof = clDoff(H, x, z);
      if (Math.abs(dof[1]) < H.fw + 46 && dof[0] > -20 && dof[0] < H.len + 40) {
        coneW(castMd, x, cy - 0.5, z, R * 0.85, R * 1.6, 4, C_PINE, true);
        castCount++;
      }
    }
  }
  function safeSpot(x, z, margin) {
    if (!structClear(x, z)) return false;   // FC-5: no trees through the clubhouse
    const s = FIELD(x, z)[1];
    if (s === 5 || s === 4 || s === 2 || s === 3 || s === 6 || s === 7) return false;
    const dgx = x - GREEN.x, dgz = z - GREEN.z;
    if (Math.hypot(dgx, dgz) < GREEN.grx + margin) return false;
    return true;
  }
  /* ═══ THE POCO OPEN — the neighborhood replaces the pine forest ═══
     Same merged scenery MD, same tree bakes, same caster budget: the poco
     layer costs ZERO extra draw calls.  Magnolia is untouched. */
  if (COURSE === 'poco') {
    castCount += buildPocoScenery(H, sc, castMd, rng, pine, blobTree, castCount);
    /* the street blades are the one textured thing on the course: ONE merged
       mesh on ONE shared atlas material = one draw call for the whole hole */
    const sgm = buildSigns(H, sc);
    if (sgm) { scene.add(sgm); HOLE_OBJS.push(sgm); }
    /* …and the two new sim volumes get their broadphase.  A rolling ball
       asks "is there a fence or a kerb near me?" sixty times a second, and
       a linear scan of 300 segments is not an answer. */
    FENCE_GRID = segGrid(FENCES);
    CURB_GRID = segGrid(CURBS);
  } else {
    // deciduous accents mixed into the flanks: variety by hole palette
    const decidA = H.magnolia ? C_OAK : H.peach ? C_PEACH : H.redbud ? C_REDBUD : C_OAK;
    const decidB = H.magnolia ? C_OAK2 : H.peach ? C_DOGWOOD2 : H.redbud ? C_AZALEA2 : C_OAK2;
    const decidP = (H.magnolia || H.peach || H.redbud) ? 0.3 : 0.16;
    // flanking bands (double row) + boundary wall of pines — clusters, not rows
    for (let d = 14; d < H.len + 6; d += 6.5) {
      for (const side of [-1, 1]) {
        if (rng() < 0.22) continue;
        const fwD = fwAt(H, d);   // FC-7: the tree line follows the varied width
        const off = side * ((H.chute ? fwD + 9 : Math.max(fwD + 13, 21)) + rng() * 34);
        const w = clWorld(H, d + (rng() - 0.5) * 5, off);
        if (safeSpot(w[0], w[1], 14)) {
          if (rng() < decidP) blobTree(w[0], w[1], 0.85 + rng() * 0.5, decidA, decidB);
          else pine(w[0], w[1], 0.85 + rng() * 0.55);
          // understory: a low shadeleaf shrub tucked under some trees
          if (rng() < 0.3) {
            const ux = w[0] + (rng() - 0.5) * 7, uz = w[1] + (rng() - 0.5) * 7;
            if (safeSpot(ux, uz, 10)) moundW(sc, ux, groundH(ux, uz) - 0.25, uz, 1.1 + rng() * 1.1, 0.7, mix3(C_BOXWOOD, C_PINE3, rng(), [0, 0, 0]), rng, true);
          }
        }
      }
    }
    for (let d = -16; d < H.len + 34; d += 8.5) {
      for (const side of [-1, 1]) {
        const off = side * (56 + rng() * 15);
        const w = clWorld(H, d, off);
        if (safeSpot(w[0], w[1], 10)) pine(w[0], w[1], 1.0 + rng() * 0.6);
      }
    }
    // the wall of pines behind the green
    for (let k = 0; k < 16; k++) {
      const off = -52 + k * 7 + (rng() - 0.5) * 4;
      const w = clWorld(H, H.len + 22 + rng() * 22, off);
      if (safeSpot(w[0], w[1], 12)) pine(w[0], w[1], 1.05 + rng() * 0.6);
    }
    for (const tc of H.tclump) {
      for (let k = 0; k < tc[3]; k++) {
        const a = rng() * TAU, r = Math.sqrt(rng()) * tc[2];
        const w = clWorld(H, tc[0] + Math.cos(a) * r, tc[1] + Math.sin(a) * r * 0.8);
        if (safeSpot(w[0], w[1], 12)) pine(w[0], w[1], 0.8 + rng() * 0.6);
      }
    }

    /* ── LUSH PLANTING — the per-hole palette (FC-LOOK-1) ── */
    const plantable = (x, z) => {
      if (!structClear(x, z)) return false;
      const s = FIELD(x, z)[1];
      return !(s === 5 || s === 4 || s === 2 || s === 3 || s === 6 || s === 7);
    };
    function bank(cList, count, spotFn, rMin, rMax) {
      for (let k = 0; k < count; k++) {
        const p = spotFn(k);
        if (!p) continue;
        if (!plantable(p[0], p[1])) continue;
        const c = cList[(rng() * cList.length) | 0];
        moundW(sc, p[0], groundH(p[0], p[1]) - 0.3, p[1], rMin + rng() * (rMax - rMin), 0.75, c, rng, false);
      }
    }
    // tee flower beds — every hole opens onto color
    bank([C_BED_Y, C_BED_W, C_AZALEA2, C_BED_R], 14,
      () => { const w = clWorld(H, 5 + rng() * 12, (rng() < 0.5 ? -1 : 1) * (11 + rng() * 5)); return w.slice(); }, 0.55, 0.95);
    // boxwood hedge arcs framing the green (most holes; quiet, structural)
    bank([C_BOXWOOD], 14, k => {
      const a = (k / 14 - 0.5) * 2.4 + Math.PI;   // behind-green arc
      const rr = Math.max(GREEN.grx, GREEN.grz) + 9 + rng() * 3;
      return [GREEN.x + (GREEN.tx * Math.cos(a) - GREEN.tz * Math.sin(a)) * rr,
              GREEN.z + (GREEN.tz * Math.cos(a) + GREEN.tx * Math.sin(a)) * rr];
    }, 1.3, 2.1);
    // azalea holes (12/13): BANKS IN BLOOM — walls along the corridor + green ring
    if (H.azalea) {
      const AZ = [C_AZALEA, C_AZALEA2, C_AZALEA3, C_DOGWOOD2];
      bank(AZ, 44, () => {
        const a = rng() * TAU;
        const rr = GREEN.grx + 6 + rng() * 16;
        return [GREEN.x + Math.cos(a) * rr, GREEN.z + Math.sin(a) * rr * 0.9];
      }, 1.9, 3.9);
      bank(AZ, 60, () => {
        const d = H.len * (0.12 + rng() * 0.86);
        const off = (rng() < 0.5 ? -1 : 1) * (fwAt(H, d) + 4 + rng() * 11);
        return clWorld(H, d, off).slice();
      }, 1.6, 3.4);
    }
    // dogwood holes (2/11): white drifts near the green + white blob trees
    if (H.dogwood) {
      const DW = [C_DOGWOOD, C_DOGWOOD2];
      bank(DW, 30, () => {
        const a = rng() * TAU;
        const rr = GREEN.grx + 6 + rng() * 15;
        return [GREEN.x + Math.cos(a) * rr, GREEN.z + Math.sin(a) * rr * 0.9];
      }, 1.7, 3.2);
      for (let k = 0; k < 7; k++) {
        const d = H.len * (0.5 + rng() * 0.45);
        const w = clWorld(H, d, (rng() < 0.5 ? -1 : 1) * (fwAt(H, d) + 10 + rng() * 12));
        if (plantable(w[0], w[1])) blobTree(w[0], w[1], 0.6 + rng() * 0.35, C_DOGWOOD, C_DOGWOOD2);
      }
    }
    // camellia hole (10): deep reds banked down the hill and at the green
    if (H.camellia) {
      const CM = [C_CAMELLIA, C_CAMELLIA2, C_AZALEA3];
      bank(CM, 26, () => {
        const a = rng() * TAU;
        const rr = GREEN.grx + 6 + rng() * 14;
        return [GREEN.x + Math.cos(a) * rr, GREEN.z + Math.sin(a) * rr * 0.9];
      }, 1.6, 3.0);
      bank(CM, 22, () => {
        const d = H.len * (0.35 + rng() * 0.6);
        return clWorld(H, d, (rng() < 0.5 ? -1 : 1) * (fwAt(H, d) + 6 + rng() * 12)).slice();
      }, 1.3, 2.6);
    }
    // pampas hole (7): tan plume tufts lining the tight chute
    if (H.pampas) {
      for (let k = 0; k < 30; k++) {
        const d = 20 + rng() * (H.len - 60);
        const w = clWorld(H, d, (rng() < 0.5 ? -1 : 1) * (fwAt(H, d) + 4 + rng() * 7));
        if (!plantable(w[0], w[1])) continue;
        const y = groundH(w[0], w[1]) - 0.2;
        const s = 0.7 + rng() * 0.5;
        moundW(sc, w[0], y, w[1], 1.0 * s, 0.9, C_PAMPAS, rng, true);
        // plumes: a few pale mini-cones rising from the tuft
        for (let q = 0; q < 3; q++) {
          const px = w[0] + (rng() - 0.5) * 1.2 * s, pz = w[1] + (rng() - 0.5) * 1.2 * s;
          coneW(sc, px, y + 1.0 * s, pz, 0.16 * s, 1.5 * s, 3, C_PAMPAS2, true);
        }
      }
    }
    // gallery-lined finish (18): hedge ropes + flower drifts up the last stretch
    if (H.gallery) {
      for (const side of [-1, 1]) {
        for (let k = 0; k < 44; k++) {
          const d = 46 + k * 9 + rng() * 3;
          const w = clWorld(H, d, side * (fwAt(H, d) + 5 + rng() * 2.5));
          if (!plantable(w[0], w[1])) continue;
          moundW(sc, w[0], groundH(w[0], w[1]) - 0.3, w[1], 1.2 + rng() * 0.7, 0.7, C_BOXWOOD, rng, true);
          if (k % 3 === 0) {
            const f = clWorld(H, d + 3, side * (fwAt(H, d) + 9 + rng() * 3));
            if (plantable(f[0], f[1])) moundW(sc, f[0], groundH(f[0], f[1]) - 0.3, f[1], 0.9 + rng() * 0.6, 0.8, [C_BED_Y, C_BED_R, C_AZALEA2][k % 3 === 0 ? (k / 3 | 0) % 3 : 0], rng, false);
          }
        }
      }
    }
    // creek banks (12/13): blossom drifts + worn creek stones
    for (const w of FIELD.wat) {
      if (w.t !== 'creek') continue;
      const cMain = H.azalea ? C_AZALEA : H.dogwood ? C_DOGWOOD : C_BOXWOOD;
      const cAlt = H.azalea ? C_AZALEA2 : H.dogwood ? C_DOGWOOD2 : C_PINE3;
      for (let k = 0; k < 22; k++) {
        const off = -40 + rng() * 80;
        const p = clWorld(H, w.d + w.w / 2 + 3.5 + rng() * 5, off);
        if (!plantable(p[0], p[1])) continue;
        moundW(sc, p[0], groundH(p[0], p[1]) - 0.3, p[1], 1.6 + rng() * 1.6, 0.75, rng() < 0.5 ? cMain : cAlt, rng, false);
      }
      // stones along both lips of the cut
      for (let k = 0; k < 26; k++) {
        const off = -34 + rng() * 68;
        const side = rng() < 0.5 ? -1 : 1;
        const p = clWorld(H, w.d + side * (w.w / 2 + 0.6 + rng() * 1.6), off);
        if (!structClear(p[0], p[1])) continue;   // keep the bridge deck clear
        const y = groundH(p[0], p[1]);
        const sR = 0.35 + rng() * 0.5;
        ballW(sc, p[0], y + sR * 0.25, p[1], sR, 0.55, rng() < 0.5 ? C_STONE : C_STONE2, rng);
      }
    }
  }
  /* ── FC-5: emit the structures (merged, baked; casts — trivial tris) ── */
  if (STRUCTS.length) {
    const bm = MD();
    for (const st of STRUCTS) {
      if (st.t === 'club') {
        buildClubhouse(bm, st);
        // the big live oak beside (never over) the clubhouse roofline
        const ory = Math.atan2(st.fx - st.x, st.fz - st.z);
        const cosR = Math.cos(ory), sinR = Math.sin(ory);
        blobTree(st.x + 20 * cosR + 7 * sinR, st.z - 20 * sinR + 7 * cosR, 1.55, C_OAK, C_OAK2);
      } else if (st.t === 'cabin') buildCabin(bm, st);
      else buildBridge(bm, H, st);
    }
    const buildings = mdMesh(bm, MAT_SCENERY);
    buildings.castShadow = LOOK;
    scene.add(buildings); HOLE_OBJS.push(buildings);
  }
  /* the merged scenery mesh — on poco it is emitted LATER (the bucket, the
     doormat and the tee markers join it, which is how the street-sign atlas
     pays for its own draw call) */
  if (COURSE !== 'poco') {
    const scenery = mdMesh(sc, MAT_SCENERY);
    scene.add(scenery); HOLE_OBJS.push(scenery);
  }
  // the curated tree-caster mesh (depth-only; the color pass writes nothing)
  if (LOOK && castMd.p.length) {
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(castMd.p), 3));
    treeCaster = new THREE.Mesh(cg, MAT_CASTER);
    treeCaster.castShadow = true;
    treeCaster.matrixAutoUpdate = false;
    scene.add(treeCaster); HOLE_OBJS.push(treeCaster);
  }

  // ── pin: cup + flagstick + cloth; tee markers ──
  /* FC-7: greens have real contour now, so the cup is either HAND-SET where
     the complex is the whole point (9's back shelf above the false front,
     16's Sunday pin at the bottom of the feeder, 14's top terrace, 12's
     diagonal right), or chosen as the gentlest of a deterministic handful
     of candidate shelves — a fair hole location, same every time. */
  /* ═══ FC-8 PIN SANITY — the same law for hand-set and scored pins ═══
     A cup is only fair if you can reach it and putt around it.  Three
     rules, checked for EVERY hole:
       · ≥ PIN_EDGE yds inside the green's own edge,
       · ≥ PIN_SAND yds from any bunker LIP (16's Sunday pin used to sit on
         the left bunker's shoulder — every short putt broke away from it
         into the sand),
       · the 2.2-yd ring underfoot gentle enough that a ball can rest on it
         (restGrad on a green is 0.15; Pro is allowed right up to the spicy
         end of legal, Amateur gets the gentler shelf).
     The hand-set pins (9's back shelf, 12's diagonal right, 14's top
     terrace, 16's Sunday gather) are PREFERENCES now: the designed spot
     wins when it is legal, and slides to the nearest legal ground when it
     is not.  The green CONTOURS themselves are untouched — this is about
     where the cup is cut, never about softening the hole. */
  const PIN_EDGE = 3.0, PIN_SAND = 3.0;
  const PIN_RING = DIFF === 'pro' ? 0.135 : 0.115;
  const PIN_PT = 0.10;
  const gradAt = (wx, wz) => Math.hypot(
    (groundH(wx + 1, wz) - groundH(wx - 1, wz)) / 2,
    (groundH(wx, wz + 1) - groundH(wx, wz - 1)) / 2);
  const gW = (lx, lz) => [GREEN.x + GREEN.tz * lx + GREEN.tx * lz,
                          GREEN.z - GREEN.tx * lx + GREEN.tz * lz];
  /* signed distance to the green's edge, sampled on the ellipse itself
     (grx != grz on 12, so a normalised radius is not a yardage) */
  function edgeDist(lx, lz) {
    let m = 1e9;
    for (let a = 0; a < 48; a++) {
      const th = TAU * a / 48;
      const ex = GREEN.grx * Math.cos(th) - lx, ez = GREEN.grz * Math.sin(th) - lz;
      const dd = ex * ex + ez * ez;
      if (dd < m) m = dd;
    }
    m = Math.sqrt(m);
    return Math.hypot(lx / GREEN.grx, lz / GREEN.grz) >= 1 ? -m : m;
  }
  /* distance to the nearest sand LIP (the rr = 1.183 contour where
     bunkMask crosses 0.45 and the surface becomes BUNKER) */
  function sandDist(wx, wz) {
    let m = 1e9;
    for (let i = 0; i < FIELD.bunk.length; i++) {
      const b = FIELD.bunk[i];
      if (FIELD.bunkRR(b, wx, wz) < 1.1834) return -1;
      const rx = b.rx * 1.1834, rz = b.rz * 1.1834;
      for (let a = 0; a < 24; a++) {
        const th = TAU * a / 24;
        const lx = rx * Math.cos(th), lz = rz * Math.sin(th);
        const px = b.x + lx * b.tz + lz * b.tx, pz = b.z - lx * b.tx + lz * b.tz;
        const dd = (px - wx) * (px - wx) + (pz - wz) * (pz - wz);
        if (dd < m) m = dd;
      }
    }
    return m === 1e9 ? 99 : Math.sqrt(m);
  }
  function ringGrad(wx, wz) {
    let g = 0;
    for (let a = 0; a < 8; a++) {
      const th = TAU * a / 8;
      g = Math.max(g, gradAt(wx + Math.cos(th) * 2.2, wz + Math.sin(th) * 2.2));
    }
    return g;
  }
  /* ═══ FC-10 — THE BUCKET MUST BE DRY ═══
     v1 shipped the pail on 9 standing IN the pool.  Pin validation now
     extends to EVERY water record on the hole — scenery pools, the canal
     strip, the civic ponds, the creeks — and the whole puttable ring around
     the cup has to be dry too, not merely the cup itself. */
  const PIN_WATER = 3.0;
  function waterDist(wx, wz) {
    let m = 99;
    const dof = clDoff(H, wx, wz);
    for (let i = 0; i < FIELD.wat.length; i++) {
      const w = FIELD.wat[i];
      let e;
      if (w.t === 'strip') {
        const dd = dof[0] < w.d0 ? w.d0 - dof[0] : (dof[0] > w.d1 ? dof[0] - w.d1 : 0);
        e = Math.max(dd, Math.abs(dof[1] - w.off) - w.w / 2);
      } else if (w.t === 'pond') {
        const dx = wx - w.x, dz = wz - w.z;
        const lx = dx * w.tz - dz * w.tx, lz = dx * w.tx + dz * w.tz;
        e = (Math.hypot(lx / w.rx, lz / w.rz) - 1) * Math.min(w.rx, w.rz);
      } else {
        e = Math.abs(dof[0] - w.d) - w.w / 2;
      }
      if (e < m) m = e;
    }
    return m;
  }
  function ringDry(wx, wz) {
    if (waterDist(wx, wz) < PIN_WATER) return false;
    for (let a = 0; a < 8; a++) {
      const th = TAU * a / 8;
      const px = wx + Math.cos(th) * 2.2, pz = wz + Math.sin(th) * 2.2;

  if (mode === 'back') {              // meter fill = the backswing winds up
    armZ = 0.14 + 1.75 * k;           // away from the target, wraps behind
    armX = -0.3 - 0.28 * k;
    torY = 0.55 * k;                  // shoulders coil away from the target
    headY = -0.38 * k;
  } else if (mode === 'thru') {       // downswing → follow-through
    const b = backK === undefined ? 1 : backK;
    armZ = lerp(0.14 + 1.75 * b, -1.7, k);   // THROUGH the ball, to the target side
    armX = lerp(-0.3 - 0.28 * b, -0.5, k);
    torY = lerp(0.55 * b, -0.8, k);
    headY = lerp(-0.38 * b, 0.35, k);
  } else if (mode === 'hold') {       // held finish while the ball flies
    armZ = -1.7; armX = -0.5; torY = -0.8; headY = 0.35;
  } else if (mode === 'pback') {      // putt pendulum: short takeaway
    armZ = 0.1 + 0.42 * k;
    armX = -0.3; torY = 0.05 * k; headY = 0;
  } else if (mode === 'pthru') {      // putt pendulum: stroke through
    const b = backK === undefined ? 1 : backK;
    armZ = lerp(0.1 + 0.42 * b, -(0.16 + 0.34 * b), k);
    armX = -0.3; torY = lerp(0.05 * b, -0.05, k); headY = 0;
  } else if (mode === 'phold') {      // held putt finish — no wrap
    armZ = -0.34; armX = -0.3; torY = -0.05; headY = 0;
  } else if (mode === 'walk') {       // birdseed beat: stroll to the cup
    armZ = 0.08 + Math.sin(t * 7) * 0.22;
    armX = -0.34;
    torY = Math.sin(t * 7) * 0.05;
    headY = 0;
  } else if (mode === 'sprinkle') {   // birdseed beat: MAKE IT RAIN
    torX = -0.07 * k;                 // slight showman's back-lean
    armX = -0.3 - 1.85 * k;           // arms swing up-forward overhead
    armZ = 0.1 + Math.sin(t * 24) * 0.16 * k;   // the wrist flick
    torY = Math.sin(t * 12) * 0.05 * k;
    headY = 0;
  } else {                            // idle address waggle
    armZ = 0.08 + Math.sin(t * 1.3) * 0.035;
    torY = Math.sin(t * 0.9) * 0.015;
    headY = 0;
  }
  arms.rotation.z = armZ;
  arms.rotation.x = armX;
  torso.rotation.y = torY;
  torso.rotation.x = torX;
  head.rotation.y = headY;
  // the club is set aside for the seed toss (its own mesh, see buildGolfer)
  if (g.userData.club) g.userData.club.visible = mode !== 'sprinkle';
}

  for (let k = 0; k < count; k++) {
    const i = pool.head; pool.head = (pool.head + 1) % pool.n;
    pool.pos[i * 3] = x; pool.pos[i * 3 + 1] = y; pool.pos[i * 3 + 2] = z;
    pool.vel[i * 3] = (Math.random() - 0.5) * spread;
    pool.vel[i * 3 + 1] = up * (0.5 + Math.random() * 0.9);
    pool.vel[i * 3 + 2] = (Math.random() - 0.5) * spread;

  if (!pool.active) return;

    if (pool.life[i] <= 0) continue;
    pool.life[i] -= dt;
    if (pool.life[i] <= 0) { pool.pos[i * 3 + 1] = -999; continue; }
    alive++;
    pool.vel[i * 3 + 1] -= 5.5 * dt;
    pool.pos[i * 3] += pool.vel[i * 3] * dt * 3.5;
    pool.pos[i * 3 + 1] += pool.vel[i * 3 + 1] * dt * 3.5;

   Top-down schematic drawn in WORLD space rotated so tee→green runs
   bottom→top (doglegs stay doglegs).  The base canvas bakes at hole build;
   the live canvas redraws base+overlay ONLY when aim/club/ball/turn state

function mapXY(x, z, out) {
  /* world → map: u along tee→green (up), v the data-frame lateral.  FC-5
     aim-mirror fix: the data frame's +off is the player's LEFT as the camera
     sees it (screen-right = (-cos aim, sin aim)), so the map's x axis takes
     -v — aim-right now moves the marker RIGHT on the map, and doglegs match
     what the player sees down the hole. */

  const u = dx * MAPS.ux + dz * MAPS.uz;
  const v = dx * MAPS.uz - dz * MAPS.ux;

}
/* ── FC-5 minimap zoom: full hole → approach window (≤120 yds) → green ──

  const W2 = mapBase.width, H2 = mapBase.height;
  let uMin, uMax, vMin, vMax, cap = 1e9;
  const _a = [0, 0], _b = [0, 0];
  const uv = (x, z, out) => { out[0] = x * MAPS.ux + z * MAPS.uz; out[1] = x * MAPS.uz - z * MAPS.ux; };
  if (mode === 'green') {
    uv(GREEN.x, GREEN.z, _a);
    const r = Math.max(GREEN.grx, GREEN.grz) + 8;
    uMin = _a[0] - r; uMax = _a[0] + r; vMin = _a[1] - r; vMax = _a[1] + r;
    cap = 5.5;
  } else if (mode === 'approach') {
    uv(p.ball.x, p.ball.z, _a);
    uv(GREEN.x, GREEN.z, _b);
    const r = Math.max(GREEN.grx, GREEN.grz) + 10;
    uMin = Math.min(_a[0] - 9, _b[0] - r); uMax = Math.max(_a[0] + 9, _b[0] + r);
    vMin = Math.min(_a[1] - 12, _b[1] - r); vMax = Math.max(_a[1] + 12, _b[1] + r);
    cap = 4.2;

    uMin = 1e9; uMax = -1e9; vMin = 1e9; vMax = -1e9;

      const u = pt[0] * MAPS.ux + pt[1] * MAPS.uz;
      const v = pt[0] * MAPS.uz - pt[1] * MAPS.ux;

      vMin = Math.min(vMin, v - 34); vMax = Math.max(vMax, v + 34);

/* the schematic base — redrawn only at hole build and during zoom eases */

       player plans his chain of hops across.  Lighter than the ground
       around them; a dry lot reads straw, because a dry lot plays scruffy. */
    for (const l of (H.scenery.lots || [])) {
      const m = P(l[0], l[1]);

      // ellipse helper below takes its tangent in

    c.fillStyle = H.scenery ? MAP_COLS.mat : MAP_COLS.tee;
    c.fillRect(m[0] - w3, m[1] - h3, w3 * 2, h3 * 2);
    c.strokeStyle = 'rgba(242,240,232,0.7)';
    c.lineWidth = 1;

      for (let azk = -3; azk <= 3; azk++) {
        const lx = axk * GREEN.grx / 3.4, lz = azk * GREEN.grz / 3.4;
        if (Math.hypot(lx / GREEN.grx, lz / GREEN.grz) > 0.92) continue;
        const x = GREEN.x + GREEN.tz * lx + GREEN.tx * lz;
        const z = GREEN.z - GREEN.tx * lx + GREEN.tz * lz;
        const gx2 = (groundH(x + 0.8, z) - groundH(x - 0.8, z)) / 1.6;
        const gz2 = (groundH(x, z + 0.8) - groundH(x, z - 0.8)) / 1.6;
        const mag = Math.hypot(gx2, gz2);
        if (mag < 0.001) continue;
        const dx = -gx2 / mag, dz = -gz2 / mag;         // downhill (world)
        const mdx = -(dx * MAPS.uz - dz * MAPS.ux);     // map x = -v
        const mdy = -(dx * MAPS.ux + dz * MAPS.uz);     // map y = -u
        const m = P(x, z);
        const L2 = 6.5;
        const tipX = m[0] + mdx * L2, tipY = m[1] + mdy * L2;
        const k2 = clamp(mag * 18, 0, 1);
        c.strokeStyle = `rgba(255,${Math.round(255 - 150 * k2)},${Math.round(255 - 190 * k2)},0.85)`;
        c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(m[0], m[1]); c.lineTo(tipX, tipY);
        c.moveTo(tipX - mdy * 2 - mdx * 2.4, tipY + mdx * 2 - mdy * 2.4);
        c.lineTo(tipX, tipY);
        c.lineTo(tipX + mdy * 2 - mdx * 2.4, tipY - mdx * 2 - mdy * 2.4);

}
/* overlay: ball dots + aim line + PROJECTED LANDING from the live arc sim */

function redrawMap() {

  mapCtx.strokeStyle = MAP_COLS.pin;

    mapCtx.lineWidth = 3.6;
    mapCtx.beginPath(); mapCtx.arc(_mp2[0], _mp2[1], 4.6, 0, TAU); mapCtx.stroke();
    mapCtx.strokeStyle = '#ffd75e';
    mapCtx.lineWidth = 1.8;

      mapCtx.lineWidth = 1.6;
      mapCtx.setLineDash([2, 2]);
      mapCtx.beginPath(); mapCtx.moveTo(_mp2[0], _mp2[1]); mapCtx.lineTo(_mp[0], _mp[1]); mapCtx.stroke();
      mapCtx.setLineDash([]);
      mapCtx.strokeStyle = 'rgba(8,26,16,0.85)';
      mapCtx.lineWidth = 2.8;
      mapCtx.beginPath(); mapCtx.arc(_mp[0], _mp[1], 2.9, 0, TAU); mapCtx.stroke();
      mapCtx.strokeStyle = '#c8f0a4';
      mapCtx.lineWidth = 1.4;

    mapCtx.beginPath(); mapCtx.arc(_mp[0], _mp[1], 3.4, 0, TAU); mapCtx.fill();
    mapCtx.fillStyle = '#ffffff';

}
