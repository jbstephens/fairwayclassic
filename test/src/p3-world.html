<script>
/* ═══════════ p3 — world: renderer, sky, hole builder, actors ═══════════
   FC-LOOK-1: lit/graded pipeline (ACES + Lambert + baked AO + one 1024
   shadow map + one post pass), default ON; ?look=0 reverts to the v1 flat
   pipeline.  All laws Pi-measured (gameconsole/lab 2026-09-12, PP-LOOK). */

/* ── renderer / scene / lights (house recipe + look pipeline) ── */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: LOOK, powerPreference: 'high-performance', stencil: false,
});
renderer.setPixelRatio(1);
renderer.setSize(VW, VH, false);
renderer.info.autoReset = false;   // manual reset in frame(): shadow + scene + post all counted
/* live-toggleable pipeline flags (kiosk A/B via __fcLook) */
const FX = { shadow: LOOK && !LOWFX, post: LOOK, msaa: LOOK };
if (LOOK) {
  /* Color pipeline (PP-LOOK law, Pi-measured): the baked vertex colors are
     DISPLAY-REFERRED. outputEncoding stays at the default LinearEncoding
     (pass-through) — adding sRGBEncoding would double-encode and wash the
     whole course out (PP's first-cut failure). ACES lifts midtones and
     desaturates; the grade's gamma/sat knobs below undo exactly that. */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.04;
  renderer.shadowMap.enabled = FX.shadow;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const vigEl = document.getElementById('vignette');
  if (vigEl) vigEl.style.display = 'none';   // the post pass owns the vignette
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, VW / VH, 0.2, 2000);
camera.position.set(0, 4, -12);

const FOGC = LOOK ? 0xdde8d2 : 0xdfe9d8;
scene.fog = new THREE.Fog(FOGC, 260, 850);

/* LOOK_TUNE — the per-scene grade + light knobs (PP pattern; kiosk-tunable
   live via __fcLook.set).  Order in the post shader: black-point subtract →
   per-channel gain → gamma (undoes the ACES midtone lift) → saturation
   (ACES desaturates) → vignette. */
const LOOK_TUNE = {
  sun: 0.88, hemi: 0.44, exp: 1.0,
  lift: [0.022, 0.022, 0.025],
  gain: [1.34, 1.3, 1.22],
  gamma: [1.42, 1.4, 1.44],
  sat: 1.28, vig: 0.28,
};
const sunLight = new THREE.DirectionalLight(0xffedd2, LOOK ? LOOK_TUNE.sun : 1.0);
sunLight.position.set(83, 100, -75);
scene.add(sunLight);
const hemiLight = new THREE.HemisphereLight(0xbfd8ff, 0x6da868, LOOK ? LOOK_TUNE.hemi : 0.55);
scene.add(hemiLight);

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

/* ── merged-geometry kit with cel-ramp baked lighting ── */
const SUNDIR = (() => { const v = [0.5, 0.6, -0.45]; const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();

/* ONE 1024 directional shadow map (LAW: never 2048).  Casters are CURATED:
   golfer, flag, caddie bag, near-corridor tree cones — terrain NEVER casts,
   everything (lambert) receives.  The box follows the camera's subject. */
if (LOOK) {
  sunLight.castShadow = FX.shadow;
  sunLight.shadow.mapSize.set(1024, 1024);
  const shc = sunLight.shadow.camera;
  shc.left = -62; shc.right = 62; shc.top = 62; shc.bottom = -62;
  shc.near = 10; shc.far = 340;
  shc.updateProjectionMatrix();
  sunLight.shadow.bias = -0.0008;
  scene.add(sunLight.target);
}
function aimSun(x, y, z) {
  sunLight.position.set(x + SUNDIR[0] * 150, y + SUNDIR[1] * 150, z + SUNDIR[2] * 150);
  sunLight.target.position.set(x, y, z);
  sunLight.target.updateMatrixWorld();
}

function MD() { return { p: [], c: [] }; }
function bakeCol(nx, ny, nz, c, out) {
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  if (d > 0.55) { out[0] = Math.min(1, c[0] * 1.09 + 0.02); out[1] = Math.min(1, c[1] * 1.05 + 0.015); out[2] = c[2] * 0.98; }
  else if (d > 0.1) { out[0] = Math.min(1, c[0] * 1.0 + 0.01); out[1] = c[1] * 0.97; out[2] = c[2] * 0.95; }
  else if (d > -0.15) { out[0] = c[0] * 0.78; out[1] = c[1] * 0.8; out[2] = c[2] * 0.86; }
  else { out[0] = c[0] * 0.55; out[1] = c[1] * 0.6; out[2] = Math.min(1, c[2] * 0.75 + 0.05); }
}
function bakeColWarm(nx, ny, nz, c, out) {
  const d = nx * SUNDIR[0] + ny * SUNDIR[1] + nz * SUNDIR[2];
  if (d > 0.55) { out[0] = Math.min(1, c[0] * 1.09 + 0.02); out[1] = Math.min(1, c[1] * 1.05 + 0.015); out[2] = c[2] * 0.98; }
  else if (d > 0.1) { out[0] = Math.min(1, c[0] * 1.0 + 0.01); out[1] = c[1] * 0.97; out[2] = c[2] * 0.94; }
  else if (d > -0.15) { out[0] = c[0] * 0.82; out[1] = c[1] * 0.79; out[2] = c[2] * 0.74; }
  else { out[0] = c[0] * 0.6; out[1] = c[1] * 0.55; out[2] = c[2] * 0.48; }
}
const _bc = [0, 0, 0];
function pushTriW(md, ax, ay, az, bx, by, bz, cx, cy, cz, c, warm) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const vx = cx - ax, vy = cy - ay, vz = cz - az;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  (warm ? bakeColWarm : bakeCol)(nx / l, ny / l, nz / l, c, _bc);
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  md.c.push(_bc[0], _bc[1], _bc[2], _bc[0], _bc[1], _bc[2], _bc[0], _bc[1], _bc[2]);
}
/* terrain tri: per-corner colors, one face-normal bake factor for all three */
function pushTriT(md, ax, ay, az, bx, by, bz, cx, cy, cz, ca, cb, cc) {
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const vx = cx - ax, vy = cy - ay, vz = cz - az;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  md.p.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  bakeCol(nx / l, ny / l, nz / l, ca, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
  bakeCol(nx / l, ny / l, nz / l, cb, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
  bakeCol(nx / l, ny / l, nz / l, cc, _bc); md.c.push(_bc[0], _bc[1], _bc[2]);
}
function mdMesh(md, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(md.p), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(md.c), 3));
  // the lit pipeline needs real normals (non-indexed tris → flat facets);
  // lambert surfaces all RECEIVE the one shadow map (terrain never casts)
  if (LOOK && mat && mat.isMeshLambertMaterial) g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  if (LOOK && mat && mat.isMeshLambertMaterial) m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  m.updateMatrix();
  return m;
}
/* outward-wound triangle for lathe-like shapes: face normal must point AWAY
   from the vertical axis at (cx,cz) — inward-wound sides get backface-culled
   and domes read as crescents (found on the azalea banks, v1). */
function triOut(md, cx, cz, A, B, C, c, warm) {
  const nx = (B[1] - A[1]) * (C[2] - A[2]) - (B[2] - A[2]) * (C[1] - A[1]);
  const ny = (B[2] - A[2]) * (C[0] - A[0]) - (B[0] - A[0]) * (C[2] - A[2]);
  const nz = (B[0] - A[0]) * (C[1] - A[1]) - (B[1] - A[1]) * (C[0] - A[0]);
  const mx = (A[0] + B[0] + C[0]) / 3 - cx, mz = (A[2] + B[2] + C[2]) / 3 - cz;
  let hint = nx * mx + nz * mz;
  if (Math.abs(hint) < 1e-9) hint = ny;
  if (hint < 0) pushTriW(md, A[0], A[1], A[2], C[0], C[1], C[2], B[0], B[1], B[2], c, warm);
  else pushTriW(md, A[0], A[1], A[2], B[0], B[1], B[2], C[0], C[1], C[2], c, warm);
}
/* low-poly cone (pine canopy tier) into an MD */
function coneW(md, x, y, z, r, h, seg, c, warm) {
  for (let s = 0; s < seg; s++) {
    const a0 = TAU * s / seg, a1 = TAU * (s + 1) / seg;
    triOut(md, x, z,
      [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r],
      [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r],
      [x, y + h, z], c, warm);
  }
}
function trunkW(md, x, y, z, r, h, c) {
  const seg = 4;
  for (let s = 0; s < seg; s++) {
    const a0 = TAU * s / seg + 0.4, a1 = TAU * (s + 1) / seg + 0.4;
    const b0 = [x + Math.cos(a0) * r, y, z + Math.sin(a0) * r];
    const b1 = [x + Math.cos(a1) * r, y, z + Math.sin(a1) * r];
    const t0 = [x + Math.cos(a0) * r * 0.7, y + h, z + Math.sin(a0) * r * 0.7];
    const t1 = [x + Math.cos(a1) * r * 0.7, y + h, z + Math.sin(a1) * r * 0.7];
    triOut(md, x, z, b0, b1, t1, c, true);
    triOut(md, x, z, b0, t1, t0, c, true);
  }
}
/* bumpy mound (azalea / dogwood bank / boxwood / flower bed) */
function moundW(md, x, y, z, r, hMul, c, rng, warm) {
  const seg = 6, tiers = [[1.0, 0], [0.82, 0.5], [0.5, 0.85], [0, 1.05]];
  for (let i = 0; i < tiers.length - 1; i++) {
    const [r0, h0] = tiers[i], [r1, h1] = tiers[i + 1];
    for (let s = 0; s < seg; s++) {
      const a0 = TAU * s / seg, a1 = TAU * (s + 1) / seg;
      const j = 1 + (rng() - 0.5) * 0.35;
      const cc = [clamp(c[0] * j, 0, 1), clamp(c[1] * j, 0, 1), clamp(c[2] * j, 0, 1)];
      const p00 = [x + Math.cos(a0) * r * r0, y + h0 * r * hMul, z + Math.sin(a0) * r * r0];
      const p01 = [x + Math.cos(a1) * r * r0, y + h0 * r * hMul, z + Math.sin(a1) * r * r0];
      const p10 = [x + Math.cos(a0) * r * r1, y + h1 * r * hMul, z + Math.sin(a0) * r * r1];
      const p11 = [x + Math.cos(a1) * r * r1, y + h1 * r * hMul, z + Math.sin(a1) * r * r1];
      if (r1 < 0.001) {
        triOut(md, x, z, p00, p01, [x, y + h1 * r * hMul, z], cc, warm);
      } else {
        triOut(md, x, z, p00, p01, p11, cc, warm);
        triOut(md, x, z, p00, p11, p10, cc, warm);
      }
    }
  }
}
/* jittered icosahedron blob — deciduous canopies (magnolia/oak/dogwood…) */
const ICO_T = (() => {
  const g = new THREE.IcosahedronGeometry(1, 0);
  const a = g.getAttribute('position').array.slice();
  g.dispose();
  return a;
})();
function ballW(md, x, y, z, r, ry, c, rng) {
  for (let f = 0; f < ICO_T.length; f += 9) {
    const j = 1 + (rng() - 0.5) * 0.22;
    const cc = [clamp(c[0] * j, 0, 1), clamp(c[1] * j, 0, 1), clamp(c[2] * j, 0, 1)];
    pushTriW(md,
      x + ICO_T[f] * r, y + ICO_T[f + 1] * r * ry, z + ICO_T[f + 2] * r,
      x + ICO_T[f + 3] * r, y + ICO_T[f + 4] * r * ry, z + ICO_T[f + 5] * r,
      x + ICO_T[f + 6] * r, y + ICO_T[f + 7] * r * ry, z + ICO_T[f + 8] * r, cc, true);
  }
}

/* ── gradient sky dome + low sun glow + soft clouds (built once) ── */
(function buildSky() {
  const geo = new THREE.SphereGeometry(950, 20, 12);
  const cnt = geo.attributes.position.count;
  const colors = new Float32Array(cnt * 3);
  // richer spring sky: deep zenith blue → luminous mid → warm cream horizon
  const zen = col(0x2f66b5), mid = col(0x82b5e4), hor = col(0xf0ead0);
  const pos = geo.attributes.position;
  for (let i = 0; i < cnt; i++) {
    const y = pos.getY(i) / 950;
    const t = clamp(y, 0, 1);
    const c = t < 0.26 ? mix3(hor, mid, smoothstep(t / 0.26)) : mix3(mid, zen, smoothstep((t - 0.26) / 0.74));
    colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2];
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false });
  const dome = new THREE.Mesh(geo, mat);
  dome.renderOrder = -10;
  dome.frustumCulled = false;
  dome.matrixAutoUpdate = false;
  scene.add(dome);
  // sun disc + halo — geometry glow, never post
  const mk = (r, cc, op, blend) => {
    const md = MD();
    for (let s = 0; s < 14; s++) {
      const a0 = TAU * s / 14, a1 = TAU * (s + 1) / 14;
      md.p.push(0, 0, 0, Math.cos(a0) * r, Math.sin(a0) * r, 0, Math.cos(a1) * r, Math.sin(a1) * r, 0);
      md.c.push(cc[0], cc[1], cc[2], cc[0], cc[1], cc[2], cc[0], cc[1], cc[2]);
    }
    return mdMesh(md, new THREE.MeshBasicMaterial({
      vertexColors: true, fog: false, transparent: true, opacity: op,
      blending: blend ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: false,
    }));
  };
  const sg = new THREE.Group();
  const halo2 = mk(190, [1, 0.9, 0.66], 0.16, true);   // wide warm wash
  const halo = mk(95, [1, 0.95, 0.78], 0.34, true);
  const disc = mk(34, [1, 0.99, 0.92], 0.95, false);
  sg.add(halo2); sg.add(halo); sg.add(disc);
  sg.position.set(SUNDIR[0] * 880, SUNDIR[1] * 880, SUNDIR[2] * 880);
  sg.lookAt(0, 0, 0);
  scene.add(sg);
  // soft cloud sprites (cap: sun glows + clouds ≤ 15 sprites; LOWFX halves)
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 128;
  const g2 = cnv.getContext('2d');
  const puff = (px, py, pr, a) => {
    const gr = g2.createRadialGradient(px, py, pr * 0.1, px, py, pr);
    gr.addColorStop(0, 'rgba(255,253,248,' + a + ')');
    gr.addColorStop(0.6, 'rgba(252,250,246,' + (a * 0.55) + ')');
    gr.addColorStop(1, 'rgba(250,248,246,0)');
    g2.fillStyle = gr;
    g2.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  };
  puff(90, 74, 62, 0.85); puff(140, 62, 52, 0.8); puff(180, 76, 46, 0.75);
  puff(60, 82, 40, 0.7); puff(118, 84, 58, 0.6);
  const ctex = new THREE.CanvasTexture(cnv);
  const cmat = new THREE.SpriteMaterial({ map: ctex, transparent: true, depthWrite: false, fog: false, opacity: 0.9 });
  const CLOUDS = LOWFX ? 3 : 6;
  const cseed = mulberry32(777);
  for (let i = 0; i < CLOUDS; i++) {
    const s = new THREE.Sprite(cmat);
    const a = (i / CLOUDS) * TAU + cseed() * 0.9;
    const r = 540 + cseed() * 200;
    s.position.set(Math.cos(a) * r, 130 + cseed() * 130, Math.sin(a) * r);
    s.scale.set(280 + cseed() * 160, 95 + cseed() * 45, 1);
    scene.add(s);
  }
})();

/* ── shared materials (never disposed) ── */
const MAT_TERRAIN = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                         : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_SCENERY = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                         : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_WATER = new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_SHINE = new THREE.MeshBasicMaterial({
  color: 0xbfe8ff, transparent: true, opacity: 0.1,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const MAT_PROPS = LOOK ? new THREE.MeshLambertMaterial({ vertexColors: true })
                       : new THREE.MeshBasicMaterial({ vertexColors: true });
const MAT_ARROWS = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide });
const MAT_SHADOW = new THREE.MeshBasicMaterial({ color: 0x123317, transparent: true, opacity: 0.32, depthWrite: false });
// caster-only material: writes no color — the shadow pass draws its depth
const MAT_CASTER = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });

/* ── per-hole state (rebuilt at each hole transition) ── */
let CUR = null;            // current hole record
let groundH = (x, z) => 0; // physics-authoritative terrain height (== rendered tris)
let anaColorAt = null;
const HOLE_OBJS = [];      // meshes to remove+dispose on transition
const TREES = [];          // {x, z, cr, cy0, cy1} canopy collision volumes
const WATERS = [];         // resolved water shapes (world-space test fns)
let PIN = { x: 0, y: 0, z: 0 };
let GREEN = null;          // {x, z, grx, grz, tx, tz, nx, nz, h}
let flagGrp = null, flagCloth = null;
let waterShine = null;
let greenArrows = null;
let treeCaster = null;     // curated near-corridor shadow casters (LOOK)

function disposeHole() {
  for (const m of HOLE_OBJS) {
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material && m.material.dispose && ![MAT_TERRAIN, MAT_SCENERY, MAT_WATER, MAT_SHINE, MAT_PROPS, MAT_ARROWS, MAT_SHADOW, MAT_CASTER].includes(m.material)) m.material.dispose();
  }
  HOLE_OBJS.length = 0;
  TREES.length = 0;
  WATERS.length = 0;
  flagGrp = null; flagCloth = null; waterShine = null; greenArrows = null;
  treeCaster = null;
}

/* elevation profile: [[frac, yds]] control points, smoothstep between */
function elevAt(H, d) {
  const f = clamp(d / H.len, 0, 1);
  const e = H.elv;
  for (let i = 0; i < e.length - 1; i++) {
    if (f <= e[i + 1][0] || i === e.length - 2) {
      const t = smoothstep((f - e[i][0]) / (e[i + 1][0] - e[i][0] || 1));
      return lerp(e[i][1], e[i + 1][1], t);
    }
  }
  return e[e.length - 1][1];
}

/* the whole-hole analytic field: height + surface + color in one pass */
function makeHoleField(H) {
  const gp = clPoint(H, H.len);
  const gx = gp[0], gz = gp[1], gtx = gp[2], gtz = gp[3];   // green center + approach dir
  const g = H.green;
  const grx = g.r * (g.gex || 1), grz = g.r * (g.gex ? 0.55 : 1);
  const gh = elevAt(H, H.len);
  GREEN = { x: gx, z: gz, grx, grz, tx: gtx, tz: gtz, h: gh, sx: g.sx, sz: g.sz, r: g.r };
  // resolved hazards in world space
  const bunk = H.bunkers.map(b => {
    const w = clWorld(H, b[0], b[1]);
    const p = clPoint(H, b[0]);
    return { x: w[0], z: w[1], rx: b[2], rz: b[3], tx: p[2], tz: p[3] };
  });
  const wat = H.water.map(w => {
    if (w.t === 'pond') {
      const c = clWorld(H, w.d, w.off);
      const p = clPoint(H, w.d);
      const wl = elevAt(H, w.d) - 0.55;
      return { t: 'pond', x: c[0], z: c[1], rx: w.rx, rz: w.rz, tx: p[2], tz: p[3], wl };
    }
    const wl = elevAt(H, w.d) - 0.55;
    return { t: 'creek', d: w.d, w: w.w, wl };
  });
  for (const w of wat) WATERS.push(w);
  // local green-frame coords of (x,z)
  function greenLoc(x, z, out) {
    const dx = x - gx, dz = z - gz;
    out[0] = dx * gtz - dz * gtx;      // lateral (right of approach +)
    out[1] = dx * gtx + dz * gtz;      // along approach
  }
  const _gl = [0, 0];
  function waterMask(w, x, z, d, off) {
    if (w.t === 'pond') {
      const dx = x - w.x, dz = z - w.z;
      const lx = dx * w.tz - dz * w.tx, lz = dx * w.tx + dz * w.tz;
      const rr = Math.hypot(lx / w.rx, lz / w.rz);
      return clamp((1 - rr) * 4 + 1, 0, 1);          // 1 inside, 0 outside band
    }
    const dd = Math.abs(d - w.d) - w.w / 2;
    if (Math.abs(off) > 72) return 0;
    return clamp(1 - dd * 0.7, 0, 1);
  }
  function bunkMask(b, x, z) {
    const dx = x - b.x, dz = z - b.z;
    const lx = dx * b.tz - dz * b.tx, lz = dx * b.tx + dz * b.tz;
    const rr = Math.hypot(lx / b.rx, lz / b.rz);
    return clamp((1 - rr) * 3 + 1, 0, 1);
  }
  /* height + classification.  out = [h, surfCode]
     surf: 0 rough, 1 fairway, 2 green, 3 fringe, 4 sand, 5 water, 6 tee */
  const _out = [0, 0];
  function field(x, z) {
    const dof = clDoff(H, x, z);
    const d = dof[0], off = dof[1], away = Math.abs(off);
    let h = elevAt(H, d);
    h += vnoise(x * 0.045, z * 0.045) * (0.22 + smoothstep((away - H.fw - 4) / 26) * 1.5);
    h += smoothstep((away - 46) / 24) * 3.2;
    let surf = 0;

/* world-space surface under a point — the physics/lie authority */
let FIELD = null;
function surfAt(x, z) { return FIELD ? FIELD(x, z)[1] : 0; }
const SURF_NAMES = ['ROUGH', 'FAIRWAY', 'GREEN', 'FRINGE', 'BUNKER', 'WATER', 'TEE'];

/* ── colors ── */
const C_FW_A = col(0x46a038), C_FW_B = col(0x2c7421);
const C_ROUGH = col(0x2a6f2a), C_ROUGH2 = col(0x225e23);
const C_STRAW = col(0x8a6a3c), C_GREEN_A = col(0x54bb49), C_GREEN_B = col(0x3f9c36);
const C_FRINGE = col(0x459e3c), C_SAND = col(0xf2e9c8), C_SANDLO = col(0xcfc094);

const C_PINE = col(0x1a4423), C_PINE2 = col(0x2a5c31), C_PINE3 = col(0x39763c);
const C_TRUNK = col(0x4c3a27);
const C_OAK = col(0x3a7434), C_OAK2 = col(0x4f8c3e);
const C_AZALEA = col(0xe06a9f), C_AZALEA2 = col(0xf2a0c2), C_AZALEA3 = col(0xc23a63);
const C_DOGWOOD = col(0xf4eee2), C_DOGWOOD2 = col(0xf6dfe6);
const C_CAMELLIA = col(0xb42848), C_CAMELLIA2 = col(0xd8506a);
const C_BOXWOOD = col(0x2a5e28);
const C_PAMPAS = col(0xdfd0a0), C_PAMPAS2 = col(0xefe6c4);
const C_BED_Y = col(0xe8c33a), C_BED_R = col(0xd8503a), C_BED_W = col(0xf2eee0);
const C_STONE = col(0x8d8a80), C_STONE2 = col(0x6f6c62);

/* ── the hole builder — fires only at hole transitions ── */

  }
  // physics == rendered triangulation (diagonal p00-p11, same as emission)

    if (x < x0 || z < z0 || x >= x1 - GRID_STEP || z >= z1 - GRID_STEP) return FIELD(x, z)[0];
    const fx = (x - x0) / GRID_STEP, fz = (z - z0) / GRID_STEP;

      if (Math.abs(dof[1]) > 78) continue;

    const cHi = mix3(C_PINE2, C_PINE3, rng(), [0, 0, 0]);

  }

    bank(DW, 30, () => {
      const a = rng() * TAU;
      const rr = GREEN.grx + 6 + rng() * 15;
      return [GREEN.x + Math.cos(a) * rr, GREEN.z + Math.sin(a) * rr * 0.9];
    }, 1.7, 3.2);
    for (let k = 0; k < 7; k++) {
      const d = H.len * (0.5 + rng() * 0.45);
      const w = clWorld(H, d, (rng() < 0.5 ? -1 : 1) * (H.fw + 10 + rng() * 12));

  if (H.camellia) {
    const CM = [C_CAMELLIA, C_CAMELLIA2, C_AZALEA3];
    bank(CM, 26, () => {
      const a = rng() * TAU;
      const rr = GREEN.grx + 6 + rng() * 14;

      const d = 20 + rng() * (H.len - 60);
      const w = clWorld(H, d, (rng() < 0.5 ? -1 : 1) * (H.fw + 4 + rng() * 7));
      if (!plantable(w[0], w[1])) continue;
      const y = groundH(w[0], w[1]) - 0.2;
      const s = 0.7 + rng() * 0.5;
      moundW(sc, w[0], y, w[1], 1.0 * s, 0.9, C_PAMPAS, rng, true);
      // plumes: a few pale mini-cones rising from the tuft
      for (let q = 0; q < 3; q++) {
        const px = w[0] + (rng() - 0.5) * 1.2 * s, pz = w[1] + (rng() - 0.5) * 1.2 * s;
        coneW(sc, px, y + 1.0 * s, pz, 0.16 * s, 1.5 * s, 3, C_PAMPAS2, true);
      }
    }
  }
  // gallery-lined finish (18): hedge ropes + flower drifts up the last stretch
  if (H.gallery) {
    for (const side of [-1, 1]) {
      for (let k = 0; k < 44; k++) {
        const d = 46 + k * 9 + rng() * 3;
        const w = clWorld(H, d, side * (H.fw + 5 + rng() * 2.5));
        if (!plantable(w[0], w[1])) continue;
        moundW(sc, w[0], groundH(w[0], w[1]) - 0.3, w[1], 1.2 + rng() * 0.7, 0.7, C_BOXWOOD, rng, true);
        if (k % 3 === 0) {
          const f = clWorld(H, d + 3, side * (H.fw + 9 + rng() * 3));
          if (plantable(f[0], f[1])) moundW(sc, f[0], groundH(f[0], f[1]) - 0.3, f[1], 0.9 + rng() * 0.6, 0.8, [C_BED_Y, C_BED_R, C_AZALEA2][k % 3 === 0 ? (k / 3 | 0) % 3 : 0], rng, false);
        }
      }
    }
  }
  // creek banks (12/13): blossom drifts + worn creek stones
  for (const w of FIELD.wat) {
    if (w.t !== 'creek') continue;
    const cMain = H.azalea ? C_AZALEA : H.dogwood ? C_DOGWOOD : C_BOXWOOD;
    const cAlt = H.azalea ? C_AZALEA2 : H.dogwood ? C_DOGWOOD2 : C_PINE3;
    for (let k = 0; k < 22; k++) {
      const off = -40 + rng() * 80;
      const p = clWorld(H, w.d + w.w / 2 + 3.5 + rng() * 5, off);
      if (!plantable(p[0], p[1])) continue;
      moundW(sc, p[0], groundH(p[0], p[1]) - 0.3, p[1], 1.6 + rng() * 1.6, 0.75, rng() < 0.5 ? cMain : cAlt, rng, false);
    }
    // stones along both lips of the cut
    for (let k = 0; k < 26; k++) {
      const off = -34 + rng() * 68;
      const side = rng() < 0.5 ? -1 : 1;
      const p = clWorld(H, w.d + side * (w.w / 2 + 0.6 + rng() * 1.6), off);
      const y = groundH(p[0], p[1]);
      const sR = 0.35 + rng() * 0.5;
      ballW(sc, p[0], y + sR * 0.25, p[1], sR, 0.55, rng() < 0.5 ? C_STONE : C_STONE2, rng);
    }
  }
  const scenery = mdMesh(sc, MAT_SCENERY);
  scene.add(scenery); HOLE_OBJS.push(scenery);
  // the curated tree-caster mesh (depth-only; the color pass writes nothing)
  if (LOOK && castMd.p.length) {
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(castMd.p), 3));
    treeCaster = new THREE.Mesh(cg, MAT_CASTER);
    treeCaster.castShadow = true;
    treeCaster.matrixAutoUpdate = false;
    scene.add(treeCaster); HOLE_OBJS.push(treeCaster);
  }

  // ── pin: cup + flagstick + cloth; tee markers ──
  const rngP = mulberry32(55 + idx * 31);
  const pox = (rngP() - 0.5) * GREEN.grx * 0.5, poz = (rngP() - 0.5) * GREEN.grz * 0.5;
  PIN.x = GREEN.x + GREEN.tz * pox + GREEN.tx * poz;
  PIN.z = GREEN.z - GREEN.tx * pox + GREEN.tz * poz;
  PIN.y = groundH(PIN.x, PIN.z);
  const pm = MD();
  // cup: dark disc
  for (let s = 0; s < 8; s++) {
    const a0 = TAU * s / 8, a1 = TAU * (s + 1) / 8;
    pm.p.push(PIN.x, PIN.y + 0.02, PIN.z,
      PIN.x + Math.cos(a1) * 0.36, PIN.y + 0.02, PIN.z + Math.sin(a1) * 0.36,
      PIN.x + Math.cos(a0) * 0.36, PIN.y + 0.02, PIN.z + Math.sin(a0) * 0.36);
    for (let k = 0; k < 3; k++) pm.c.push(0.06, 0.08, 0.06);
  }
  // tee markers: two white spheres-ish boxes at the tee
  const tw = clWorld(H, 2, 0);
  const teeY = groundH(tw[0], tw[1]);
  for (const s of [-6.5, 6.5]) {
    const mx = tw[0] + s, mz = tw[1];
    for (let q = 0; q < 4; q++) {
      const a0 = TAU * q / 4, a1 = TAU * (q + 1) / 4;
      pm.p.push(mx, teeY + 0.5, mz,
        mx + Math.cos(a1) * 0.26, teeY, mz + Math.sin(a1) * 0.26,
        mx + Math.cos(a0) * 0.26, teeY, mz + Math.sin(a0) * 0.26);
      for (let k = 0; k < 3; k++) pm.c.push(0.95, 0.94, 0.86);
    }
  }
  const props = mdMesh(pm, MAT_PROPS);
  scene.add(props); HOLE_OBJS.push(props);
  // flag: pole + yellow cloth (cloth flutters via its group); both CAST
  flagGrp = new THREE.Group();
  const poleG = new THREE.CylinderGeometry(0.06, 0.08, 7.4, 5);
  const pole = new THREE.Mesh(poleG, new THREE.MeshBasicMaterial({ color: 0xf2f0e8 }));
  pole.position.y = 3.7;
  pole.castShadow = LOOK;
  flagGrp.add(pole);
  const clothMd = MD();
  clothMd.p.push(0, 7.1, 0, 2.3, 6.75, 0, 0, 6.4, 0);
  const yF = col(0xffd218);
  for (let k = 0; k < 3; k++) clothMd.c.push(yF[0], yF[1], yF[2]);
  const clothG = new THREE.BufferGeometry();
  clothG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(clothMd.p), 3));
  clothG.setAttribute('color', new THREE.BufferAttribute(new Float32Array(clothMd.c), 3));
  flagCloth = new THREE.Mesh(clothG, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  flagCloth.castShadow = LOOK;
  flagGrp.add(flagCloth);
  flagGrp.position.set(PIN.x, PIN.y, PIN.z);
  scene.add(flagGrp); HOLE_OBJS.push(flagGrp);

  // ── green-read arrows (visible only in green-read / pro putt) ──
  const am = MD();
  const aC0 = [1, 1, 1], aC1 = [1, 0.35, 0.25];
  for (let axk = -4; axk <= 4; axk++) {
    for (let azk = -4; azk <= 4; azk++) {
      const lx = axk * GREEN.grx / 4.4, lz = azk * GREEN.grz / 4.4;
      if (Math.hypot(lx / GREEN.grx, lz / GREEN.grz) > 0.95) continue;
      const x = GREEN.x + GREEN.tz * lx + GREEN.tx * lz;
      const z = GREEN.z - GREEN.tx * lx + GREEN.tz * lz;
      const h0 = groundH(x, z);
      const gx2 = (groundH(x + 0.8, z) - groundH(x - 0.8, z)) / 1.6;
      const gz2 = (groundH(x, z + 0.8) - groundH(x, z - 0.8)) / 1.6;
      const mag = Math.hypot(gx2, gz2);
      if (mag < 0.001) continue;
      const dx = -gx2 / mag, dz = -gz2 / mag;   // downhill
      const L = 1.5, W = 0.42;
      const tipX = x + dx * L, tipZ = z + dz * L;
      const c = mix3(aC0, aC1, clamp(mag * 18, 0, 1), [0, 0, 0]);
      am.p.push(tipX, groundH(tipX, tipZ) + 0.07, tipZ,
        x - dz * W, h0 + 0.07, z + dx * W,
        x + dz * W, h0 + 0.07, z - dx * W);
      for (let k = 0; k < 3; k++) am.c.push(c[0], c[1], c[2]);
    }
  }
  greenArrows = mdMesh(am, MAT_ARROWS);
  greenArrows.visible = false;
  scene.add(greenArrows); HOLE_OBJS.push(greenArrows);

  bakeMap(H);            // FC-LOOK-1: hole HUD minimap base (canvas, per hole)

  const ms = performance.now() - t0;
  window.__fcLastBuild = { hole: idx + 1, ms, tris: md.p.length / 9 + sc.p.length / 9 };
  return ms;
}

/* pose driver — address waggle, backswing, follow-through hold */
function golferPose(g, mode, k, t, backK) {
  const arms = g.userData.arms, torso = g.userData.torso, head = g.userData.head;
  let armZ = -0.08, armX = -0.3, torY = 0, headY = 0;
  if (mode === 'back') {              // meter fill = the backswing winds up
    armZ = -0.14 - 1.75 * k;
    armX = -0.3 - 0.28 * k;           // club wraps behind the shoulder
    torY = 0.55 * k;
    headY = -0.38 * k;
  } else if (mode === 'thru') {       // downswing → follow-through
    const b = backK === undefined ? 1 : backK;
    armZ = lerp(-0.14 - 1.75 * b, 1.7, k);
    armX = lerp(-0.3 - 0.28 * b, -0.5, k);
    torY = lerp(0.55 * b, -0.8, k);
    headY = lerp(-0.38 * b, 0.35, k);
  } else if (mode === 'hold') {       // held finish while the ball flies
    armZ = 1.7; armX = -0.5; torY = -0.8; headY = 0.35;
  } else {                            // idle address waggle
    armZ = -0.08 + Math.sin(t * 1.3) * 0.035;
    torY = Math.sin(t * 0.9) * 0.015;
    headY = 0;
  }
  arms.rotation.z = armZ;
  arms.rotation.x = armX;
  torso.rotation.y = torY;
  head.rotation.y = headY;
}

  new THREE.MeshBasicMaterial({ color: 0xfff0b0, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }));
ringMesh.rotation.x = -Math.PI / 2;
ringMesh.visible = false;
ringMesh.renderOrder = 2;
const ringRim = new THREE.Mesh(
  new THREE.RingGeometry(1.3, 2.42, 26),

ringRim.position.z = -0.03;   // local z = world down after the -90° tilt

/* ── particle pools (sand puff / splash / confetti) ── */
function makePool(n, size, colors) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), colA = new Float32Array(n * 3);
  const vel = new Float32Array(n * 3), life = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const c = colors[i % colors.length];
    colA[i * 3] = c[0]; colA[i * 3 + 1] = c[1]; colA[i * 3 + 2] = c[2];
    pos[i * 3 + 1] = -999;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.95, depthWrite: false,
  }));
  pts.frustumCulled = false;
  scene.add(pts);
  return { pts, pos, vel, life, n, head: 0, active: 0, geo };
}
const POOL_MUL = LOWFX ? 0.5 : 1;
const psSand = makePool(Math.floor(42 * POOL_MUL), 0.65, [C_SAND, C_SANDLO]);
const psSplash = makePool(Math.floor(56 * POOL_MUL), 0.6, [col(0xbfe4ff), col(0x7fc0e8), col(0xffffff)]);
const psConfetti = makePool(Math.floor(84 * POOL_MUL), 0.7, [col(0xffd24a), col(0xff7a9a), col(0x7ae0ff), col(0xa0ff8a), col(0xffffff)]);
function burst(pool, x, y, z, count, spread, up) {
  for (let k = 0; k < count; k++) {
    const i = pool.head; pool.head = (pool.head + 1) % pool.n;
    pool.pos[i * 3] = x; pool.pos[i * 3 + 1] = y; pool.pos[i * 3 + 2] = z;
    pool.vel[i * 3] = (Math.random() - 0.5) * spread;
    pool.vel[i * 3 + 1] = up * (0.5 + Math.random() * 0.9);
    pool.vel[i * 3 + 2] = (Math.random() - 0.5) * spread;
    pool.life[i] = 1.0 + Math.random() * 0.9;
  }
  pool.active = Math.min(pool.n, pool.active + count);
}
function tickPool(pool, dt) {
  if (!pool.active) return;
  let alive = 0;
  for (let i = 0; i < pool.n; i++) {
    if (pool.life[i] <= 0) continue;
    pool.life[i] -= dt;
    if (pool.life[i] <= 0) { pool.pos[i * 3 + 1] = -999; continue; }
    alive++;
    pool.vel[i * 3 + 1] -= 5.5 * dt;
    pool.pos[i * 3] += pool.vel[i * 3] * dt * 3.5;
    pool.pos[i * 3 + 1] += pool.vel[i * 3 + 1] * dt * 3.5;
    pool.pos[i * 3 + 2] += pool.vel[i * 3 + 2] * dt * 3.5;
  }
  pool.active = alive;
  pool.geo.attributes.position.needsUpdate = true;
}

/* ═══════════ FC-LOOK-1: hole HUD minimap (baked per hole) ═══════════
   Top-down schematic drawn in WORLD space rotated so tee→green runs
   bottom→top (doglegs stay doglegs).  The base canvas bakes at hole build;
   the live canvas redraws base+overlay ONLY when aim/club/ball/turn state
   changes — never per frame (MAPS.draws is the harness's proof).        */
const mapCv = document.getElementById('mapCanvas');
const mapCtx = mapCv ? mapCv.getContext('2d') : null;
const mapBase = document.createElement('canvas');
mapBase.width = 168; mapBase.height = 216;
const MAPS = { ox: 84, oy: 108, s: 1, ux: 0, uz: 1, cx: 0, cz: 0,
               draws: 0, marker: [0, 0], dirty: true };
function mapXY(x, z, out) {
  // world → map: u along tee→green (up), v lateral (right)
  const dx = x - MAPS.cx, dz = z - MAPS.cz;
  const u = dx * MAPS.ux + dz * MAPS.uz;
  const v = dx * MAPS.uz - dz * MAPS.ux;
  out = out || [0, 0];
  out[0] = MAPS.ox + v * MAPS.s;
  out[1] = MAPS.oy - u * MAPS.s;
  return out;
}
const MAP_COLS = { rough: '#1d4520', fw: '#4da03e', fringe: '#3c8a34', green: '#63c353',
  tee: '#4da03e', sand: '#ecdfb2', water: '#2b6a9a', pin: '#f2f0e8' };
function bakeMap(H) {
  if (!mapCtx) return;
  const c = mapBase.getContext('2d');
  const W2 = mapBase.width, H2 = mapBase.height;
  // frame: tee at (0,0); overall direction = tee→green
  const gp = clPoint(H, H.len);
  const gx = gp[0], gz = gp[1];
  const L = Math.hypot(gx, gz) || 1;
  MAPS.ux = gx / L; MAPS.uz = gz / L;
  // extents of the centerline (±corridor) in this frame
  let uMin = 1e9, uMax = -1e9, vMin = 1e9, vMax = -1e9;
  for (const p of H.pts) {
    const u = p[0] * MAPS.ux + p[1] * MAPS.uz;
    const v = p[0] * MAPS.uz - p[1] * MAPS.ux;
    uMin = Math.min(uMin, u - 12); uMax = Math.max(uMax, u + 24);
    vMin = Math.min(vMin, v - 34); vMax = Math.max(vMax, v + 34);
  }
  uMin = Math.min(uMin, -14);
  MAPS.s = Math.min((H2 - 18) / (uMax - uMin), (W2 - 14) / (vMax - vMin));
  // center the frame
  MAPS.cx = 0; MAPS.cz = 0;
  MAPS.ox = W2 / 2 - ((vMin + vMax) / 2) * MAPS.s;
  MAPS.oy = H2 / 2 + ((uMin + uMax) / 2) * MAPS.s;
  const P = (x, z) => mapXY(x, z);
  // rough panel
  c.clearRect(0, 0, W2, H2);
  c.fillStyle = MAP_COLS.rough;
  c.beginPath();
  if (c.roundRect) c.roundRect(0, 0, W2, H2, 6); else c.rect(0, 0, W2, H2);
  c.fill();
  // fairway ribbon: stroke the centerline with the fairway width
  if (H.fw > 0) {
    c.strokeStyle = MAP_COLS.fw;
    c.lineWidth = Math.max(5, H.fw * 2 * MAPS.s);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    const steps = 26;
    for (let i = 0; i <= steps; i++) {
      const d = 8 + (H.len - 14 - 8) * i / steps;
      const w = clWorld(H, d, 0);
      const m = P(w[0], w[1]);
      if (i === 0) c.moveTo(m[0], m[1]); else c.lineTo(m[0], m[1]);
    }
    c.stroke();
  }
  // helper: rotated ellipse at world pos; rx = lateral radius, rz = along
  // radius, (tx,tz) = the along-play tangent at that station
  const ell = (x, z, rx, rz, tx, tz, fill) => {
    const m = P(x, z);
    const sx2 = tx * MAPS.uz - tz * MAPS.ux;          // tangent on screen…
    const sy2 = -(tx * MAPS.ux + tz * MAPS.uz);       // (+y is down)
    const ang = Math.atan2(sy2, sx2) + Math.PI / 2;   // along-axis → vertical
    c.save();
    c.translate(m[0], m[1]);
    c.rotate(ang);
    c.fillStyle = fill;
    c.beginPath();
    c.ellipse(0, 0, Math.max(2, rx * MAPS.s), Math.max(2, rz * MAPS.s), 0, 0, TAU);
    c.fill();
    c.restore();
  };
  // green + fringe (fringe ring first, then green)
  ell(GREEN.x, GREEN.z, GREEN.grx + 4, GREEN.grz + 4, GREEN.tx, GREEN.tz, MAP_COLS.fringe);
  ell(GREEN.x, GREEN.z, GREEN.grx, GREEN.grz, GREEN.tx, GREEN.tz, MAP_COLS.green);
  // water first (creeks under bunker edges), then bunkers
  for (const w of FIELD.wat) {
    if (w.t === 'pond') {
      ell(w.x, w.z, w.rx, w.rz, w.tx, w.tz, MAP_COLS.water);
    } else {
      // creek: thick blue band across the corridor at d
      const a = clWorld(H, w.d, -40), b = clWorld(H, w.d, 40);
      const ma = P(a[0], a[1]), mb = P(b[0], b[1]);
      c.strokeStyle = MAP_COLS.water;
      c.lineWidth = Math.max(3, w.w * MAPS.s);
      c.lineCap = 'butt';
      c.beginPath(); c.moveTo(ma[0], ma[1]); c.lineTo(mb[0], mb[1]); c.stroke();
    }
  }
  for (const b of FIELD.bunk) ell(b.x, b.z, b.rx, b.rz, b.tx, b.tz, MAP_COLS.sand);
  // tee box
  {
    const t = clWorld(H, 3, 0);
    const m = P(t[0], t[1]);
    c.fillStyle = MAP_COLS.tee;
    c.fillRect(m[0] - 7, m[1] - 3, 14, 6);
    c.strokeStyle = 'rgba(242,240,232,0.7)';
    c.lineWidth = 1;
    c.strokeRect(m[0] - 7, m[1] - 3, 14, 6);
  }
  MAPS.dirty = true;
  MAPS.draws = 0;   // fresh hole, fresh counter
}
/* overlay: ball dots + aim line + PROJECTED LANDING from the live arc sim */
const _mp = [0, 0], _mp2 = [0, 0];
function redrawMap() {
  if (!mapCtx) return;
  MAPS.dirty = false;
  MAPS.draws++;
  mapCtx.clearRect(0, 0, mapCv.width, mapCv.height);
  mapCtx.drawImage(mapBase, 0, 0);
  // pin
  mapXY(PIN.x, PIN.z, _mp);
  mapCtx.fillStyle = MAP_COLS.pin;
  mapCtx.beginPath(); mapCtx.arc(_mp[0], _mp[1], 2.2, 0, TAU); mapCtx.fill();
  mapCtx.strokeStyle = MAP_COLS.pin;
  mapCtx.lineWidth = 1.4;
  mapCtx.beginPath(); mapCtx.moveTo(_mp[0], _mp[1]); mapCtx.lineTo(_mp[0], _mp[1] - 7); mapCtx.stroke();
  mapCtx.fillStyle = '#ffd218';
  mapCtx.beginPath();
  mapCtx.moveTo(_mp[0], _mp[1] - 7); mapCtx.lineTo(_mp[0] + 5, _mp[1] - 5.4); mapCtx.lineTo(_mp[0], _mp[1] - 3.8);
  mapCtx.closePath(); mapCtx.fill();
  const p = (typeof activeP === 'function') ? activeP() : null;
  if (p && (state === 'address' || state === 'meter' || state === 'greenread')) {
    // aim line: ball → projected landing (from the arc sim)
    mapXY(p.ball.x, p.ball.z, _mp);
    mapXY(SHOT.landX, SHOT.landZ, _mp2);
    mapCtx.strokeStyle = 'rgba(255,250,230,0.85)';
    mapCtx.lineWidth = 1.6;
    mapCtx.setLineDash([3, 3]);
    mapCtx.beginPath(); mapCtx.moveTo(_mp[0], _mp[1]); mapCtx.lineTo(_mp2[0], _mp2[1]); mapCtx.stroke();
    mapCtx.setLineDash([]);
    // projected landing marker: gold ring on a dark rim
    mapCtx.strokeStyle = 'rgba(8,26,16,0.9)';
    mapCtx.lineWidth = 3.6;
    mapCtx.beginPath(); mapCtx.arc(_mp2[0], _mp2[1], 4.6, 0, TAU); mapCtx.stroke();
    mapCtx.strokeStyle = '#ffd75e';
    mapCtx.lineWidth = 1.8;
    mapCtx.beginPath(); mapCtx.arc(_mp2[0], _mp2[1], 4.6, 0, TAU); mapCtx.stroke();
    MAPS.marker = [_mp2[0], _mp2[1]];
  }
  // ball dots (per player color)
  for (let i = 0; i < PLAYERS.length; i++) {
    const pl = PLAYERS[i];
    if (!pl || pl.holed) continue;
    mapXY(pl.ball.x, pl.ball.z, _mp);
    mapCtx.fillStyle = i === 0 ? '#ff8f7a' : '#7ab8ff';
    mapCtx.beginPath(); mapCtx.arc(_mp[0], _mp[1], 3.4, 0, TAU); mapCtx.fill();
    mapCtx.fillStyle = '#ffffff';
    mapCtx.beginPath(); mapCtx.arc(_mp[0], _mp[1], 1.6, 0, TAU); mapCtx.fill();
  }
}

/* ═══════════ FC-LOOK-1: the one-pass post grade + __fcLook ═══════════ */
let lookRT = null, postScene = null, postCam = null, postMat = null;
function buildLookRT(samples) {
  if (lookRT) lookRT.dispose();
  lookRT = new THREE.WebGLRenderTarget(VW, VH, { depthBuffer: true, samples: samples ? 4 : 0 });
  if (postMat) postMat.uniforms.tDiffuse.value = lookRT.texture;
}
function applyTune() {
  sunLight.intensity = LOOK_TUNE.sun;
  hemiLight.intensity = LOOK_TUNE.hemi;
  renderer.toneMappingExposure = LOOK_TUNE.exp;
  if (!postMat) return;
  postMat.uniforms.lift.value.fromArray(LOOK_TUNE.lift);
  postMat.uniforms.gain.value.fromArray(LOOK_TUNE.gain);
  postMat.uniforms.gamma.value.fromArray(LOOK_TUNE.gamma);
  postMat.uniforms.sat.value = LOOK_TUNE.sat;
  postMat.uniforms.vig.value = LOOK_TUNE.vig;
}
if (LOOK) {
  buildLookRT(FX.msaa);
  postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: lookRT.texture },
      vig: { value: LOOK_TUNE.vig }, sat: { value: LOOK_TUNE.sat },
      lift: { value: new THREE.Vector3().fromArray(LOOK_TUNE.lift) },
      gain: { value: new THREE.Vector3().fromArray(LOOK_TUNE.gain) },
      gamma: { value: new THREE.Vector3().fromArray(LOOK_TUNE.gamma) },
    },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float vig, sat;',
      'uniform vec3 lift, gain, gamma; varying vec2 vUv;',
      'void main(){',
      '  vec3 c = texture2D(tDiffuse, vUv).rgb;',
      '  c = max(vec3(0.0), (c - lift) * gain);         /* black point + gain */',
      '  c = pow(c, gamma);                             /* contrast restore  */',
      '  float g = dot(c, vec3(0.299, 0.587, 0.114));',
      '  c = mix(vec3(g), c, sat);                      /* saturation        */',
      '  vec2 d = vUv - 0.5;',
      '  c *= 1.0 - vig * smoothstep(0.28, 0.72, dot(d, d) * 2.2); /* vignette */',
      '  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);',
      '}'].join('\n'),
    depthTest: false, depthWrite: false,
  });
  postScene = new THREE.Scene();
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
}
/* tri count of everything that casts into the 1024 map (budget ≤ ~30k) */
function casterTris() {
  let t = 0;
  scene.traverse(o => {
    if (o.isMesh && o.castShadow && o.geometry && o.geometry.attributes.position) {
      t += o.geometry.attributes.position.count / 3;
    }
  });
  return Math.round(t);
}
/* live kiosk A/B handle — toggles + tune knobs, no rebuilds needed */
window.__fcLook = {
  look: LOOK, fx: FX, tune: LOOK_TUNE,
  renderer, scene, camera, sunLight, hemiLight,
  get rt() { return lookRT; }, get postMat() { return postMat; },
  casterTris,
  set(k, v) { LOOK_TUNE[k] = v; applyTune(); return LOOK_TUNE[k]; },
  toggle(name, on) {
    if (!LOOK) return false;
    if (name === 'shadow') {
      FX.shadow = !!on;
      renderer.shadowMap.enabled = FX.shadow;
      sunLight.castShadow = FX.shadow;
      scene.traverse(o => { if (o.material && o.material.isMeshLambertMaterial) o.material.needsUpdate = true; });
    } else if (name === 'post') {
      FX.post = !!on;
    } else if (name === 'msaa') {
      FX.msaa = !!on;
      buildLookRT(FX.msaa);
    } else if (name === 'grade') {
      if (on) applyTune();
      else if (postMat) {
        postMat.uniforms.lift.value.set(0, 0, 0);
        postMat.uniforms.gain.value.set(1, 1, 1);
        postMat.uniforms.gamma.value.set(1, 1, 1);
        postMat.uniforms.sat.value = 1;
        postMat.uniforms.vig.value = 0;
      }
    }
    return { shadow: FX.shadow, post: FX.post, msaa: FX.msaa };
  },
};
